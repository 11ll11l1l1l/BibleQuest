 <radialGradient id="sun"><stop stop-color="#fff2cf"/><stop offset=".15" stop-color="#ffe2ae" stop-opacity=".9"/><stop offset=".55" stop-color="#dbb88c" stop-opacity=".3"/><stop offset="1" stop-color="#e2b779" stop-opacity="0"/></radialGradient>
 <linearGradient id="curtain" x2="1" y2=".24"><stop stop-color="#0c2530"/><stop offset=".42" stop-color="#28424a"/><stop offset=".8" stop-color="#41545b"/><stop offset="1" stop-color="#0e2730"/></linearGradient>
 <linearGradient id="windowWood" x2="1" y2="0"><stop stop-color="#251d1c"/><stop offset=".5" stop-color="#8a6550"/><stop offset="1" stop-color="#362924"/></linearGradient>
