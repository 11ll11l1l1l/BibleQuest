name: BibleQuest inherited static regression suite
description: Runs the version-neutral static compatibility gate inherited across BibleQuest releases.

runs:
  using: composite
  steps:
    - name: Run Cloudflare deployment gate
      shell: bash
      run: bash build.sh
    - name: Run accumulated architecture validators
      shell: bash
      run: |
        for script in scripts/validate-v3-architecture.mjs scripts/validate-v3-private-notes.mjs scripts/validate-v3-cloud-notes.mjs scripts/validate-v3-congregation-membership.mjs scripts/validate-v3-operational-recovery.mjs scripts/validate-v3-client-diagnostics.mjs scripts/validate-v3-pwa-install.mjs scripts/validate-v3-offline-shell.mjs scripts/validate-v3-offline-bible-packs.mjs scripts/validate-v3-backup.mjs scripts/validate-v3-couples-family.mjs scripts/validate-v3-couples-cloud.mjs scripts/validate-v3-journey-groups.mjs scripts/validate-v3-encouragements.mjs scripts/validate-v3-community-bridge.mjs scripts/validate-v3-presence.mjs scripts/validate-v3-team-center.mjs scripts/validate-v3-trusted-score-events.mjs scripts/validate-v3-leaderboards.mjs scripts/validate-v3-congregation-recognition.mjs scripts/validate-v3-assignments.mjs scripts/validate-v3-advanced-assignments.mjs scripts/validate-v3-assignment-push.mjs scripts/validate-v3-ministry-hub.mjs scripts/validate-v3-notification-center.mjs scripts/validate-v3-workspace.mjs scripts/validate-v3-linked-activities.mjs scripts/validate-v3-personality-profile.mjs scripts/validate-v3-psychometrics.mjs scripts/validate-v3-step-context.mjs scripts/validate-v3-japanese-kougo.mjs scripts/validate-v3-japanese-vocabulary.mjs scripts/validate-v3-japanese-furigana.mjs scripts/validate-v3-nlt-licensed.mjs scripts/validate-v3-source-labels.mjs scripts/validate-v3-doctrinal-safety.mjs scripts/validate-v3-avatar-vault.mjs scripts/validate-v3-innovation-suite.mjs scripts/validate-v3-tutorial-onboarding.mjs scripts/validate-v3-tutorial-avatar-reactions.mjs scripts/validate-v3-accessibility.mjs scripts/validate-v3-content-reporting.mjs scripts/validate-v3-content-moderation.mjs scripts/validate-v3-content-review.mjs scripts/validate-v3-admin-console.mjs scripts/validate-v3-admin-operations.mjs scripts/validate-v3-reset-recovery.mjs scripts/validate-v3-same-room-play-together.mjs scripts/validate-v3-live-rooms.mjs scripts/validate-v3-bible-world.mjs scripts/validate-v3-bible-world-artwork.mjs scripts/validate-v3-kids-memory.mjs scripts/validate-v3-calendar.mjs; do node "$script"; done
    - name: Run accumulated edge regressions
      shell: bash
      run: |
        for test in tests/v3-workflow-contract-edge.mjs tests/v4-assignment-self-only-edge.mjs tests/v4-bootstrap-order-edge.mjs tests/v4-foundation-static.mjs tests/v4-shell-static.mjs tests/v4-home-dashboard-static.mjs tests/v4-home-assignments-edge.mjs tests/v4-calendar-static.mjs tests/v4-assignments-static.mjs tests/v4-daily-journey-static.mjs tests/v4-progress-static.mjs tests/v4-primary-family-static.mjs tests/v4-learn-composition-static.mjs tests/v4-reader-static.mjs tests/v4-games-avatar-static.mjs tests/v4-tranche13-static.mjs tests/v4-more-grouping-static.mjs tests/v4-home-rail-static.mjs tests/v4-custom-art-static.mjs tests/v4-whole-app-audit-static.mjs tests/v4-assignment-presence-rls-static.mjs tests/v4-admin-emergency-actions-static.mjs tests/v4-presence-active-count-static.mjs tests/v4-help-tutorial-static.mjs tests/v4-tranche11-static.mjs tests/v4-community-family-static.mjs tests/v4-couples-journey-edge.mjs tests/v4-couples-journey-static.mjs tests/v3-account-edge.mjs tests/v3-account-phase-b-static.mjs tests/v3-reader-edge.mjs tests/v3-offline-bible-packs-edge.mjs tests/v3-backup-edge.mjs tests/v3-couples-family-edge.mjs tests/v3-couples-cloud-edge.mjs tests/v3-journey-groups-edge.mjs tests/v3-encouragements-edge.mjs tests/v3-community-bridge-edge.mjs tests/v3-presence-edge.mjs tests/v3-team-center-edge.mjs tests/v3-trusted-score-events-edge.mjs tests/v3-leaderboards-edge.mjs tests/v3-congregation-recognition-edge.mjs tests/v3-assignments-edge.mjs tests/v3-advanced-assignments-edge.mjs tests/v3-assignment-push-edge.mjs tests/v3-assignment-response-auth-edge.mjs tests/v3-assignment-publish-auth-edge.mjs tests/v3-ministry-hub-edge.mjs tests/v3-notification-center-edge.mjs tests/v3-workspace-edge.mjs tests/v3-linked-activities-edge.mjs tests/v3-personality-profile-edge.mjs tests/v3-psychometrics-edge.mjs tests/v3-step-context-edge.mjs tests/v3-japanese-kougo-edge.mjs tests/v3-japanese-vocabulary-edge.mjs tests/v3-japanese-furigana-edge.mjs tests/v3-nlt-licensed-edge.mjs tests/v3-source-labels-edge.mjs tests/v3-doctrinal-safety-edge.mjs tests/v3-doctrinal-context-presentation-edge.mjs tests/v3-avatar-vault-edge.mjs tests/v3-avatar-vault-phase-b-static.mjs tests/v3-innovation-suite-edge.mjs tests/v3-tutorial-onboarding-edge.mjs tests/v3-tutorial-avatar-reactions-edge.mjs tests/v3-accessibility-edge.mjs tests/v3-content-reporting-edge.mjs tests/v3-content-moderation-edge.mjs tests/v3-content-review-edge.mjs tests/v3-admin-console-edge.mjs tests/v3-admin-operations-edge.mjs tests/v3-reset-recovery-edge.mjs tests/v3-same-room-play-together-edge.mjs tests/v3-live-rooms-edge.mjs tests/v3-bible-world-edge.mjs tests/v3-bible-world-artwork-edge.mjs tests/v3-progress-edge.mjs tests/v3-progress-phase-b-static.mjs tests/v3-lesson-edge.mjs tests/v3-study-edge.mjs tests/v3-deep-questions-edge.mjs tests/v3-story-journey-edge.mjs tests/v3-wisdom-situations-edge.mjs tests/v3-adaptive-learning-edge.mjs tests/v3-adaptive-focus-edge.mjs tests/v3-open-review-edge.mjs tests/v3-private-notes-edge.mjs tests/v3-cloud-notes-edge.mjs tests/v3-congregation-membership-edge.mjs tests/v3-operational-recovery-edge.mjs tests/v3-client-diagnostics-edge.mjs tests/v3-pwa-install-edge.mjs tests/v3-offline-shell-edge.mjs tests/v3-daily-mission-edge.mjs tests/v3-transform-edge.mjs tests/v3-transform-basic-edge.mjs tests/v3-recordings-edge.mjs tests/v3-recall-packs-edge.mjs tests/v3-games-edge.mjs tests/v3-games-review-interface-edge.mjs tests/v3-kids-memory-edge.mjs tests/v3-kids-memory-architecture.mjs tests/v3-kids-memory-ui-contract.mjs tests/v3-kids-memory-progress-integration.mjs tests/v3-kids-memory-round-id.mjs tests/v3-kids-memory-exit.mjs tests/v3-kids-memory-reward-curve.mjs tests/v3-kids-memory-api-surface.mjs tests/v3-kids-memory-invalid-input.mjs tests/v3-kids-memory-immutability.mjs tests/v3-kids-memory-no-xp.mjs tests/v3-kids-memory-width-contract.mjs tests/v3-kids-memory-delays.mjs tests/v3-calendar-edge.mjs tests/v3-calendar-phase-b-static.mjs tests/v3-mission-phase-b-static.mjs tests/v3-more-phase-b-static.mjs tests/v5-leader-center-edge.mjs tests/v5-leader-center-static.mjs tests/v5-my-journey-edge.mjs tests/v5-my-journey-static.mjs; do node "$test"; done
    - name: Run V5 completion regressions
      shell: bash
      run: |
        node tests/v5-admin-reachability-edge.mjs
        node tests/v5-admin-reachability-static.mjs
        node tests/v5-daily-journey-required-response-static.mjs
        node tests/v5-ministry-calendar-routing-static.mjs
        node tests/v5-quick-recall-resume.mjs
        for test in tests/v5-assignment-lifecycle-static.mjs tests/v5-cebuano-localization.test.mjs tests/v5-transform-scripture-flow.mjs tests/v5-media-categories.mjs tests/v5-journey-variety-static.mjs tests/v5-personal-challenges-static.mjs tests/v5-personal-challenges-edge.mjs tests/v5-personal-challenges-account-sync.mjs tests/v5-explorer-static.mjs tests/v5-explorer-edge.mjs tests/v5-explorer-account-sync.mjs tests/v5-connected-weekly-journey.mjs tests/v5-weekly-journey-state.mjs tests/v5-weekly-journey-account-sync.mjs tests/v5-main-bible-quest-edge.mjs tests/v5-reader-quest-separation.mjs tests/v5-main-bible-quest-account-sync.mjs tests/v5-global-progress-account-sync.mjs tests/v5-progress-leaderboard-bridge.mjs tests/v5-main-bible-quest-static.mjs; do node "$test"; done
        node tests/v5-1-localization-stabilization.mjs
    - name: Syntax-check guarded field harnesses
      shell: bash
      run: |
        node --check tests/v3-field-validation-harness.mjs
        node --check tests/v3-field-linked-assignment-harness.mjs
        node --check tests/v3-field-live-room-harness.mjs
