name: V5 Lab A2 DB Security

on:
  push:
    branches:
      - lab/v5-a2-db-first
    paths:
      - '.github/workflows/v5-lab-a2-db-security.yml'
      - 'supabase/**'
      - 'V5_LAB_A2_STATUS.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v5-lab-a2-db-security.yml'
      - 'supabase/**'
      - 'V5_LAB_A2_STATUS.md'

permissions:
  contents: read
  issues: write

concurrency:
  group: v5-lab-a2-db-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay-and-security:
    name: migration replay + executable security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show tool identity
        run: |
          set -euo pipefail
          echo "commit=${GITHUB_SHA}"
          supabase --version
          docker --version
          psql --version

      - name: Start disposable local Supabase with diagnostics
        id: supabase_start
        run: |
          set -o pipefail
          START_LOG="${RUNNER_TEMP}/v5-a2-supabase-start.log"
          echo "start_log=${START_LOG}" >> "${GITHUB_OUTPUT}"
          supabase start --debug 2>&1 | tee "${START_LOG}"

      - name: Publish sanitized startup failure diagnostic to lab PR
        if: failure() && github.event_name == 'pull_request' && steps.supabase_start.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          START_LOG: ${{ steps.supabase_start.outputs.start_log }}
        run: |
          set -euo pipefail
          MARKER='<!-- v5-lab-a2-startup-diagnostic -->'
          DIAG="${RUNNER_TEMP}/v5-a2-startup-diagnostic.txt"
          BODY="${RUNNER_TEMP}/v5-a2-startup-comment.md"

          grep -Ei 'error|failed|failure|migration|sqlstate|does not exist|already exists|duplicate|syntax|permission denied|cannot|could not' "${START_LOG}" \
            | tail -n 50 \
            | sed -E \
                -e 's/eyJ[A-Za-z0-9._-]{20,}/[REDACTED_JWT]/g' \
                -e 's/((anon|service_role|secret|token|key)[[:space:]_:-]*[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
            > "${DIAG}" || true

          if [ ! -s "${DIAG}" ]; then
            tail -n 80 "${START_LOG}" \
              | sed -E \
                  -e 's/eyJ[A-Za-z0-9._-]{20,}/[REDACTED_JWT]/g' \
                  -e 's/((anon|service_role|secret|token|key)[[:space:]_:-]*[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
              > "${DIAG}"
          fi

          {
            echo "${MARKER}"
            echo "**V5 Lab A2 local Supabase startup diagnostic**"
            echo
            echo "Exact head: \`${GITHUB_SHA}\`"
            echo
            echo '```text'
            cat "${DIAG}"
            echo '```'
          } > "${BODY}"

          COMMENT_ID="$({
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" || true
          } | tail -n 1)"

          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F "body=@${BODY}" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@${BODY}" >/dev/null
          fi

      - name: Replay migrations from zero
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed

      - name: Execute foundational security characterization
        env: &local_postgres
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/0001_security_baseline.sql

      - name: Load deterministic two-congregation fixtures
        env: *local_postgres
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/0001_two_congregations.sql

      - name: Execute congregation isolation RLS characterization
        env: *local_postgres
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/0002_congregation_isolation.sql

      - name: Capture migration state
        if: always()
        run: |
          set +e
          supabase migration list --local
          supabase status

      - name: Stop disposable stack
        if: always()
        run: supabase stop --no-backup
