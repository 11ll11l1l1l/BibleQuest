name: BibleQuest V4 CEBOCB checklist closeout (one-shot)

on:
  push:
    branches:
      - v4/cebocb-preservation-closeout
    paths:
      - .github/workflows/_v4-cebocb-closeout-once.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4/cebocb-preservation-closeout
          fetch-depth: 0
      - name: Mark CEBOCB preservation accepted and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('V4_REQUESTED_FEATURES_ACCEPTANCE_CHECKLIST.md')
          text = path.read_text()
          replacements = {
              '- [ ] Cebuano/Bisaya CEBOCB Reader integration must remain intact through all later V4 changes.': '- [x] Cebuano/Bisaya CEBOCB Reader integration must remain intact through all later V4 changes. **Certified:** focused preservation workflow run `34686990993` passed the full CEBOCB pack + Reader integration contract (66 books / 30,552 text records / 31,103 verse addresses / 457 preserved bridges); dedicated future-change guard merged as PR #138. See `V4_CEBOCB_READER_CERTIFICATION.md`.',
              '- The next named-flow blocker is Couples Journey communication levels/self-assessment; the current Couples service has useful cards/listening/check-in/repair/practice flows but no persistent communication-level/journey-level model.': '- Couples Journey communication levels/self-assessment is certified at `release/v4-couples-journey` and the CEBOCB/Bisaya Reader preservation audit is now also certified; both named-flow acceptance items are closed.',
              '- Custom V4 artwork assets now exist on `main`, including Memory Meadow assets, but artwork integration remains a separate controlled tranche from behavioral certification.': '- The custom V4 artwork program is certified under Section F; remaining unused assets are audit-time choices rather than missing required integrations.',
              '- V4 is **not yet feature/acceptance complete** because Couples Journey, CEBOCB preservation audit, artwork integration, whole-app polish, responsive/accessibility/PWA/device evidence, privacy/field gates and final RC/release gates remain.': '- V4 is **not yet feature/acceptance complete** because whole-app polish, responsive/accessibility/PWA/device evidence, privacy/field gates and final RC/release gates remain.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected checklist text not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/_v4-cebocb-closeout-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V4_REQUESTED_FEATURES_ACCEPTANCE_CHECKLIST.md .github/workflows/_v4-cebocb-closeout-once.yml
          git commit -m 'docs(v4): close CEBOCB Reader preservation acceptance'
          git push origin HEAD:v4/cebocb-preservation-closeout
