name: V5 notification encouragement artwork verify

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'src/features/notification-center/index.js'
      - 'src/features/encouragements/index.js'
      - 'tests/v5-artwork-notification-encouragements.mjs'
      - '.github/workflows/v5-artwork-notification-encouragements-verify.yml'

permissions:
  contents: read

jobs:
  artwork-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Build current application
        run: bash build.sh
      - name: Run focused artwork contract
        run: node tests/v5-artwork-notification-encouragements.mjs
      - name: Run maintained notification and community companions
        run: |
          node tests/v3-notification-center-edge.mjs
          node tests/v4-community-family-static.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bq-v5-artwork-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/bq-v5-artwork-http.log
          exit 1
      - name: Run representative mobile browser regression
        run: timeout 240s node tests/v3-final-mobile-widths-smoke.mjs
      - name: Verify exact source head remained unchanged
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
