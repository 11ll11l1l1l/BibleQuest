name: BibleQuest v3 Home visual verifier 211852b
on:
  push:
    branches: [verify/v3-visual-home-211852b]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 211852b3efbe052b1f4f63ba849a86aba196d6f1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact SHA and diff hygiene
        run: |
          test "$(git rev-parse HEAD)" = "211852b3efbe052b1f4f63ba849a86aba196d6f1"
          test -z "$(git status --porcelain)"
          git diff --check c586db5ce70581f226f5224ebfeece9fd63746f8 211852b3efbe052b1f4f63ba849a86aba196d6f1
      - name: Cloudflare deployment gate
        run: bash build.sh
      - name: Home visual static contract
        run: node tests/v3-home-visual-polish-static.mjs
      - name: Core architecture and accessibility edge guards
        run: |
          node scripts/validate-v3-architecture.mjs
          node scripts/validate-v3-accessibility.mjs
          node tests/v3-accessibility-edge.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bq-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/bq-http.log; exit 1
      - name: Existing shell and accessibility browser regressions
        run: |
          node tests/v3-shell-smoke.mjs
          node tests/v3-accessibility-smoke.mjs
      - name: Home hero desktop and mobile containment
        run: |
          node --input-type=module <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1280,height:800},{width:390,height:844}]){
              const page=await browser.newPage({viewport});
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              await page.locator('[data-bq-shell="v3"]').waitFor();
              const result=await page.locator('.bq-hero').evaluate(hero=>{
                const img=hero.querySelector('img');
                const hr=hero.getBoundingClientRect();
                const ir=img?.getBoundingClientRect();
                return {
                  naturalWidth:img?.naturalWidth||0,
                  naturalHeight:img?.naturalHeight||0,
                  heroRight:hr.right,
                  imageRight:ir?.right||0,
                  imageLeft:ir?.left||0,
                  viewport:document.documentElement.clientWidth,
                  scrollWidth:document.documentElement.scrollWidth
                };
              });
              if(result.naturalWidth<=0||result.naturalHeight<=0)throw new Error(`Hero artwork failed to load at ${viewport.width}px: ${JSON.stringify(result)}`);
              if(result.scrollWidth>result.viewport+1)throw new Error(`Horizontal overflow at ${viewport.width}px: ${JSON.stringify(result)}`);
              if(result.imageRight>result.viewport+1||result.imageLeft<0)throw new Error(`Hero artwork escaped viewport at ${viewport.width}px: ${JSON.stringify(result)}`);
              await page.close();
            }
          } finally { await browser.close(); }
          console.log('BibleQuest v3 Home hero desktop/mobile containment passed.');
          EOF
