name: V5 Couples artwork closeout

on:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'src/ui/couples-family.css'
      - 'src/ui/couples-cloud.css'
      - 'src/features/couples-family/**'
      - 'src/features/couples-cloud/**'
      - 'tests/v5-couples-artwork.mjs'
      - 'tests/v5-couples-artwork-browser.mjs'
      - '.github/workflows/v5-couples-artwork.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  couples-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Build and certify reviewed artwork mapping
        run: |
          set -euo pipefail
          bash build.sh
          node tests/v5-couples-artwork.mjs
          node tests/v5-couples-sharing-reverification.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start BibleQuest locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bq-v5-couples-art.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/bq-v5-couples-art.log
          exit 1
      - name: Prove genuine matches and 390px safety
        run: |
          timeout 240s node tests/v5-couples-artwork-browser.mjs
          timeout 240s node tests/v5-couples-sharing-browser.mjs
      - name: Verify source clean and exact head
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain --untracked-files=no)"
