name: V6 Phase 1 Build Gate

on:
  pull_request:
    branches:
      - v6/architecture-upgrade
    paths:
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.json"
      - "vite.config.mjs"
      - "src/v6/**"
      - "src/app/**"
      - "src/core/**"
      - "src/features/**"
      - "src/content/**"
      - "src/ui/**"
      - "index.html"
      - "_headers"
      - "classic.html"
      - "transform.html"
      - "psychometrics.html"
      - "v5-push-device-field.html"
      - "v6-field-device.html"
      - "v6-push-device-field.html"
      - "v6-field-device.js"
      - "v6-field-device.css"
      - "docs/v6/V6_FIELD_DEVICE_EVIDENCE.md"
      - "docs/v6/V6_CONTENT_MEDIA_PROVENANCE_POLICY.json"
      - "offline-shell-sw.js"
      - "innovation-suite.js"
      - "tests/v3-accessibility-smoke.mjs"
      - "tests/v5-*.mjs"
      - "tests/v6/**"
      - "scripts/v6-toolchain-smoke.mjs"
      - "scripts/v6-lint.mjs"
      - "scripts/v6-format-check.mjs"
      - "scripts/v6-build-evidence.mjs"
      - "scripts/v6-deployment-verify.mjs"
      - "scripts/v6-artifact-integrity.mjs"
      - "scripts/v6-css-build-ownership.mjs"
      - "scripts/v6-content-media-provenance.mjs"
      - "scripts/v6-audit-bsb-upstream-timing-reuse.mjs"
      - "scripts/v6-run-bsb-alignment-regeneration.mjs"
      - "scripts/v6-rc-exact-sha-gate.mjs"
      - ".github/workflows/v6-deployment-verify.yml"
      - ".github/workflows/v6-rc-exact-sha-gate.yml"
      - ".github/workflows/v6-phase1-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v6-phase1-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BQ_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BQ_EXACT_SHA }}

      - name: Prove checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${BQ_EXACT_SHA}"

      - name: Use pinned Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require committed lockfile
        run: test -f package-lock.json

      - name: Deterministic install
        run: npm ci

      - name: V6 toolchain smoke
        run: npm run check:v6-toolchain

      - name: Lint V6 client boundaries
        run: npm run lint

      - name: Verify V6 formatting policy
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: V6 unit tests
        run: npm run unit

      - name: Fetch immutable V5 provenance baseline
        run: git fetch --no-tags --depth=1 origin bce55ca6ce7fda6ebeba004300caf7a77d56e550

      - name: Audit V6 content/media provenance delta
        run: npm run check:v6-content-media-provenance

      - name: Released V5 push lifecycle parity
        run: |
          node tests/v5-push-subscription-persistence.mjs
          node tests/v5-push-subscription-lifecycle.mjs

      - name: Build V6 artifact with exact commit identity
        env:
          BQ_BUILD_SHA: ${{ env.BQ_EXACT_SHA }}
        run: npm run build:v6

      - name: Verify exact-SHA identity and build budgets
        env:
          BQ_BUILD_SHA: ${{ env.BQ_EXACT_SHA }}
        run: npm run check:v6-build-evidence

      - name: Verify Vite owns legacy stylesheet output
        run: node scripts/v6-css-build-ownership.mjs

      - name: Record build artifact inventory
        shell: bash
        run: |
          test -d dist-v6
          find dist-v6 -type f -printf '%s %p\n' | sort -nr | sed -n '1,100p'

      - name: Install pinned browser harness outside application lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start V6 source browser target
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4174 > /tmp/bq-v6-dev.log 2>&1 &
          echo $! > /tmp/bq-v6-dev.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bq-v6-dev.log
          exit 1

      - name: Rendered notification settings Chromium acceptance
        env:
          BQ_V6_DEV_URL: http://127.0.0.1:4174
        run: node tests/v6/notification-settings-browser.mjs

      - name: Media Picture-in-Picture Chromium acceptance
        env:
          BQ_V6_DEV_URL: http://127.0.0.1:4174
        run: node tests/v6/media-pip-browser.mjs

      - name: Reader Media Session Chromium acceptance
        env:
          BQ_V6_DEV_URL: http://127.0.0.1:4174
        run: node tests/v6/reader-media-session-browser.mjs

      - name: Reader verified-alignment synchronization Chromium acceptance
        env:
          BQ_V6_DEV_URL: http://127.0.0.1:4174
        run: node tests/v6/reader-audio-sync-browser.mjs

      - name: Start built artifact preview
        shell: bash
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/bq-v6-preview.log 2>&1 &
          echo $! > /tmp/bq-v6-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bq-v6-preview.log
          exit 1

      - name: Built artifact CSP report-only compatibility
        env:
          BQ_PREVIEW_URL: http://127.0.0.1:4173
        run: node tests/v6/csp-report-only-browser.mjs

      - name: Built artifact CSP enforcing compatibility
        env:
          BQ_PREVIEW_URL: http://127.0.0.1:4173
        run: node tests/v6/csp-enforcing-browser.mjs

      - name: Built artifact automated accessibility
        env:
          BQ_BASE_URL: http://127.0.0.1:4173/
        run: node tests/v3-accessibility-smoke.mjs

      - name: Migrated mobile localization and accessibility matrix
        env:
          BQ_PREVIEW_URL: http://127.0.0.1:4173
        run: node tests/v6/migrated-mobile-localization-browser.mjs

      - name: Built artifact Chromium parity
        env:
          BQ_PREVIEW_URL: http://127.0.0.1:4173
        run: node tests/v6/built-artifact-browser.mjs

      - name: Authenticated Assignments deep-link hydration on built artifact
        env:
          BQ_BASE_URL: http://127.0.0.1:4173/
        run: node tests/v5-auth-deeplink-hydration-browser.mjs

      - name: Built artifact Leader Center Member/Leader/Pastor/Admin role matrix
        env:
          BQ_BASE_URL: http://127.0.0.2:4173/
        run: node tests/v6/leader-center-role-browser.mjs

      - name: Built artifact PWA acceptance
        env:
          BQ_PREVIEW_URL: http://127.0.0.1:4173
        run: node tests/v6/pwa-built-artifact-browser.mjs

      - name: Reader parity accessibility and mobile acceptance
        env:
          BQ_PREVIEW_URL: http://127.0.0.1:4173
        run: node tests/v6/reader-route-acceptance-browser.mjs

      - name: OpenBible BSB chapter playback smoke
        continue-on-error: true
        env:
          BQ_PREVIEW_URL: http://127.0.0.1:4173
          BQ_VERIFY_OPENBIBLE_AUDIO: '1'
        run: node tests/v6/reader-route-acceptance-browser.mjs

      - name: Preview diagnostics
        if: always()
        run: |
          cat /tmp/bq-v6-preview.log || true
          cat /tmp/bq-v6-dev.log || true
