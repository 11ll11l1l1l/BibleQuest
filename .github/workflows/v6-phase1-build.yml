name: V6 Phase 1 Build Gate

on:
  pull_request:
    branches:
      - v6/architecture-upgrade
    paths:
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.json"
      - "vite.config.mjs"
      - "src/v6/**"
      - "tests/v6/**"
      - "scripts/v6-toolchain-smoke.mjs"
      - ".github/workflows/v6-phase1-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v6-phase1-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Bootstrap lockfile only when absent
        id: lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --ignore-scripts
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated lockfile to PR branch
        if: steps.lock.outputs.generated == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(v6): lock Phase 1 toolchain"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Deterministic install
        run: npm ci

      - name: V6 toolchain smoke
        run: npm run check:v6-toolchain

      - name: Typecheck
        run: npm run typecheck

      - name: V6 unit tests
        run: npm run unit:v6

      - name: Build V6 artifact
        run: npm run build:v6

      - name: Record build artifact inventory
        shell: bash
        run: |
          test -d dist-v6
          find dist-v6 -type f -printf '%s %p\n' | sort -nr | head -100
