name: BibleQuest V4 protected-page audit

on:
  pull_request:
    branches:
      - v4/modern-ui-overhaul
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biblequest-v4-protected-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deployment build gate
        run: bash build.sh
      - name: Validate architecture
        run: node scripts/validate-v3-architecture.mjs
      - name: Run protected-page static contracts
        run: node tests/v4-protected-pages-static.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start BibleQuest locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblequest-v4-protected-pages-http.log 2>&1 &
          echo $! > /tmp/biblequest-v4-protected-pages-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/biblequest-v4-protected-pages-http.log
          exit 1
      - name: Run protected-page browser audit
        run: node tests/v4-protected-pages-browser-audit.mjs
      - name: Cross-check account and private-owner browser smokes
        run: |
          node tests/v3-account-browser-smoke.mjs
          node tests/v3-private-notes-browser-smoke.mjs
          node tests/v3-cloud-notes-browser-smoke.mjs
          node tests/v3-congregation-browser-smoke.mjs
          node tests/v3-couples-browser-smoke.mjs
          node tests/v3-journey-groups-browser-smoke.mjs
          node tests/v3-team-center-browser-smoke.mjs
          node tests/v3-assignments-browser-smoke.mjs
          node tests/v3-admin-console-browser-smoke.mjs
          node tests/v3-admin-operations-browser-smoke.mjs
          node tests/v3-reset-recovery-browser-smoke.mjs
          node tests/v3-live-rooms-browser-smoke.mjs
