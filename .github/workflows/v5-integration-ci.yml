name: BibleQuest V5 integration reliability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v5/architecture-upgrade
  push:
    branches:
      - v5/architecture-upgrade

permissions:
  contents: read

concurrency:
  group: biblequest-v5-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    name: V5 reliability contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use supported Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record exact build identity
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --short

      - name: Run inherited deployment/static gate
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh

      - name: Run V5 characterization and reliability tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'v5-*.mjs' -print | sort)
          if (( ${#tests[@]} == 0 )); then
            echo "No V5 characterization tests are present on this candidate yet."
            exit 0
          fi
          printf 'Running %d V5 test file(s):\n' "${#tests[@]}"
          printf ' - %s\n' "${tests[@]}"
          for test_file in "${tests[@]}"; do
            echo "::group::${test_file}"
            node "${test_file}"
            echo "::endgroup::"
          done

      - name: Verify candidate remained clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Validation changed the working tree:" >&2
            git status --short >&2
            exit 1
          fi

  inherited-baseline:
    name: Inherited accumulated regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use supported Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run inherited accumulated baseline
        shell: bash
        run: |
          set -euo pipefail

          legacy_workflow=.github/workflows/v3-regression.yml
          test -f "$legacy_workflow"

          extract_step() {
            local step_name="$1"
            awk -v target="$step_name" '
              $0 == "      - name: " target { found=1; next }
              found && /^        run: / {
                if ($0 != "        run: |") {
                  sub(/^        run: /, "")
                  print
                  exit
                }
                block=1
                next
              }
              block && /^      - / { exit }
              block {
                sub(/^          /, "")
                print
              }
            ' "$legacy_workflow"
          }

          run_inherited_step() {
            local step_name="$1"
            local script
            script="$(extract_step "$step_name")"
            if [[ -z "$script" ]]; then
              echo "Inherited regression step missing or no longer parseable: $step_name" >&2
              exit 1
            fi
            echo "::group::Inherited: $step_name"
            ( eval "$script" )
            echo "::endgroup::"
          }

          inherited_steps=(
            "Run Cloudflare deployment gate"
            "Run accumulated architecture validators"
            "Run accumulated edge regressions"
            "Syntax-check guarded field harnesses"
            "Install Playwright"
            "Install Chromium"
            "Start BibleQuest v3 locally"
            "Run accumulated browser/mobile regressions"
          )

          for step_name in "${inherited_steps[@]}"; do
            run_inherited_step "$step_name"
          done

      - name: Verify exact inherited-baseline candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
