name: V6 Deployed Artifact Verification

on:
  pull_request:
    branches:
      - v6/architecture-upgrade
    paths:
      - "docs/v6/RC_CANDIDATE.json"
      - ".github/workflows/v6-deployment-verify.yml"
      - "scripts/v6-deployment-verify.mjs"
      - "scripts/v6-rc-exact-sha-gate.mjs"
      - "scripts/v6-assemble-rc-certification.mjs"
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Exact BibleQuest Cloudflare Pages preview or production base URL
        required: true
        type: string
      expected_sha:
        description: Full 40-character source SHA to verify; defaults to the selected workflow ref SHA
        required: false
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: v6-deployment-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BQ_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BQ_EXPECTED_SHA }}

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BQ_EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${BQ_EXPECTED_SHA}"

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Deterministic install
        run: npm ci

      - name: Build certified exact-SHA artifact
        env:
          BQ_BUILD_SHA: ${{ env.BQ_EXPECTED_SHA }}
        run: npm run build:v6

      - name: Export certified artifact digest
        shell: bash
        run: |
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('dist-v6/bq-artifact-integrity.json','utf8'));if(!/^[0-9a-f]{64}$/i.test(m.artifactSha256)||m.sourceSha!==process.env.BQ_EXPECTED_SHA)process.exit(1);fs.appendFileSync(process.env.GITHUB_ENV,'BQ_EXPECTED_ARTIFACT_SHA256='+m.artifactSha256.toLowerCase()+'\\n')"

      - name: Resolve exact Cloudflare preview or manual deployment
        id: deployment
        uses: actions/github-script@v7
        env:
          MANUAL_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          EXPECTED_SHA: ${{ env.BQ_EXPECTED_SHA }}
        with:
          github-token: ${{ github.token }}
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const manualUrl = String(process.env.MANUAL_DEPLOYMENT_URL || '').trim();
              if (!manualUrl) {
                core.setFailed('Manual deployment verification requires deployment_url.');
                return;
              }
              core.setOutput('url', manualUrl);
              return;
            }

            const issue_number = context.payload.pull_request?.number;
            const exactSha = String(process.env.EXPECTED_SHA || '').toLowerCase();
            const shortSha = exactSha.slice(0, 7);
            if (!issue_number || exactSha.length !== 40) {
              core.setFailed('PR deployment verification requires an exact PR number and 40-character head SHA.');
              return;
            }

            for (let attempt = 1; attempt <= 36; attempt += 1) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              });
              const match = [...comments].reverse().find((comment) =>
                comment.user?.login === 'cloudflare-workers-and-pages[bot]'
                && String(comment.body || '').includes(`<code>${shortSha}</code>`)
              );
              const url = match?.body?.match(/https:\/\/[a-z0-9-]+\.mybiblequest\.pages\.dev/ig)?.[0];
              if (url) {
                core.info(`Using Cloudflare preview for exact head ${shortSha}: ${url}`);
                core.setOutput('url', url);
                return;
              }
              if (attempt < 36) await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed(`Cloudflare preview for exact head ${shortSha} was not published within the verification window.`);

      - name: Verify deployed bytes and exact source identity
        env:
          BQ_DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: node scripts/v6-deployment-verify.mjs > v6-deployed-artifact-evidence.json

      - name: Wait for exact-SHA pre-deployment RC gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BQ_RC_CANDIDATE_SHA: ${{ env.BQ_EXPECTED_SHA }}
          BQ_RC_EVIDENCE_PROFILE: predeploy
          BQ_RC_WAIT_MS: '4200000'
          BQ_RC_POLL_MS: '15000'
          BQ_RC_EVIDENCE_OUTPUT: v6-rc-predeploy-evidence.json
        run: node scripts/v6-rc-exact-sha-gate.mjs

      - name: Assemble durable exact-SHA RC certification
        env:
          BQ_RC_CANDIDATE_SHA: ${{ env.BQ_EXPECTED_SHA }}
          BQ_RC_PREDEPLOY_EVIDENCE: v6-rc-predeploy-evidence.json
          BQ_RC_DEPLOYMENT_EVIDENCE: v6-deployed-artifact-evidence.json
          BQ_RC_CERTIFICATION_OUTPUT: v6-rc-certification.json
        run: node scripts/v6-assemble-rc-certification.mjs

      - name: Publish RC certification summary
        shell: bash
        run: |
          {
            echo '## V6 exact-SHA RC certification'
            echo
            cat v6-rc-certification.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload exact-SHA RC certification
        uses: actions/upload-artifact@v4
        with:
          name: v6-rc-certification-${{ env.BQ_EXPECTED_SHA }}
          path: |
            v6-rc-certification.json
            v6-rc-predeploy-evidence.json
            v6-deployed-artifact-evidence.json
          if-no-files-found: error
          retention-days: 90
