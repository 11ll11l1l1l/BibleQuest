name: V6 Deployed Artifact Verification

on:
  pull_request:
    branches:
      - v6/architecture-upgrade
    paths:
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "vite.config.mjs"
      - "assets/**"
      - "app-icon.svg"
      - "manifest.webmanifest"
      - "pwa-icon-192.png"
      - "pwa-icon-512.png"
      - "pwa-icon-maskable-512.png"
      - "_headers"
      - "_redirects"
      - "src/**"
      - "index.html"
      - "offline-shell-sw.js"
      - "scripts/v6-artifact-integrity.mjs"
      - "scripts/v6-build-evidence.mjs"
      - "scripts/v6-deployment-verify.mjs"
      - ".github/workflows/v6-deployment-verify.yml"
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Exact BibleQuest Cloudflare Pages preview or production base URL
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: v6-deployment-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v4

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve exact Cloudflare Pages PR preview
        if: github.event_name == 'pull_request'
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${EXPECTED_SHA:0:7}"
          for attempt in {1..24}; do
            body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq 'map(select(.user.login == "cloudflare-workers-and-pages[bot]")) | last | .body // ""')"
            if grep -Fq "<code>${expected}</code>" <<<"${body}" && grep -Fq "Deploy successful!" <<<"${body}"; then
              url="$(grep -oE 'https://[A-Za-z0-9-]+\.mybiblequest\.pages\.dev' <<<"${body}" | head -n1)"
              if [ -n "${url}" ]; then
                echo "url=${url}" >> "${GITHUB_OUTPUT}"
                echo "Resolved exact-head Cloudflare Pages preview: ${url}"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Cloudflare Pages did not report a successful exact-head preview for ${expected}."
          exit 1

      - name: Verify deployed bytes and exact source identity
        env:
          BQ_DEPLOYMENT_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_url || steps.preview.outputs.url }}
          BQ_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/v6-deployment-verify.mjs
