name: V5 Admin local Supabase E2E

on:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'tests/v5-admin-email-change-e2e.mjs'
      - 'tests/v5-admin-email-change-localstack-ci.mjs'
      - 'supabase/functions/bq-admin-ops/index.ts'
      - 'supabase/migrations/20260905_admin_auth_schema_parity.sql'
      - 'supabase/migrations/20260915183000_admin_session_revocation.sql'
      - '.github/workflows/v5-admin-local-supabase-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare isolated minimal local Supabase project
        run: |
          set -euo pipefail
          ROOT="/tmp/bq-v5-admin-local"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cd "$ROOT"
          supabase init
          rm -rf supabase/migrations
          mkdir -p supabase/migrations supabase/functions/bq-admin-ops
          cp "$GITHUB_WORKSPACE/supabase/migrations/20260905_admin_auth_schema_parity.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20260915183000_admin_session_revocation.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/functions/bq-admin-ops/index.ts" supabase/functions/bq-admin-ops/index.ts

      - name: Start isolated local Supabase stack
        run: |
          set -euo pipefail
          cd /tmp/bq-v5-admin-local
          supabase start
          supabase status -o env > /tmp/bq-v5-local-status.env
          set -a
          . /tmp/bq-v5-local-status.env
          set +a
          : "${API_URL:?Supabase CLI did not expose API_URL}"
          : "${ANON_KEY:?Supabase CLI did not expose ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?Supabase CLI did not expose SERVICE_ROLE_KEY}"
          {
            echo "BQ_LOCAL_SUPABASE_URL=$API_URL"
            echo "BQ_LOCAL_ANON_KEY=$ANON_KEY"
            echo "BQ_LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          rm -f /tmp/bq-v5-local-status.env

      - name: Serve exact Admin Edge Function locally
        run: |
          set -euo pipefail
          cd /tmp/bq-v5-admin-local
          supabase functions serve bq-admin-ops > /tmp/bq-v5-admin-function.log 2>&1 &
          echo $! > /tmp/bq-v5-admin-function.pid
          for i in {1..45}; do
            status="$(curl -sS -o /tmp/bq-admin-ready-body -w '%{http_code}'               -X POST               -H "apikey: $BQ_LOCAL_ANON_KEY"               -H "Authorization: Bearer $BQ_LOCAL_ANON_KEY"               -H 'Content-Type: application/json'               --data '{}'               http://127.0.0.1:54321/functions/v1/bq-admin-ops || true)"
            if [ "$status" = "401" ]; then
              exit 0
            fi
            sleep 1
          done
          tail -n 120 /tmp/bq-v5-admin-function.log || true
          exit 1

      - name: Run real Admin email-change harness on isolated local backend
        run: |
          set -euo pipefail
          node tests/v5-admin-email-change-localstack-ci.mjs

      - name: Show local function diagnostics on failure
        if: failure()
        run: |
          if [ -f /tmp/bq-v5-admin-function.log ]; then
            grep -Ei 'error|failed|exception|worker|boot|serve' /tmp/bq-v5-admin-function.log | tail -n 120 || true
          fi

      - name: Verify exact source remains clean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Stop isolated Supabase stack
        if: always()
        run: |
          if [ -d /tmp/bq-v5-admin-local/supabase ]; then
            cd /tmp/bq-v5-admin-local
            supabase stop || true
          fi
