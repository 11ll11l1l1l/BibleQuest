name: V5 Home Today Composition Gap

on:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'src/features/home/**'
      - 'tests/v5-home-today-composition-gap.mjs'
      - '.github/workflows/v5-home-today-composition-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Run focused Home Today composition gap characterization
        run: node tests/v5-home-today-composition-gap.mjs

      - name: Verify source clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
