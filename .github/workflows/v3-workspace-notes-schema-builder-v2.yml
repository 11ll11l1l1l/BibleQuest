name: BibleQuest v3 workspace notes schema repair builder v2

on:
  push:
    branches:
      - verify/v3-workspace-notes-schema-builder-20260911
    paths:
      - .github/workflows/v3-workspace-notes-schema-builder-v2.yml

permissions:
  contents: write

jobs:
  patch-and-focus-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/v3-workspace-notes-schema-builder-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic schema compatibility repair
        run: python3 scripts/tmp_workspace_notes_schema_patch.py
      - name: Focused Cloud Notes and Workspace regressions
        run: |
          node tests/v3-workspace-notes-schema-compat.mjs
          node tests/v3-cloud-notes-edge.mjs
          node tests/v3-workspace-edge.mjs
          node --check src/core/api.js
          node --check src/app/cloud-notes.js
          node --check src/features/cloud-notes/index.js
      - name: Commit verified repair to builder branch
        run: |
          git config user.name "BibleQuest release verifier"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/api.js src/app/cloud-notes.js src/features/cloud-notes/index.js tests/v3-cloud-notes-edge.mjs tests/v3-workspace-notes-schema-compat.mjs
          git commit -m "fix(v3): align Workspace cloud notes with deployed schema"
          git push origin HEAD:verify/v3-workspace-notes-schema-builder-20260911
