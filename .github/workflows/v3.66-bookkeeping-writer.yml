name: BibleQuest v3.66 bookkeeping writer

on:
  push:
    branches:
      - verify/v3.66-bookkeeping-writer-22d0547-20260911

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 22d054725ba983c4fe81fbd220688a3c12ee211c
          fetch-depth: 0
      - name: Assert green functional candidate and unchanged target
        run: |
          test "$(git rev-parse HEAD)" = "22d054725ba983c4fe81fbd220688a3c12ee211c"
          test "$(git ls-remote origin refs/heads/feature/v3-same-room-play-together | cut -f1)" = "22d054725ba983c4fe81fbd220688a3c12ee211c"
      - name: Fetch bookkeeping writer
        run: |
          git fetch origin verify/v3.66-bookkeeping-writer-22d0547-20260911
          git show FETCH_HEAD:.github/scripts/v3.66-bookkeeping-writer.py > /tmp/v3.66-bookkeeping-writer.py
          python3 -m py_compile /tmp/v3.66-bookkeeping-writer.py
      - name: Promote ledger and durable handoff
        run: python3 /tmp/v3.66-bookkeeping-writer.py
      - name: Assert promoted bookkeeping values
        run: |
          grep -F -- '- **Regression-tested:** 92' FEATURE_INVENTORY_V3.md
          grep -F -- '- **Verified:** 1' FEATURE_INVENTORY_V3.md
          grep -F -- '- **Not started:** 7' FEATURE_INVENTORY_V3.md
          grep -F -- '| 94 | Reset/recovery page | Yes | Standalone old | Regression-tested |' FEATURE_INVENTORY_V3.md
          grep -F -- '| 42 | Same-room Play Together | Yes | Clean | Verified |' FEATURE_INVENTORY_V3.md
          grep -F -- 'Strict parity is **93/100**' DEVELOPMENT_STATUS_V3.md
          grep -F -- 'regression stability is **92/100**' DEVELOPMENT_STATUS_V3.md
          grep -F -- '#43 Live Rooms is next' DEVELOPMENT_HANDOFF_V3.md
      - name: Validate promoted same-room architecture
        run: node scripts/validate-v3-same-room-play-together.mjs
      - name: Check diff hygiene
        run: git diff --check
      - name: Commit bookkeeping candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FEATURE_INVENTORY_V3.md DEVELOPMENT_STATUS_V3.md DEVELOPMENT_HANDOFF_V3.md TIMELINE_V3.md scripts/validate-v3-same-room-play-together.mjs
          git commit -m "docs(v3): promote Same-room Play Together verification"
          git push origin HEAD:refs/heads/feature/v3-same-room-play-together
