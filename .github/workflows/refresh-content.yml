name: Refresh BibleQuest content pack

on:
  push:
    branches:
      - main
    paths:
      - "scripts/build_content_pack.py"
      - "scripts/build_story_packs.py"
      - "scripts/build_tagalog_packs.py"
      - "scripts/build_original_language_packs.py"
      - "scripts/apply-doctrinal-safety.js"
      - "scripts/apply-doctrinal-safety.py"
      - "scripts/doctrinal-audit.js"
      - "data/doctrinal-safety.js"
      - ".github/workflows/refresh-content.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout BibleQuest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "BibleQuest Content Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Build app-ready resource pack
        run: |
          python3 scripts/build_content_pack.py
          python3 scripts/build_story_packs.py
          python3 scripts/build_tagalog_packs.py
          python3 scripts/build_original_language_packs.py
      - name: Apply doctrinal safety filter
        run: |
          python3 scripts/apply-doctrinal-safety.py
          node scripts/verify-safety-smoke.js
          node scripts/doctrinal-audit.js
          node scripts/content-audit.js
      - name: Report pack sizes
        run: |
          echo "### BibleQuest content pack" >> "$GITHUB_STEP_SUMMARY"
          du -h data/library/* data/library/translations/* data/packs/* data/packs/*/* data/quarantine/questions/* 2>/dev/null | sort -h | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit refreshed content
        run: |
          git add data/library data/packs data/quarantine
          if git diff --cached --quiet; then
            echo "No resource changes detected."
            exit 0
          fi

          git commit -m "Refresh open Bible resource pack"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Unable to publish refreshed content after retries."
          exit 1