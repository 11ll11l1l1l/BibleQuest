name: Refresh BibleQuest content pack

on:
  push:
    paths:
      - "scripts/build_content_pack.py"
      - ".github/workflows/refresh-content.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout BibleQuest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "BibleQuest Content Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Build app-ready resource pack
        run: python3 scripts/build_content_pack.py
      - name: Report pack sizes
        run: |
          echo "### BibleQuest content pack" >> "$GITHUB_STEP_SUMMARY"
          du -h data/library/* data/library/translations/* 2>/dev/null | sort -h | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit refreshed content
        run: |
          git add data/library
          if git diff --cached --quiet; then
            echo "No resource changes detected."
          else
            git commit -m "Refresh open Bible resource pack"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
