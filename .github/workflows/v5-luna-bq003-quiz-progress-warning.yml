name: V5 Luna BQ-003 Quiz Progress Warning

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'src/app/v5-luna-regression-guards.js'
      - 'src/features/games/index.js'
      - 'tests/v5-luna-bq003-quiz-progress-warning.mjs'
      - '.github/workflows/v5-luna-bq003-quiz-progress-warning.yml'

permissions:
  contents: read

jobs:
  bq003-quiz-progress-warning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Build current application
        run: bash build.sh
      - name: Verify focused proof syntax
        run: node --check tests/v5-luna-bq003-quiz-progress-warning.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bq-v5-bq003-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/bq-v5-bq003-http.log
          exit 1
      - name: Prove BQ-003 on current owners
        run: timeout 240s node tests/v5-luna-bq003-quiz-progress-warning.mjs
      - name: Run accumulated quiz regressions
        run: timeout 240s node tests/test-game-quiz-regression-browser.mjs
      - name: Verify exact source head remained unchanged
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
