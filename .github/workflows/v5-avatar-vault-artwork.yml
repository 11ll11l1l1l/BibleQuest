name: V5 Avatar Vault artwork certification

on:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'src/engines/avatar-vault.js'
      - 'src/features/avatar-vault/index.js'
      - 'assets/avatar-vault-icons.svg'
      - 'assets/v4/avatar-vault/**'
      - 'tests/v5-avatar-vault-artwork.mjs'
      - 'tests/v5-whole-app-glyph-inventory.test.mjs'
      - '.github/workflows/v5-avatar-vault-artwork.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avatar-vault-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current application
        run: bash build.sh
      - name: Certify Avatar Vault artwork mapping
        run: node tests/v5-avatar-vault-artwork.mjs
      - name: Re-run whole-app glyph inventory
        run: node --test tests/v5-whole-app-glyph-inventory.test.mjs
      - name: Verify source clean and exact head
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain --untracked-files=no)"
