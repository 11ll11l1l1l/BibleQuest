name: BibleQuest v3 production offline readiness diagnostic bcaddd1

on:
  push:
    branches:
      - verify/v3-production-offline-diag-bcaddd1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bcaddd1e87e32b336080dec73b723e959b548f8f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify full warm completion before offline reload
        env:
          BQ_BASE_URL: https://mybiblequest.pages.dev/
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const base=process.env.BQ_BASE_URL;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'allow'});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(`page:${e.message}`));
          page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
          try {
            await page.goto(base,{waitUntil:'networkidle',timeout:30000});
            await page.locator('[data-bq-shell="v3"]').waitFor({timeout:15000});
            await page.evaluate(()=>navigator.serviceWorker.ready);
            await page.waitForFunction(async()=>{
              const initiators=new Set(['script','link','css','img']);
              const expected=new Set([location.href]);
              for(const entry of performance.getEntriesByType('resource')){
                if(!initiators.has(String(entry.initiatorType||'')))continue;
                try{const url=new URL(entry.name,location.href);if(url.origin===location.origin)expected.add(url.href)}catch{}
              }
              const name=(await caches.keys()).find(v=>v.startsWith('biblequest-v3-offline-shell-'));
              if(!name)return false;
              const cached=new Set((await (await caches.open(name)).keys()).map(r=>r.url));
              return [...expected].every(url=>cached.has(url));
            },null,{timeout:30000});
            const readiness=await page.evaluate(async()=>{
              const initiators=new Set(['script','link','css','img']);
              const expected=new Set([location.href]);
              for(const entry of performance.getEntriesByType('resource')){
                if(!initiators.has(String(entry.initiatorType||'')))continue;
                try{const url=new URL(entry.name,location.href);if(url.origin===location.origin)expected.add(url.href)}catch{}
              }
              const name=(await caches.keys()).find(v=>v.startsWith('biblequest-v3-offline-shell-'));
              const cached=name?new Set((await (await caches.open(name)).keys()).map(r=>r.url)):new Set();
              return {expected:expected.size,cached:cached.size,missing:[...expected].filter(url=>!cached.has(url)),controller:navigator.serviceWorker.controller?.scriptURL||''};
            });
            console.log('READINESS='+JSON.stringify(readiness,null,2));
            await context.setOffline(true);
            await page.reload({waitUntil:'domcontentloaded',timeout:15000});
            await page.locator('[data-bq-shell="v3"]').waitFor({timeout:15000});
            await page.locator('[data-session-label]',{hasText:'Guest'}).waitFor({timeout:15000});
            const after=await page.evaluate(()=>({heading:document.querySelector('h1')?.textContent?.trim(),shells:document.querySelectorAll('[data-bq-shell="v3"]').length,controller:navigator.serviceWorker.controller?.scriptURL||'',scrollWidth:document.documentElement.scrollWidth,innerWidth}));
            console.log('OFFLINE='+JSON.stringify(after));
            if(after.heading!=='BibleQuest'||after.shells!==1||after.scrollWidth>after.innerWidth+1)throw new Error(`Offline reload contract failed: ${JSON.stringify(after)}`);
            console.log('Production full-warm offline diagnostic passed.');
          } finally {
            await context.setOffline(false).catch(()=>{});
            await browser.close();
          }
          NODE
