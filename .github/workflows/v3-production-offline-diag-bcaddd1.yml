name: BibleQuest v3 production offline readiness diagnostic bcaddd1

on:
  push:
    branches:
      - verify/v3-production-offline-diag-bcaddd1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bcaddd1e87e32b336080dec73b723e959b548f8f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Measure delayed full warm and offline reload
        env:
          BQ_BASE_URL: https://mybiblequest.pages.dev/
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const base=process.env.BQ_BASE_URL;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'allow'});
          const page=await context.newPage();
          const failed=[];
          page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));
          try {
            await page.goto(base,{waitUntil:'networkidle',timeout:30000});
            await page.locator('[data-bq-shell="v3"]').waitFor({timeout:15000});
            await page.evaluate(()=>navigator.serviceWorker.ready);
            const measure=async label=>{
              const value=await page.evaluate(async()=>{
                const initiators=new Set(['script','link','css','img']);
                const expected=new Set([location.href]);
                for(const entry of performance.getEntriesByType('resource')){
                  if(!initiators.has(String(entry.initiatorType||'')))continue;
                  try{const url=new URL(entry.name,location.href);if(url.origin===location.origin)expected.add(url.href)}catch{}
                }
                const name=(await caches.keys()).find(v=>v.startsWith('biblequest-v3-offline-shell-'));
                const cached=name?new Set((await (await caches.open(name)).keys()).map(r=>r.url)):new Set();
                return {expected:expected.size,cached:cached.size,missing:[...expected].filter(url=>!cached.has(url)),controller:navigator.serviceWorker.controller?.scriptURL||''};
              });
              console.log(`${label}=${JSON.stringify(value)}`);
              return value;
            };
            await measure('T0');
            await page.waitForTimeout(5000);
            await measure('T5');
            await page.waitForTimeout(10000);
            const ready=await measure('T15');
            console.log('ONLINE_FAILED='+JSON.stringify(failed));
            await context.setOffline(true);
            let reloadError='';
            try{await page.reload({waitUntil:'domcontentloaded',timeout:15000})}catch(error){reloadError=error.message}
            let offline={};
            try{
              await page.locator('[data-bq-shell="v3"]').waitFor({timeout:15000});
              await page.locator('[data-session-label]',{hasText:'Guest'}).waitFor({timeout:15000});
              offline=await page.evaluate(()=>({heading:document.querySelector('h1')?.textContent?.trim(),shells:document.querySelectorAll('[data-bq-shell="v3"]').length,controller:navigator.serviceWorker.controller?.scriptURL||'',scrollWidth:document.documentElement.scrollWidth,innerWidth}));
            }catch(error){offline={waitError:error.message}}
            console.log('RELOAD_ERROR='+reloadError);
            console.log('OFFLINE='+JSON.stringify(offline));
            if(ready.cached<ready.expected) throw new Error(`Warm did not converge after 15s: ${ready.cached}/${ready.expected}`);
            if(offline.heading!=='BibleQuest'||offline.shells!==1||offline.scrollWidth>offline.innerWidth+1)throw new Error(`Offline reload still failed after full warm: ${JSON.stringify(offline)}`);
            console.log('Delayed full warm and production offline reload passed.');
          } finally {
            await context.setOffline(false).catch(()=>{});
            await browser.close();
          }
          NODE
