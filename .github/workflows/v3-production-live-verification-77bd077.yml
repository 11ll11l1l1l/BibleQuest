name: BibleQuest v3 production live verification 77bd077
on:
  push:
    branches: [verify/v3-production-live-20260911-77bd077]
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77bd0772cb002371cb3ddaa57cf51cd2bea6b7ac
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm exact release identity
        run: test "$(git rev-parse HEAD)" = "77bd0772cb002371cb3ddaa57cf51cd2bea6b7ac"
      - name: Wait for both Cloudflare hosts to match release files
        run: |
          set -euo pipefail
          files=(index.html offline-shell-sw.js src/app/offline-shell.js src/app/bootstrap.js transformation-v2.js)
          bases=(https://mybiblequest.pages.dev/ https://biblequest-7th.pages.dev/)
          for base in "${bases[@]}"; do
            matched=0
            for attempt in $(seq 1 60); do
              ok=1
              for file in "${files[@]}"; do
                tmp="$(mktemp)"
                if ! curl -fsSL --retry 2 --connect-timeout 10 -H 'Cache-Control: no-cache' "${base}${file}?release=77bd077&attempt=${attempt}" -o "$tmp"; then
                  ok=0
                elif ! cmp -s "$file" "$tmp"; then
                  ok=0
                fi
                rm -f "$tmp"
              done
              if [ "$ok" -eq 1 ]; then echo "${base} matches release."; matched=1; break; fi
              sleep 10
            done
            test "$matched" -eq 1
          done
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Canonical shell account navigation
        env: {BQ_BASE_URL: https://mybiblequest.pages.dev/}
        run: timeout 240s node tests/v3-shell-smoke.mjs
      - name: Canonical Reader
        env: {BQ_BASE_URL: https://mybiblequest.pages.dev/}
        run: timeout 240s node tests/v3-reader-smoke.mjs
      - name: Canonical Games
        env: {BQ_BASE_URL: https://mybiblequest.pages.dev/}
        run: timeout 240s node tests/v3-games-smoke.mjs
      - name: Canonical Transform
        env: {BQ_BASE_URL: https://mybiblequest.pages.dev/}
        run: timeout 240s node tests/v3-transform-engine-smoke.mjs
      - name: Canonical accessibility
        env: {BQ_BASE_URL: https://mybiblequest.pages.dev/}
        run: timeout 240s node tests/v3-accessibility-smoke.mjs
      - name: Canonical PWA install
        env: {BQ_BASE_URL: https://mybiblequest.pages.dev/}
        run: timeout 240s node tests/v3-pwa-install-smoke.mjs
      - name: Canonical offline shell
        env: {BQ_BASE_URL: https://mybiblequest.pages.dev/}
        run: timeout 240s node tests/v3-offline-shell-smoke.mjs
      - name: Canonical offline Bible packs
        env: {BQ_BASE_URL: https://mybiblequest.pages.dev/}
        run: timeout 240s node tests/v3-offline-bible-packs-smoke.mjs
      - name: Compatibility offline shell
        env: {BQ_BASE_URL: https://biblequest-7th.pages.dev/}
        run: timeout 240s node tests/v3-offline-shell-smoke.mjs
      - name: Compatibility basic browser
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'allow'});
            const page=await context.newPage();
            await page.goto('https://biblequest-7th.pages.dev/',{waitUntil:'networkidle',timeout:30000});
            await page.locator('[data-bq-shell="v3"]').waitFor({timeout:15000});
            if((await page.locator('h1').first().textContent())?.trim()!=='BibleQuest')throw new Error('Compatibility host heading mismatch.');
            await page.locator('[data-route-link="learn"]').click();
            await page.waitForURL(/#\/learn$/,{timeout:10000});
            console.log('Compatibility browser smoke passed.');
            await context.close();
          }finally{await browser.close()}
          NODE
