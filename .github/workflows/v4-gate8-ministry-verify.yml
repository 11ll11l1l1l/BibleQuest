name: BibleQuest V4 Gate 8 Ministry verification

on:
  push:
    branches:
      - v4/modern-ui-overhaul
    paths:
      - src/ui/ministry-ops-v4.css
      - index.html
      - tests/v4-ministry-ops-static.mjs
      - src/features/ministry-hub/**
      - src/features/assignments/**
      - src/features/workspace/**
      - src/features/notification-center/**
      - scripts/validate-v3-assignments.mjs
      - scripts/validate-v3-advanced-assignments.mjs
      - scripts/validate-v3-assignment-push.mjs
      - scripts/validate-v3-ministry-hub.mjs
      - scripts/validate-v3-notification-center.mjs
      - scripts/validate-v3-workspace.mjs
      - scripts/validate-v3-linked-activities.mjs
      - tests/v3-assignments-edge.mjs
      - tests/v3-advanced-assignments-edge.mjs
      - tests/v3-assignment-push-edge.mjs
      - tests/v3-assignment-response-auth-edge.mjs
      - tests/v3-assignment-publish-auth-edge.mjs
      - tests/v3-ministry-hub-edge.mjs
      - tests/v3-notification-center-edge.mjs
      - tests/v3-workspace-edge.mjs
      - tests/v3-linked-activities-edge.mjs
      - tests/v3-ministry-hub-smoke.mjs
      - tests/v3-assignments-smoke.mjs
      - tests/v3-advanced-assignments-smoke.mjs
      - tests/v3-assignment-push-smoke.mjs
      - tests/v3-notification-center-smoke.mjs
      - tests/v3-workspace-smoke.mjs
      - tests/v3-linked-activities-smoke.mjs
      - tests/v3-final-mobile-widths-smoke.mjs
      - .github/workflows/v4-gate8-ministry-verify.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: biblequest-v4-gate8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate8:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployment and V4 presentation contracts
        run: |
          bash build.sh
          node tests/v4-ministry-ops-static.mjs
      - name: Gate 8 architecture validators
        run: |
          node scripts/validate-v3-assignments.mjs
          node scripts/validate-v3-advanced-assignments.mjs
          node scripts/validate-v3-assignment-push.mjs
          node scripts/validate-v3-ministry-hub.mjs
          node scripts/validate-v3-notification-center.mjs
          node scripts/validate-v3-workspace.mjs
          node scripts/validate-v3-linked-activities.mjs
      - name: Gate 8 edge regressions
        run: |
          node tests/v3-assignments-edge.mjs
          node tests/v3-advanced-assignments-edge.mjs
          node tests/v3-assignment-push-edge.mjs
          node tests/v3-assignment-response-auth-edge.mjs
          node tests/v3-assignment-publish-auth-edge.mjs
          node tests/v3-ministry-hub-edge.mjs
          node tests/v3-notification-center-edge.mjs
          node tests/v3-workspace-edge.mjs
          node tests/v3-linked-activities-edge.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start BibleQuest locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblequest-v4-gate8-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/biblequest-v4-gate8-http.log
          exit 1
      - name: Gate 8 browser and mobile regressions
        run: |
          timeout 240s node tests/v3-ministry-hub-smoke.mjs
          timeout 240s node tests/v3-assignments-smoke.mjs
          timeout 240s node tests/v3-advanced-assignments-smoke.mjs
          timeout 240s node tests/v3-assignment-push-smoke.mjs
          timeout 240s node tests/v3-notification-center-smoke.mjs
          timeout 240s node tests/v3-workspace-smoke.mjs
          timeout 240s node tests/v3-linked-activities-smoke.mjs
          timeout 240s node tests/v3-final-mobile-widths-smoke.mjs
      - name: Dispatch complete accumulated regression gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v3-regression.yml --ref v4/modern-ui-overhaul
