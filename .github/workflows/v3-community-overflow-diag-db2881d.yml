name: BibleQuest v3 Community overflow diagnostic db2881d
on:
  push:
    branches: [verify/v3-visual-community-overflow-diag-db2881d]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db2881deba6500f20c2a3b205e8bda74f8a81d38
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bq-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/bq-http.log; exit 1
      - name: Diagnose Community ready-view overflow
        run: |
          node --input-type=module <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await page.goto('http://127.0.0.1:4173/#/community',{waitUntil:'networkidle'});
            await page.locator('[data-community-view]').waitFor();
            await page.evaluate(async()=>{
              const {communityPage}=await import('/src/features/community/index.js');
              const host=document.querySelector('#bq-view');
              const state={status:'ready',authenticated:true,remoteAvailable:true,congregations:[{id:'c1',name:'Grace Church',role:'leader',roleLabel:'Leader',canMinistry:true}],groups:[{id:'g1',congregationId:'c1',name:'Faith Group',role:'leader',memberCount:2,maxMembers:6}],encouragementCount:3};
              const bridge={async load(){return state}};
              const view=communityPage({bridge,onNavigate:()=>{},onBack:()=>{},onAccount:()=>{}});
              host.innerHTML=view.html;
              window.__bqCommunityCleanup=view.mount(host);
            });
            await page.locator('[aria-label="Community connection summary"]').waitFor();
            const result=await page.evaluate(()=>{
              const owner=document.querySelector('[data-community-view]');
              const describe=node=>{
                const rect=node.getBoundingClientRect(),style=getComputedStyle(node);
                return {tag:node.tagName.toLowerCase(),className:typeof node.className==='string'?node.className:'',text:(node.textContent||'').trim().replace(/\s+/g,' ').slice(0,160),left:+rect.left.toFixed(1),right:+rect.right.toFixed(1),width:+rect.width.toFixed(1),scrollWidth:node.scrollWidth,clientWidth:node.clientWidth,overflowX:style.overflowX,whiteSpace:style.whiteSpace,overflowWrap:style.overflowWrap,wordBreak:style.wordBreak,minWidth:style.minWidth,maxWidth:style.maxWidth,boxSizing:style.boxSizing};
              };
              const nodes=[owner,...owner.querySelectorAll('*')];
              const internal=nodes.map(describe).filter(item=>item.scrollWidth>item.clientWidth+1).sort((a,b)=>(b.scrollWidth-b.clientWidth)-(a.scrollWidth-a.clientWidth));
              return {owner:describe(owner),internal};
            });
            console.log(JSON.stringify(result,null,2));
            await page.evaluate(()=>window.__bqCommunityCleanup?.());
            await page.close();
          } finally { await browser.close(); }
          EOF
