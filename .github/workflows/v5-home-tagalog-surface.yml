name: V5 Home Tagalog surface

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'src/features/home/index.js'
      - 'src/content/locales/**'
      - 'src/app/localization.js'
      - 'tests/v5-home-tagalog-surface.test.mjs'
      - '.github/workflows/v5-home-tagalog-surface.yml'

permissions:
  contents: read

jobs:
  home-tagalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Build current application
        run: bash build.sh
      - name: Run focused and accumulated localization contracts
        run: |
          node --check src/features/home/index.js
          node --test tests/v5-home-tagalog-surface.test.mjs tests/v5-localization-foundation.test.mjs tests/v5-shared-shell-localization.test.mjs tests/v5-transform-localization.test.mjs
          node tests/v5-localization-qa-current-surfaces.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bq-v5-home-tl-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/bq-v5-home-tl-http.log
          exit 1
      - name: Prove Tagalog Home and Today at 390px
        run: |
          timeout 240s node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.locator('[data-locale-select]').waitFor();
            await page.locator('[data-locale-select]').selectOption('tl');
            await page.waitForFunction(() => document.querySelector('[data-bq-shell="v3"]')?.dataset.locale === 'tl');
            await page.goto('http://127.0.0.1:4173/#/home', { waitUntil: 'networkidle' });
            await page.getByText('Tuklasin · Matuto · Lumago', { exact: true }).waitFor();
            await page.getByText('IYONG PAG-UNLAD', { exact: true }).waitFor();
            await page.getByText('Kongregasyon at Mga Gawain', { exact: true }).waitFor();
            const daily = page.locator('[data-home-daily]');
            assert(await daily.count() === 1, 'Home Today card did not render.');
            assert((await daily.locator('h2').textContent())?.trim() === 'Ipagpatuloy ang Aking Paglalakbay — 4 min', 'Today heading was not localized.');
            assert((await daily.locator('[data-open-daily]').textContent())?.trim() === 'Buksan ang Araw-araw na Paglalakbay', 'Today CTA was not localized.');
            const state = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              railLabel: document.querySelector('[data-home-rail]')?.getAttribute('aria-label'),
              congregationAria: document.querySelector('[data-open-congregation-assignments]')?.getAttribute('aria-label'),
              tutorialAria: document.querySelector('[data-open-tutorial]')?.getAttribute('aria-label'),
              recordingsAria: document.querySelector('[data-open-recordings]')?.getAttribute('aria-label'),
              minControlHeight: Math.min(...[...document.querySelectorAll('[data-open-daily], [data-open-congregation-assignments], [data-home-rail-item], [data-open-tutorial], [data-open-recordings]')].map(node => node.getBoundingClientRect().height))
            }));
            assert(state.railLabel === 'Mabilis na mga shortcut', `Unexpected Home rail label: ${state.railLabel}`);
            assert(state.congregationAria === 'Buksan ang kongregasyon at mga gawain', `Unexpected congregation aria-label: ${state.congregationAria}`);
            assert(state.tutorialAria === 'Ipakita ang gabay sa BibleQuest', `Unexpected tutorial aria-label: ${state.tutorialAria}`);
            assert(state.recordingsAria === 'Manood ng mga video para sa pagsamba at pag-aaral', `Unexpected recordings aria-label: ${state.recordingsAria}`);
            assert(state.scrollWidth <= state.innerWidth + 1, `Tagalog Home overflows at 390px: ${state.scrollWidth}px > ${state.innerWidth}px.`);
            assert(state.minControlHeight >= 40, `Home control height regressed below 40px: ${state.minControlHeight}px.`);
            for (const leak of ['Explore · Learn · Grow','Continue My Journey — 4 min','YOUR PROGRESS','Congregation & Assignments','Show tutorial','Checking recent activity…']) {
              assert(await page.getByText(leak, { exact: true }).count() === 0, `Home localized surface still exposes English UI text: ${leak}`);
            }
            assert(pageErrors.length === 0, `Browser page errors occurred: ${pageErrors.join(' | ')}`);
            console.log('PASS V5 Home/Today Tagalog browser localization');
          } finally {
            await browser.close();
          }
          EOF
      - name: Run existing localized mobile regressions
        run: |
          timeout 240s node tests/v5-shared-shell-localization-browser.mjs
          timeout 240s node tests/v5-transform-localization-browser.mjs
          timeout 240s node tests/v3-final-mobile-widths-smoke.mjs
      - name: Verify exact source head remained unchanged
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code