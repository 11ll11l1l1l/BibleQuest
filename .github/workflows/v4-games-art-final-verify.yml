name: BibleQuest V4 final Games artwork verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v4/modern-ui-overhaul
    paths:
      - 'index.html'
      - 'src/ui/games-art-final-v4.css'
      - 'src/ui/v4-custom-art.css'
      - 'src/features/games/**'
      - 'assets/v4/games/**'
      - 'assets/v4/memory-meadow/**'
      - 'tests/v4-games-art-final-static.mjs'
      - '.github/workflows/v4-games-art-final-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build/deployment gate
        run: bash build.sh
      - name: Run final Games artwork contracts
        run: |
          node tests/v4-games-art-final-static.mjs
          node tests/v4-custom-art-static.mjs
          node tests/v4-games-avatar-static.mjs
          node tests/v3-games-edge.mjs
          node tests/v3-games-review-interface-edge.mjs
          node tests/v3-kids-memory-ui-contract.mjs
          node tests/v3-kids-memory-width-contract.mjs
          node tests/v3-kids-memory-delays.mjs
          node tests/v3-kids-memory-no-xp.mjs
          node tests/v3-same-room-play-together-edge.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start BibleQuest locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblequest-v4-games-http.log 2>&1 &
          echo $! > /tmp/biblequest-v4-games-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/biblequest-v4-games-http.log
          exit 1
      - name: Run focused Games browser regressions
        run: |
          timeout 240s node tests/v3-games-smoke.mjs
          timeout 240s node tests/v3-kids-memory-browser.mjs
          timeout 240s node tests/v3-same-room-play-together-smoke.mjs
