name: V6 Database CI

on:
  pull_request:
    branches:
      - v6/architecture-upgrade
    paths:
      - 'supabase/**'
      - 'scripts/v6-prepare-local-supabase.mjs'
      - 'scripts/v6-prepare-v4-upgrade-supabase.mjs'
      - 'scripts/v6-migration-history-guard.mjs'
      - 'tests/v6/database-ci-contract.test.mjs'
      - 'tests/v6/v4-v6-upgrade-database.test.mjs'
      - 'tests/v6/migration-history-guard.test.ts'
      - 'tests/v6/assignment-assigned-due-push.test.ts'
      - '.github/workflows/v6-database-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Run no-Docker database CI contract
        run: node --test tests/v6/database-ci-contract.test.mjs tests/v6/v4-v6-upgrade-database.test.mjs

      - name: Validate local migration identity inventory
        run: npm run check:v6-migration-history

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Prepare disposable V5-baseline-to-current V6 database
        run: node scripts/v6-prepare-local-supabase.mjs /tmp/bq-v6-db

      - name: Start disposable Supabase stack
        working-directory: /tmp/bq-v6-db
        run: supabase start

      - name: Prove V5-baseline-to-current V6 replay
        working-directory: /tmp/bq-v6-db
        run: supabase db reset

      - name: Run executable RLS and privilege tests
        working-directory: /tmp/bq-v6-db
        run: supabase test db

      - name: Check database functions for errors
        working-directory: /tmp/bq-v6-db
        run: supabase db lint --level error

      - name: Prove generated database types are deterministic and drift-free
        working-directory: /tmp/bq-v6-db
        run: |
          set -euo pipefail
          supabase gen types typescript --local > /tmp/database.types.ts
          supabase gen types typescript --local > /tmp/database.types.second.ts
          cmp /tmp/database.types.ts /tmp/database.types.second.ts
          test -s /tmp/database.types.ts
          echo "Generated database types SHA-256:"
          sha256sum /tmp/database.types.ts
          cp "$GITHUB_WORKSPACE/supabase/database.types.sha256" /tmp/database.types.sha256
          cd /tmp
          sha256sum --check database.types.sha256
          echo "Generated local DB types are deterministic and match the reviewed canonical digest."

      - name: Verify source tree remains unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Stop V5-baseline disposable Supabase stack
        working-directory: /tmp/bq-v6-db
        run: supabase stop

      - name: Prepare disposable V4-to-current V6 database
        run: node scripts/v6-prepare-v4-upgrade-supabase.mjs /tmp/bq-v4-v6-db

      - name: Start V4-upgrade disposable Supabase stack
        working-directory: /tmp/bq-v4-v6-db
        run: supabase start

      - name: Prove V4-to-current V6 replay
        working-directory: /tmp/bq-v4-v6-db
        run: supabase db reset

      - name: Run V4-upgrade RLS and privilege tests
        working-directory: /tmp/bq-v4-v6-db
        run: supabase test db

      - name: Lint V4-upgraded database functions for errors
        working-directory: /tmp/bq-v4-v6-db
        run: supabase db lint --level error

      - name: Verify source tree remains unchanged after V4 upgrade proof
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Stop disposable Supabase stacks
        if: always()
        run: |
          (cd /tmp/bq-v6-db && supabase stop) || true
          (cd /tmp/bq-v4-v6-db && supabase stop) || true
