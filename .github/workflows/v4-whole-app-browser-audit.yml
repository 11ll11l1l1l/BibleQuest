name: BibleQuest V4 whole-app browser audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v4/modern-ui-overhaul
      - main

concurrency:
  group: biblequest-v4-whole-app-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deployment and architecture gates
        run: |
          bash build.sh
          node scripts/validate-v3-architecture.mjs
          node tests/v4-whole-app-audit-static.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start BibleQuest locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblequest-v4-whole-app-http.log 2>&1 &
          echo $! > /tmp/biblequest-v4-whole-app-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/biblequest-v4-whole-app-http.log
          exit 1
      - name: Run whole-app state matrix
        run: node tests/v4-whole-app-browser-states-smoke.mjs
      - name: Run all maintained deep routes and localization stress
        run: node tests/v4-whole-app-deep-routes-smoke.mjs
      - name: Cross-check state handling on independent feature families
        run: |
          node tests/v4-assignments-page-smoke.mjs
          node tests/v4-daily-journey-page-smoke.mjs
          node tests/v3-games-smoke.mjs
          node tests/v3-cloud-notes-smoke.mjs
          node tests/v3-offline-shell-smoke.mjs
          node tests/v3-operational-recovery-smoke.mjs
