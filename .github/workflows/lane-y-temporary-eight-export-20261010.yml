name: Temporary Lane Y eight derivative WebP exports
on:
  push:
    branches:
      - v7/lane-y-legacy-eight-real-webps-20261010
    paths:
      - .github/workflows/lane-y-temporary-eight-export-20261010.yml
permissions:
  contents: write
jobs:
  render:
    if: github.ref == 'refs/heads/v7/lane-y-legacy-eight-real-webps-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image renderer and licensed font fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.8.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fontconfig
      - name: Render only SHA-pinned existing candidates to genuine WebP files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, pathlib, re
          from PIL import Image
          import cairosvg
          base=pathlib.Path('public/v7/images/emotion')
          tasks=[
            ('anxiety-worry','thumbnail.svg','a767392c2244053a1bc7b0bbdc0af1ad03821872c1c842fcf4783413434623c6',(384,480),'thumbnail.webp'),
            ('hurt-betrayal','with-text-en.svg','002ac5199bccadeb19e65b7c9a3ea9f225f15de4d4277ae2616e55036f5840b5',(1024,1280),'with-text-en.webp'),
            ('hurt-betrayal','thumbnail.svg','342b2bbdbcae6d90e22fcff0ca5f78f96d93afa43638a18456950a3423a0ec86',(512,640),'thumbnail.webp'),
            ('rejection','with-text-en.svg','6b0852de1dfe8b51ed6aed7c765bedc4e80dbdef6859513e421761028bb26243',(1024,1280),'with-text-en.webp'),
            ('rejection','thumbnail.svg','b84eff663cd0190569b623b665ccb2b629e96d199bfa716a7182e8c9bd55a334',(384,480),'thumbnail.webp'),
            ('spiritual-dryness-distance','with-text-en.svg','218413ed523d3bdb5613401ba36600c0356aedf0e21b78609e69f31b18b55d6b',(1024,1280),'with-text-en.webp'),
            ('spiritual-dryness-distance','thumbnail.svg','0f2505e071a19d20896c9b8007afda29e4f7b4f61475b6751dfd5fc075b6c663',(400,500),'thumbnail.webp'),
            ('temptation','with-text-en-corrected.svg','9e674f53c1b36d671320194b10651382a50f85c99218028ac930ba169337d32f',(1024,1280),'with-text-en.webp'),
          ]
          actual=[]
          for slot,suffix,expected_hash,size,dest_suffix in tasks:
              source=base/('bqv7-emotion-'+slot+'-01-'+suffix)
              destination=base/('bqv7-emotion-'+slot+'-01-'+dest_suffix)
              raw=source.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==expected_hash,('source changed',str(source))
              assert b'data:image/webp;base64,' in raw,('expected old embedded raster source',str(source))
              assert not re.search(rb'<script\b|<!DOCTYPE\b|<!ENTITY\b|<foreignObject\b|(?:xlink:)?href\s*=\s*["\'](?:https?://|file:)',raw,re.I),('unsafe markup',str(source))
              assert not destination.exists(),('refuse to overwrite existing destination',str(destination))
              png=cairosvg.svg2png(bytestring=raw,output_width=size[0],output_height=size[1])
              with Image.open(io.BytesIO(png)) as image:
                  assert image.size==size
                  result=Image.new('RGB',size,(19,32,43))
                  rgba=image.convert('RGBA')
                  result.paste(rgba,mask=rgba.getchannel('A'))
                  result.save(destination,format='WEBP',quality=94,method=6)
              data=destination.read_bytes()
              with Image.open(io.BytesIO(data)) as check:
                  assert check.format=='WEBP' and check.size==size
              digest=hashlib.sha256(data).hexdigest()
              row={'slot':slot,'kind':'THUMB' if 'thumbnail' in dest_suffix else 'TYPE','sourceSvg':str(source),'sourceSha256':expected_hash,'path':str(destination),'bytes':len(data),'sha256':digest,'width':size[0],'height':size[1]}
              actual.append(row)
              print('EXPORTED',json.dumps(row,sort_keys=True))
          assert len(actual)==8 and len({a['path'] for a in actual})==8
          PY
      - name: Commit exact image bytes to isolated Lane Y branch
        shell: bash
        run: |
          set -euo pipefail
          git add public/v7/images/emotion/*.webp
          git -c user.name="BibleQuest Lane Y" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "art(v7 lane-y): export eight legacy candidate derivatives to actual WebP binaries"
          git push origin HEAD:refs/heads/v7/lane-y-legacy-eight-real-webps-20261010
      - name: Save QA candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-y-eight-raster-candidates
          path: |
            public/v7/images/emotion/bqv7-emotion-anxiety-worry-01-thumbnail.webp
            public/v7/images/emotion/bqv7-emotion-hurt-betrayal-01-with-text-en.webp
            public/v7/images/emotion/bqv7-emotion-hurt-betrayal-01-thumbnail.webp
            public/v7/images/emotion/bqv7-emotion-rejection-01-with-text-en.webp
            public/v7/images/emotion/bqv7-emotion-rejection-01-thumbnail.webp
            public/v7/images/emotion/bqv7-emotion-spiritual-dryness-distance-01-with-text-en.webp
            public/v7/images/emotion/bqv7-emotion-spiritual-dryness-distance-01-thumbnail.webp
            public/v7/images/emotion/bqv7-emotion-temptation-01-with-text-en.webp
          if-no-files-found: warn
          retention-days: 7
