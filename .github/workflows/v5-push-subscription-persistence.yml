name: V5 Push Subscription Persistence

on:
  pull_request:
    branches: [v5/feature-completion]
    paths:
      - 'src/app/push-subscription-persistence.js'
      - 'tests/v5-push-subscription-persistence.mjs'
      - '.github/workflows/v5-push-subscription-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/v5-push-subscription-persistence.mjs
      - run: node --check src/app/push-subscription-persistence.js
