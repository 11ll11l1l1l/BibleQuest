name: Browser smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke PWA reliability guards
        run: node tests/reliability-smoke.mjs
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start BibleQuest locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblequest-http.log 2>&1 &
          echo $! > /tmp/biblequest-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/biblequest-http.log
          exit 1
      - name: Smoke current navigation and reader
        run: timeout 180s node tests/browser-smoke.mjs
      - name: Smoke Reader dependency failures
        run: timeout 180s node tests/reader-resilience-smoke.mjs
      - name: Smoke phone and desktop layouts
        run: timeout 180s node tests/layout-matrix-smoke.mjs
      - name: Smoke installed PWA offline reload
        run: timeout 180s node tests/pwa-offline-smoke.mjs
      - name: Smoke completion-stage modules
        run: timeout 180s node tests/completion-smoke.mjs
      - name: Smoke Daily Journey loop
        run: timeout 180s node tests/journey-loop-smoke.mjs
      - name: Verify cloud-ready state
        run: timeout 180s node tests/cloud-smoke.mjs
