name: Temporary Cloudflare Pages V6 config repair

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-pages-v6-config-repair.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: mybiblequest
    steps:
      - name: Require configured Cloudflare credentials
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          account_id="${CF_ACCOUNT_ID_SECRET:-${CF_ACCOUNT_ID_VAR:-}}"
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "Cloudflare API token is not configured as repository secret CLOUDFLARE_API_TOKEN." >&2
            exit 2
          fi
          if [ -z "$account_id" ]; then
            echo "Cloudflare account ID is not configured as secret or variable CLOUDFLARE_ACCOUNT_ID." >&2
            exit 3
          fi
          echo "::add-mask::$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Read current Pages project configuration
        env:
          CF_ACCOUNT_ID: ${{ steps.creds.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${CF_API_TOKEN}"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}"             > before.json
          jq -e '.success == true and .result.name == env.CF_PROJECT' before.json >/dev/null
          jq '{name:.result.name, sourceType:.result.source.type, productionBranch:.result.production_branch, buildConfig:.result.build_config}' before.json

      - name: Repair V6 build and output configuration
        env:
          CF_ACCOUNT_ID: ${{ steps.creds.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{build_config:{build_command:"npm run build:v6",destination_dir:"dist-v6"}}' > patch.json
          curl --fail-with-body --silent --show-error             --request PATCH             -H "Authorization: Bearer ${CF_API_TOKEN}"             -H "Content-Type: application/json"             --data @patch.json             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}"             > after.json
          jq -e '
            .success == true
            and .result.name == env.CF_PROJECT
            and .result.build_config.build_command == "npm run build:v6"
            and .result.build_config.destination_dir == "dist-v6"
          ' after.json >/dev/null
          jq '{name:.result.name, sourceType:.result.source.type, productionBranch:.result.production_branch, buildConfig:.result.build_config}' after.json

      - name: Confirm configuration persisted
        env:
          CF_ACCOUNT_ID: ${{ steps.creds.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${CF_API_TOKEN}"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}"             > persisted.json
          jq -e '
            .success == true
            and .result.source.type == "github"
            and .result.build_config.build_command == "npm run build:v6"
            and .result.build_config.destination_dir == "dist-v6"
          ' persisted.json >/dev/null
          jq '{name:.result.name, sourceType:.result.source.type, productionBranch:.result.production_branch, buildConfig:.result.build_config}' persisted.json
