name: V4 RC1 documentation sync

on:
  push:
    branches:
      - verify/v4-rc1-doc-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4/modern-ui-overhaul
          fetch-depth: 0
      - name: Reconcile release-blocking checklist
        env:
          TAIL_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('V4_REQUESTED_FEATURES_ACCEPTANCE_CHECKLIST.md')
          text = p.read_text()
          marker = '## J. Final V4 release candidate / deployment gates\n'
          if text.count(marker) != 1:
              raise SystemExit('expected Section J marker exactly once')
          p.write_text(text.split(marker, 1)[0] + base64.b64decode(os.environ['TAIL_B64']).decode())
          PY
      - name: Commit checklist sync
        run: |
          git config user.name "BibleQuest Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add V4_REQUESTED_FEATURES_ACCEPTANCE_CHECKLIST.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs(v4): reconcile RC1 staging acceptance"
          git push origin HEAD:v4/modern-ui-overhaul
