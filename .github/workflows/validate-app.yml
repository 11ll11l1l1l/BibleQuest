name: Validate BibleQuest app

on:
  push:
    paths:
      - "*.js"
      - "*.css"
      - "data/**"
      - "scripts/**"
      - "supabase/**"
      - "index.html"
      - "manifest.webmanifest"
      - ".github/workflows/validate-app.yml"
  pull_request:
    paths:
      - "*.js"
      - "*.css"
      - "data/**"
      - "scripts/**"
      - "supabase/**"
      - "index.html"
      - "manifest.webmanifest"
      - ".github/workflows/validate-app.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check reader.js
          node --check sequence.js
          node --check storyjourney.js
          node --check transformation.js
          node --check transformation-taglish.js
          node --check growth.js
          node --check growth-nudge.js
          node --check learning-engine.js
          node --check open-review.js
          node --check ui-taglish.js
          node --check source-labels.js
          node --check extra-games.js
          node --check couples.js
          node --check community.js
          node --check community-bridge.js
          node --check cloud-config.js
          node --check cloud.js
          node --check group-play.js
          node --check modern-home.js
          node --check data/connections.js
          node --check scripts/content-audit.js
          node --check sw.js
      - name: Audit Bible game content
        run: node scripts/content-audit.js
      - name: Check cloud security invariants
        run: |
          grep -q "enabled: false" cloud-config.js
          ! grep -Eiq "service[_-]?role|sb_secret_" cloud-config.js
          grep -q "SUPABASE_SERVICE_ROLE_KEY" supabase/functions/_shared/bq.ts
          grep -q "security invoker" supabase/cloud-stage.sql
          grep -q "revoke all on public.bible_congregation_invites from anon, authenticated" supabase/cloud-stage.sql
      - name: Check required static files
        run: |
          for f in index.html styles.css decks.css reader.css sequence.css storyjourney.css transformation.css transformation-taglish.css growth.css growth-nudge.css learning-engine.css open-review.css ui-enhancements.css extra-games.css couples.css community.css group-play.css cloud.css modern-home.css app.js reader.js sequence.js storyjourney.js transformation.js transformation-taglish.js growth.js growth-nudge.js learning-engine.js open-review.js extra-games.js couples.js community.js community-bridge.js cloud-config.js cloud.js group-play.js source-labels.js ui-taglish.js modern-home.js data/connections.js data/packs/manifest.json scripts/content-audit.js manifest.webmanifest; do test -s "$f"; done
