name: Validate BibleQuest app

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke PWA reliability guards
        run: node tests/reliability-smoke.mjs
      - name: Smoke bounded PWA install
        run: node tests/pwa-install-bounds-static.mjs
      - name: Smoke auth flow invariants
        run: node tests/auth-flow-static-smoke.mjs
      - name: Run repository-owned release validation
        run: node scripts/validate-release.mjs
