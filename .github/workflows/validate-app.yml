name: Validate BibleQuest app

on:
  push:
    paths:
      - "app.js"
      - "reader.js"
      - "sequence.js"
      - "storyjourney.js"
      - "transformation.js"
      - "transformation-taglish.js"
      - "growth.js"
      - "growth-nudge.js"
      - "learning-engine.js"
      - "open-review.js"
      - "data/questions.js"
      - "data/connections.js"
      - "data/packs/manifest.json"
      - "scripts/content-audit.js"
      - "index.html"
      - "styles.css"
      - "decks.css"
      - "reader.css"
      - "sequence.css"
      - "storyjourney.css"
      - "transformation.css"
      - "transformation-taglish.css"
      - "growth.css"
      - "growth-nudge.css"
      - "learning-engine.css"
      - "open-review.css"
      - "sw.js"
      - ".github/workflows/validate-app.yml"
  pull_request:
    paths:
      - "app.js"
      - "reader.js"
      - "sequence.js"
      - "storyjourney.js"
      - "transformation.js"
      - "transformation-taglish.js"
      - "growth.js"
      - "growth-nudge.js"
      - "learning-engine.js"
      - "open-review.js"
      - "data/questions.js"
      - "data/connections.js"
      - "data/packs/manifest.json"
      - "scripts/content-audit.js"
      - "index.html"
      - "styles.css"
      - "decks.css"
      - "reader.css"
      - "sequence.css"
      - "storyjourney.css"
      - "transformation.css"
      - "transformation-taglish.css"
      - "growth.css"
      - "growth-nudge.css"
      - "learning-engine.css"
      - "open-review.css"
      - "sw.js"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js && node --check reader.js && node --check sequence.js && node --check storyjourney.js && node --check transformation.js && node --check transformation-taglish.js && node --check growth.js && node --check growth-nudge.js && node --check learning-engine.js && node --check open-review.js && node --check data/connections.js && node --check scripts/content-audit.js && node --check sw.js
      - name: Audit Bible game content
        run: node scripts/content-audit.js
      - name: Check required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s decks.css
          test -s reader.css
          test -s sequence.css
          test -s storyjourney.css
          test -s transformation.css
          test -s transformation-taglish.css
          test -s transformation-taglish.js
          test -s growth.css
          test -s growth.js
          test -s growth-nudge.css
          test -s growth-nudge.js
          test -s learning-engine.css
          test -s learning-engine.js
          test -s open-review.css
          test -s open-review.js
          test -s data/connections.js
          test -s data/packs/manifest.json
          test -s scripts/content-audit.js
          test -s manifest.webmanifest
