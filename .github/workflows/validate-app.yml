name: Validate BibleQuest app

on:
  push:
    paths:
      - "app.js"
      - "reader.js"
      - "sequence.js"
      - "storyjourney.js"
      - "transformation.js"
      - "transformation-taglish.js"
      - "growth.js"
      - "index.html"
      - "styles.css"
      - "decks.css"
      - "reader.css"
      - "sequence.css"
      - "storyjourney.css"
      - "transformation.css"
      - "transformation-taglish.css"
      - "growth.css"
      - "sw.js"
      - ".github/workflows/validate-app.yml"
  pull_request:
    paths:
      - "app.js"
      - "reader.js"
      - "sequence.js"
      - "storyjourney.js"
      - "transformation.js"
      - "transformation-taglish.js"
      - "growth.js"
      - "index.html"
      - "styles.css"
      - "decks.css"
      - "reader.css"
      - "sequence.css"
      - "storyjourney.css"
      - "transformation.css"
      - "transformation-taglish.css"
      - "growth.css"
      - "sw.js"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js && node --check reader.js && node --check sequence.js && node --check storyjourney.js && node --check transformation.js && node --check transformation-taglish.js && node --check growth.js && node --check sw.js
      - name: Check required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s decks.css
          test -s reader.css
          test -s sequence.css
          test -s storyjourney.css
          test -s transformation.css
          test -s transformation-taglish.css
          test -s transformation-taglish.js
          test -s growth.css
          test -s growth.js
          test -s manifest.webmanifest
