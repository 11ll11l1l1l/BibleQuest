name: V6 RC Exact-SHA Automated Gate

on:
  pull_request:
    branches:
      - v6/architecture-upgrade
    paths:
      - "docs/v6/RC_CANDIDATE.json"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character V6 release-candidate SHA to certify
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: v6-rc-exact-sha-${{ github.event.pull_request.number || inputs.candidate_sha || github.ref }}
  cancel-in-progress: false

env:
  BQ_RC_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha }}

jobs:
  certify-automated-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BQ_RC_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BQ_RC_CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          candidate_sha="${BQ_RC_CANDIDATE_SHA,,}"
          test "$(git rev-parse HEAD)" = "${candidate_sha}"
          test -z "$(git status --porcelain)"
          echo "BQ_RC_CANDIDATE_SHA=${candidate_sha}" >> "${GITHUB_ENV}"

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Require one-commit marker-only exact-base RC candidate
        shell: bash
        env:
          BQ_RC_PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          test -f docs/v6/RC_CANDIDATE.json

          read -r -a commit_and_parents <<< "$(git rev-list --parents -n 1 "${BQ_RC_CANDIDATE_SHA}")"
          test "${#commit_and_parents[@]}" -eq 2
          test "${commit_and_parents[0]}" = "${BQ_RC_CANDIDATE_SHA}"
          parent_sha="${commit_and_parents[1]}"
          [[ "${parent_sha}" =~ ^[0-9a-f]{40}$ ]]

          git fetch --no-tags origin v6/architecture-upgrade
          git merge-base --is-ancestor "${parent_sha}" "origin/v6/architecture-upgrade"

          if [[ -n "${BQ_RC_PR_BASE_SHA}" ]]; then
            [[ "${BQ_RC_PR_BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
            test "${parent_sha}" = "${BQ_RC_PR_BASE_SHA,,}"
          fi

          node scripts/v6-rc-candidate-marker.mjs --validate docs/v6/RC_CANDIDATE.json "${parent_sha}"

          mapfile -t changed < <(git diff --name-only "${parent_sha}" "${BQ_RC_CANDIDATE_SHA}")
          printf 'RC candidate changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "docs/v6/RC_CANDIDATE.json"

      - name: Verify RC evidence collector contract
        run: >
          node --experimental-strip-types --test
          tests/v6/rc-exact-sha-gate.test.ts
          tests/v6/rc-candidate-marker.test.ts

      - name: Collect exact-SHA automated-gate evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BQ_RC_EVIDENCE_OUTPUT: v6-rc-exact-sha-evidence.json
          BQ_RC_WAIT_MS: '4500000'
          BQ_RC_POLL_MS: '15000'
        run: node scripts/v6-rc-exact-sha-gate.mjs

      - name: Publish evidence summary
        shell: bash
        run: |
          {
            echo '## V6 RC exact-SHA automated-gate evidence'
            echo
            echo '```json'
            cat v6-rc-exact-sha-evidence.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload exact-SHA evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: v6-rc-exact-sha-evidence-${{ env.BQ_RC_CANDIDATE_SHA }}
          path: v6-rc-exact-sha-evidence.json
          if-no-files-found: error
          retention-days: 90
