name: Temporary V7 Lane D cross-cutting regression

on:
  push:
    branches:
      - v7/p3-d-crosscutting-regression-20261004

permissions:
  contents: read

jobs:
  isolate-v6-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Full V6 default run 1
        continue-on-error: true
        run: npm run unit:v6
      - name: Full V6 default run 2
        continue-on-error: true
        run: npm run unit:v6
      - name: Full V6 serial
        continue-on-error: true
        run: node --experimental-strip-types --test --test-concurrency=1 tests/v6/*.test.ts
      - name: Full V6 concurrency 2
        continue-on-error: true
        run: node --experimental-strip-types --test --test-concurrency=2 tests/v6/*.test.ts
      - name: Full V6 concurrency 4
        continue-on-error: true
        run: node --experimental-strip-types --test --test-concurrency=4 tests/v6/*.test.ts
