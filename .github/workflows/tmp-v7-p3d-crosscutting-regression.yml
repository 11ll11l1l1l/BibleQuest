name: Temporary V7 Lane D cross-cutting regression

on:
  push:
    branches:
      - v7/p3-d-crosscutting-regression-20261004

permissions:
  contents: read

jobs:
  isolate-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: V6 tests a-d
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(tests/v6/[a-d]*.test.ts)
          ((${#files[@]} == 0)) || node --experimental-strip-types --test "${files[@]}"
      - name: V6 tests e-h
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(tests/v6/[e-h]*.test.ts)
          ((${#files[@]} == 0)) || node --experimental-strip-types --test "${files[@]}"
      - name: V6 tests i-l
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(tests/v6/[i-l]*.test.ts)
          ((${#files[@]} == 0)) || node --experimental-strip-types --test "${files[@]}"
      - name: V6 tests m-p
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(tests/v6/[m-p]*.test.ts)
          ((${#files[@]} == 0)) || node --experimental-strip-types --test "${files[@]}"
      - name: V6 tests q-t
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(tests/v6/[q-t]*.test.ts)
          ((${#files[@]} == 0)) || node --experimental-strip-types --test "${files[@]}"
      - name: V6 tests u-z
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(tests/v6/[u-z]*.test.ts)
          ((${#files[@]} == 0)) || node --experimental-strip-types --test "${files[@]}"
