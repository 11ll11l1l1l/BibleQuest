name: V5 Leader Center access reverify

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'tests/v5-leader-center-browser-access.mjs'
      - '.github/workflows/v5-leader-center-access-reverify.yml'

permissions:
  contents: read

jobs:
  leader-center-access:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Build current application
        run: bash build.sh
      - name: Static syntax check
        run: node --check tests/v5-leader-center-browser-access.mjs
      - name: Run existing Leader Center domain contract
        run: node tests/v5-leader-center-edge.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bq-v5-leader-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/bq-v5-leader-http.log
          exit 1
      - name: Prove member denied and leader allowed in Chromium
        run: timeout 240s node tests/v5-leader-center-browser-access.mjs
      - name: Run existing Leader Center smoke regression
        run: timeout 240s node tests/v5-leader-center-smoke.mjs
      - name: Verify exact source head remained unchanged
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
