name: BibleQuest v3 Workspace notes schema verifier 61ee54f
on:
  push:
    branches: [verify/v3-workspace-notes-schema-61ee54f]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 61ee54fac7d352312cef7ffd8010997fa8bc9e51
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact SHA and milestone diff hygiene
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "61ee54fac7d352312cef7ffd8010997fa8bc9e51"
          test -z "$(git status --porcelain)"
          git diff --check 73d39ce6fe0f9db20db62e25fd497a8711f921b0 61ee54fac7d352312cef7ffd8010997fa8bc9e51
          actual="$(git diff --name-only 73d39ce6fe0f9db20db62e25fd497a8711f921b0 61ee54fac7d352312cef7ffd8010997fa8bc9e51 | sort | tr '\n' ' ')"
          expected="src/app/cloud-notes.js src/core/api.js src/features/cloud-notes/index.js tests/v3-cloud-notes-edge.mjs tests/v3-workspace-notes-schema-compat.mjs "
          test "$actual" = "$expected"
      - name: Cloudflare deployment gate
        run: bash build.sh
      - name: Workspace Cloud Notes schema focused gate
        run: |
          set -euo pipefail
          node --check src/core/api.js
          node --check src/app/cloud-notes.js
          node --check src/features/cloud-notes/index.js
          node --check tests/v3-workspace-notes-schema-compat.mjs
          node tests/v3-workspace-notes-schema-compat.mjs
          node tests/v3-cloud-notes-edge.mjs
          node tests/v3-workspace-edge.mjs
          grep -q "book_code" src/core/api.js
          grep -q "book_name" src/core/api.js
          grep -q "order('pinned'" src/core/api.js
          grep -q "noteType:'study'" src/features/cloud-notes/index.js
      - name: Accumulated visual static contracts
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do echo "::group::$f"; node "$f"; echo "::endgroup::"; count=$((count+1)); done < <(find tests -maxdepth 1 -type f -name 'v3-*-visual-polish-static.mjs' | sort)
          test "$count" -eq 16
          echo "Visual static contracts executed: $count"
      - name: Accumulated architecture validators
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do echo "::group::$f"; node "$f"; echo "::endgroup::"; count=$((count+1)); done < <(find scripts -maxdepth 1 -type f -name 'validate-v3-*.mjs' | sort)
          test "$count" -gt 0
          echo "Architecture validators executed: $count"
      - name: Accumulated edge security static regressions
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do echo "::group::$f"; node "$f"; echo "::endgroup::"; count=$((count+1)); done < <(find tests -maxdepth 1 -type f -name 'v3-*-edge.mjs' | sort)
          for f in tests/v3-kids-memory-architecture.mjs tests/v3-kids-memory-ui-contract.mjs tests/v3-kids-memory-progress-integration.mjs tests/v3-kids-memory-round-id.mjs tests/v3-kids-memory-exit.mjs tests/v3-kids-memory-reward-curve.mjs tests/v3-kids-memory-api-surface.mjs tests/v3-kids-memory-invalid-input.mjs tests/v3-kids-memory-immutability.mjs tests/v3-kids-memory-no-xp.mjs tests/v3-kids-memory-width-contract.mjs tests/v3-kids-memory-delays.mjs; do if [ -f "$f" ]; then node "$f"; count=$((count+1)); fi; done
          test "$count" -gt 0
          echo "Edge/security/static regressions executed: $count"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bq-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/bq-http.log; exit 1
      - name: Accumulated browser mobile regressions
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do echo "::group::$f"; timeout 240s node "$f"; echo "::endgroup::"; count=$((count+1)); done < <(find tests -maxdepth 1 -type f -name 'v3-*-smoke.mjs' | sort)
          if [ -f tests/v3-kids-memory-browser.mjs ]; then timeout 240s node tests/v3-kids-memory-browser.mjs; count=$((count+1)); fi
          test "$count" -gt 0
          echo "Browser/mobile regressions executed: $count"
      - name: Release-critical coverage presence
        run: |
          set -euo pipefail
          for f in tests/v3-workspace-notes-schema-compat.mjs tests/v3-cloud-notes-smoke.mjs tests/v3-workspace-smoke.mjs tests/v3-assignment-private-responses.mjs tests/v3-assignments-smoke.mjs tests/v3-advanced-assignments-smoke.mjs tests/v3-assignment-push-smoke.mjs tests/v3-pwa-install-smoke.mjs tests/v3-offline-shell-smoke.mjs tests/v3-offline-bible-packs-smoke.mjs tests/v3-accessibility-smoke.mjs tests/v3-shell-smoke.mjs tests/v3-reader-smoke.mjs tests/v3-games-smoke.mjs tests/v3-transform-engine-smoke.mjs; do test -f "$f"; done
          echo "Workspace schema and release-critical coverage included."
