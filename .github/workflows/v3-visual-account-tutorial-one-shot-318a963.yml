name: BibleQuest v3 Account tutorial visual verifier 318a963
on:
  push:
    branches: [verify/v3-visual-account-tutorial-318a963]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 318a96367fb7cd106625750445f6009b30aa3271
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact SHA and diff hygiene
        run: |
          test "$(git rev-parse HEAD)" = "318a96367fb7cd106625750445f6009b30aa3271"
          test -z "$(git status --porcelain)"
          git diff --check 910aa3fa613370804ba6c61e902e619cf7d365ac 318a96367fb7cd106625750445f6009b30aa3271
      - name: Cloudflare deployment gate
        run: bash build.sh
      - name: Visual static contracts
        run: |
          node tests/v3-home-visual-polish-static.mjs
          node tests/v3-games-visual-polish-static.mjs
          node tests/v3-reader-visual-polish-static.mjs
          node tests/v3-bible-world-visual-polish-static.mjs
          node tests/v3-progress-daily-visual-polish-static.mjs
          node tests/v3-transform-visual-polish-static.mjs
          node tests/v3-study-family-visual-polish-static.mjs
          node tests/v3-account-tutorial-visual-polish-static.mjs
      - name: Accumulated architecture validators
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do echo "::group::$f"; node "$f"; echo "::endgroup::"; count=$((count+1)); done < <(find scripts -maxdepth 1 -type f -name 'validate-v3-*.mjs' | sort)
          test "$count" -gt 0
          echo "Architecture validators executed: $count"
      - name: Accumulated edge security static regressions
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do echo "::group::$f"; node "$f"; echo "::endgroup::"; count=$((count+1)); done < <(find tests -maxdepth 1 -type f -name 'v3-*-edge.mjs' | sort)
          for f in tests/v3-kids-memory-architecture.mjs tests/v3-kids-memory-ui-contract.mjs tests/v3-kids-memory-progress-integration.mjs tests/v3-kids-memory-round-id.mjs tests/v3-kids-memory-exit.mjs tests/v3-kids-memory-reward-curve.mjs tests/v3-kids-memory-api-surface.mjs tests/v3-kids-memory-invalid-input.mjs tests/v3-kids-memory-immutability.mjs tests/v3-kids-memory-no-xp.mjs tests/v3-kids-memory-width-contract.mjs tests/v3-kids-memory-delays.mjs; do if [ -f "$f" ]; then node "$f"; count=$((count+1)); fi; done
          test "$count" -gt 0
          echo "Edge/security/static regressions executed: $count"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bq-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/bq-http.log; exit 1
      - name: Focused accumulated browser regressions
        run: |
          node tests/v3-shell-smoke.mjs
          node tests/v3-tutorial-onboarding-smoke.mjs
          node tests/v3-tutorial-avatar-reactions-smoke.mjs
          node tests/v3-accessibility-smoke.mjs
          node tests/v3-pwa-install-smoke.mjs
          node tests/v3-offline-shell-smoke.mjs
          node tests/v3-offline-bible-packs-smoke.mjs
      - name: Account tutorial visual desktop mobile containment
        run: |
          node --input-type=module <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1280,height:900},{width:390,height:844}]){
              const account=await browser.newPage({viewport});
              await account.goto('http://127.0.0.1:4173/#/account',{waitUntil:'networkidle'});
              await account.locator('.bq-account-panel').waitFor();
              const accountResult=await account.evaluate(()=>{
                const node=document.querySelector('.bq-account-panel');
                const polish=[...document.querySelectorAll('link[rel="stylesheet"]')].find(link=>link.getAttribute('href')==='src/ui/account-visual-polish.css');
                const style=node?getComputedStyle(node):null;
                return {polishLoaded:Boolean(polish),backgroundImage:style?.backgroundImage||'',boxShadow:style?.boxShadow||'',viewport:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth};
              });
              if(!accountResult.polishLoaded)throw new Error(`Account visual stylesheet missing at ${viewport.width}px`);
              if(!accountResult.backgroundImage||accountResult.backgroundImage==='none')throw new Error(`Account visual background missing at ${viewport.width}px: ${JSON.stringify(accountResult)}`);
              if(!accountResult.boxShadow||accountResult.boxShadow==='none')throw new Error(`Account visual shadow missing at ${viewport.width}px: ${JSON.stringify(accountResult)}`);
              if(accountResult.scrollWidth>accountResult.viewport+1)throw new Error(`Account horizontal overflow at ${viewport.width}px: ${JSON.stringify(accountResult)}`);
              await account.close();

              const tutorial=await browser.newPage({viewport});
              await tutorial.goto('http://127.0.0.1:4173/#/home',{waitUntil:'networkidle'});
              await tutorial.locator('[data-open-tutorial]').click();
              await tutorial.locator('.bq-tutorial-dialog').waitFor();
              const tutorialResult=await tutorial.evaluate(()=>{
                const node=document.querySelector('.bq-tutorial-dialog');
                const polish=[...document.querySelectorAll('link[rel="stylesheet"]')].find(link=>link.getAttribute('href')==='src/ui/tutorial-visual-polish.css');
                const style=node?getComputedStyle(node):null;
                return {polishLoaded:Boolean(polish),backgroundImage:style?.backgroundImage||'',boxShadow:style?.boxShadow||'',viewport:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth};
              });
              if(!tutorialResult.polishLoaded)throw new Error(`Tutorial visual stylesheet missing at ${viewport.width}px`);
              if(!tutorialResult.backgroundImage||tutorialResult.backgroundImage==='none')throw new Error(`Tutorial visual background missing at ${viewport.width}px: ${JSON.stringify(tutorialResult)}`);
              if(!tutorialResult.boxShadow||tutorialResult.boxShadow==='none')throw new Error(`Tutorial visual shadow missing at ${viewport.width}px: ${JSON.stringify(tutorialResult)}`);
              if(tutorialResult.scrollWidth>tutorialResult.viewport+1)throw new Error(`Tutorial horizontal overflow at ${viewport.width}px: ${JSON.stringify(tutorialResult)}`);
              await tutorial.close();
            }
          } finally { await browser.close(); }
          console.log('BibleQuest v3 Account/tutorial visual desktop/mobile containment passed.');
          EOF
