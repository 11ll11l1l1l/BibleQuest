name: V5 active congregation switcher reverify

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'src/features/congregation/index.js'
      - 'tests/v5-active-congregation-switcher.test.mjs'
      - 'tests/v5-active-congregation-switcher-browser.mjs'
      - '.github/workflows/v5-active-congregation-switcher-reverify.yml'

permissions:
  contents: read

jobs:
  active-congregation-switcher:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Build current application
        run: bash build.sh
      - name: Run focused Phase 6 static contracts
        run: |
          node --check src/features/congregation/index.js
          node --check tests/v5-active-congregation-switcher.test.mjs
          node --test tests/v5-active-congregation-selection.test.mjs tests/v5-active-congregation-switcher.test.mjs
      - name: Run relevant accumulated congregation contracts
        run: |
          node tests/admin-membership-static.mjs
          node tests/community-role-parity-static.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bq-v5-congregation-switcher-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/bq-v5-congregation-switcher-http.log
          exit 1
      - name: Prove visible switching and mobile-safe behavior in Chromium
        run: timeout 240s node tests/v5-active-congregation-switcher-browser.mjs
      - name: Verify exact source head remained unchanged
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
