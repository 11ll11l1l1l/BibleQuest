name: V5 push subscription lifecycle verify

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v5/feature-completion
      - main
    paths:
      - 'offline-shell-sw.js'
      - 'src/app/push-subscription.js'
      - 'src/app/push-subscription-persistence.js'
      - 'src/app/bootstrap.js'
      - 'src/core/api.js'
      - 'src/features/more/index.js'
      - 'src/ui/push-onboarding.js'
      - 'src/ui/push-onboarding.css'
      - 'index.html'
      - 'tests/v5-push-production-onboarding.mjs'
      - 'tests/v5-push-subscription-lifecycle.mjs'
      - 'tests/v5-push-subscription-persistence.mjs'
      - '.github/workflows/v5-push-subscription-lifecycle.yml'

permissions:
  contents: read

jobs:
  push-subscription-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Build current application
        run: bash build.sh
      - name: Syntax-check push lifecycle owners
        run: |
          node --check src/app/push-subscription.js
          node --check src/app/push-subscription-persistence.js
          node --check src/app/bootstrap.js
          node --check src/core/api.js
          node --check src/features/more/index.js
          node --check tests/v5-push-subscription-lifecycle.mjs
          node --check tests/v5-push-subscription-persistence.mjs
          node --check tests/v5-push-production-onboarding.mjs
          node --check src/ui/push-onboarding.js
          node --check offline-shell-sw.js
      - name: Run focused push lifecycle and persistence contracts
        run: |
          node tests/v5-push-subscription-persistence.mjs
          node tests/v5-push-subscription-lifecycle.mjs
          node tests/v5-push-production-onboarding.mjs
      - name: Verify no V6-style background sync or client secret regression
        run: |
          ! grep -Eiq 'backgroundsync|periodicsync' offline-shell-sw.js
          ! grep -Eiq 'private[_-]?key|vapid[_-]?private|service[_-]?role|sb_secret_' src/app/push-subscription.js src/app/push-subscription-persistence.js offline-shell-sw.js
      - name: Verify exact source head remained unchanged
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
