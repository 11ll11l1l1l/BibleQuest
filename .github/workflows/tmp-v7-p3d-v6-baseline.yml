name: Temporary V7 Lane D V6 baseline

on:
  push:
    branches:
      - v7/p3-d-v6-baseline-20261005

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Released V6 unit suite
        run: npm run unit:v6
