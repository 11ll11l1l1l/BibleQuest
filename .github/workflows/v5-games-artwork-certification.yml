name: V5 Games Artwork Certification

on:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'src/features/games/**'
      - 'src/ui/v4-custom-art.css'
      - 'src/ui/games-art-final-v4.css'
      - 'assets/v4/games/**'
      - 'assets/v4/memory-meadow/**'
      - 'tests/v4-games-art-final-static.mjs'
      - 'tests/v5-games-artwork-certification.mjs'
      - '.github/workflows/v5-games-artwork-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  games-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact candidate
        run: |
          echo "candidate=$(git rev-parse HEAD)"
          test -n "$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate frozen V4 Games artwork layer
        run: node tests/v4-games-art-final-static.mjs
      - name: Certify V5 reviewed Games genuine matches and exceptions
        run: node --test tests/v5-games-artwork-certification.mjs
      - name: Verify source clean
        run: test -z "$(git status --porcelain)"
