name: V6 Client Artifact Security

on:
  pull_request:
    branches:
      - v6/architecture-upgrade
    paths:
      - index.html
      - 'src/**'
      - 'public/**'
      - 'vite.config.*'
      - scripts/v6-client-artifact-policy.mjs
      - tests/v6/client-artifact-policy.test.ts
      - tests/v6/client-diagnostics-privacy.test.ts
      - package.json
      - package-lock.json
      - .github/workflows/v6-client-artifact-security.yml
      - docs/v6/RC_CANDIDATE.json
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to run this gate against
        required: false
        type: string

permissions:
  contents: read

env:
  BQ_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

concurrency:
  group: v6-client-artifact-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Build and scan client artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BQ_EXACT_SHA }}

      - name: Prove exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BQ_EXACT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${BQ_EXACT_SHA}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused client privacy regressions
        run: node --experimental-strip-types --test tests/v6/client-artifact-policy.test.ts tests/v6/client-diagnostics-privacy.test.ts

      - name: Build V6 client
        run: npm run build

      - name: Require built artifact
        run: test -d dist-v6

      - name: Scan browser inputs and built client artifact
        run: node scripts/v6-client-artifact-policy.mjs
