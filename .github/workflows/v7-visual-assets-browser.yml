name: V7 Visual Asset Built-Browser QA

on:
  pull_request:
    branches:
      - v7/development
    paths:
      - "data/v7/visual-assets/**"
      - "public/v7/images/**"
      - "scripts/v7-visual-assets-audit.mjs"
      - "scripts/v7-unfinished-image-guidebook-audit.mjs"
      - "docs/v7/unfinished-artwork-guide/**"
      - "AGENTS.md"
      - "docs/v7/V7_MANUAL_CHAT_ARTWORK_ONLY_QA_POLICY_20261011.md"
      - "data/v7/visual-assets/manual-chat-intake/**"
      - "scripts/v7-manual-chat-origin-gate.mjs"
      - "tests/v7/manual-chat-origin-gate.test.mjs"
      - "work/RULEBOOK.md"
      - "docs/v7/V7_EIGHT_STREAM_ARTWORK_EXECUTION_20261009.md"
      - "scripts/v7-visual-coverage-report.mjs"
      - "scripts/v7-manual-candidate-integrity.mjs"
      - "scripts/v7-visual-candidate-triage.mjs"
      - "tests/v7/manual-candidate-integrity.test.mjs"
      - "tests/v7/visual-candidate-triage.test.mjs"
      - "tests/v7/visual-assets-built-browser.mjs"
      - ".github/workflows/v7-visual-assets-browser.yml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character visual-artwork commit to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v7-visual-browser-${{ github.event.pull_request.number || inputs.candidate_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BQ_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha }}
  BQ_PREVIEW_URL: http://127.0.0.1:4173

jobs:
  verify-images:
    name: Exact-SHA audited visual bundles in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate exact selected revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BQ_EXACT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BQ_EXACT_SHA }}

      - name: Verify checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$BQ_EXACT_SHA"

      - name: Use repository pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Reject new or modified SVG V7 artwork
        if: github.event_name == 'pull_request'
        env:
          BQ_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BQ_BASE_SHA"
          bad_svg="$(git diff --name-only --diff-filter=ACMR "$BQ_BASE_SHA" "$BQ_EXACT_SHA" -- public/v7/images/ | grep -E '\.svg$' || true)"
          if test -n "$bad_svg"; then
            echo "New or modified SVG image files violate the V7 high-resolution raster artwork rule:"
            printf '%s\n' "$bad_svg"
            exit 1
          fi

      - name: Require a manual interactive ChatGPT origin receipt for every new or modified image
        if: github.event_name == 'pull_request'
        env:
          BQ_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/v7-manual-chat-origin-gate.mjs --base "$BQ_BASE_SHA" --head "$BQ_EXACT_SHA"

      - name: Test the fail-closed image intake contract
        run: node --test tests/v7/manual-chat-origin-gate.test.mjs

      - name: Verify mandatory source-bound V7 image construction guide
        run: node scripts/v7-unfinished-image-guidebook-audit.mjs

      - name: Fail-closed image masters and localized text audit
        run: |
          node scripts/v7-visual-assets-audit.mjs
          node --test tests/v7/visual-assets-audit.test.mjs tests/v7/visual-coverage-report.test.mjs tests/v7/manual-candidate-integrity.test.mjs tests/v7/visual-candidate-triage.test.mjs

      - name: Build exact candidate
        env:
          BQ_BUILD_SHA: ${{ env.BQ_EXACT_SHA }}
        run: npm run build

      - name: Install isolated Chromium harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start immutable built preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/bq-v7-image-preview.log 2>&1 &
          echo $! > /tmp/bq-v7-image-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bq-v7-image-preview.log
          exit 1

      - name: Verify actual shipped image bytes, Chromium decode and phone layouts
        run: node tests/v7/visual-assets-built-browser.mjs

      - name: Preserve exact-SHA image QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-visual-browser-${{ env.BQ_EXACT_SHA }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/v7/visual-browser/

      - name: Preview diagnostics
        if: failure()
        run: cat /tmp/bq-v7-image-preview.log || true

      - name: Stop ephemeral preview
        if: always()
        run: |
          if test -f /tmp/bq-v7-image-preview.pid; then
            kill "$(cat /tmp/bq-v7-image-preview.pid)" || true
          fi
