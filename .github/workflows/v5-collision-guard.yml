name: BibleQuest V5 collision guard

on:
  workflow_dispatch:
  push:
    branches:
      - v5/feature-completion
  pull_request:
    branches:
      - v5/feature-completion

concurrency:
  group: biblequest-v5-collision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collision-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployable static build
        run: bash build.sh

      - name: Assignment publish auth boundary
        run: node tests/v3-assignment-publish-auth-edge.mjs
      - name: Shell structural contract
        run: node tests/v4-shell-static.mjs
      - name: Home rail structural contract
        run: node tests/v4-home-rail-static.mjs
      - name: Home dashboard structural contract
        run: node tests/v4-home-dashboard-static.mjs
      - name: Assignments structural contract
        run: node tests/v4-assignments-static.mjs
      - name: Calendar structural contract
        run: node tests/v4-calendar-static.mjs
      - name: Tranche 11 owner contract
        run: node tests/v4-tranche11-static.mjs
      - name: Tranche 13 owner contract
        run: node tests/v4-tranche13-static.mjs

      - name: V5 shared-shell localization contract
        run: node tests/v5-shared-shell-localization.test.mjs
      - name: V5 Home localization contract
        run: node tests/v5-home-tagalog-surface.test.mjs
      - name: V5 Assignments localization contract
        run: node tests/v5-assignments-tagalog-surface.test.mjs
      - name: V5 Assignments active-congregation contract
        run: node tests/v5-assignments-active-congregation.test.mjs
      - name: V5 Calendar month-grid contract
        run: node tests/v5-calendar-month-grid-rework.test.mjs
      - name: V5 Calendar localization contract
        run: node tests/v5-calendar-tagalog-surface.test.mjs
      - name: V5 active-congregation selection contract
        run: node tests/v5-active-congregation-selection.test.mjs
      - name: Assignment push boundary contract
        run: node tests/v3-assignment-push-edge.mjs
