name: BibleQuest v3 Couples visual verifier 8525232
on:
  push:
    branches: [verify/v3-visual-couples-8525232]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8525232c5a7498d020f044742518139484a96681
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact SHA and diff hygiene
        run: |
          test "$(git rev-parse HEAD)" = "8525232c5a7498d020f044742518139484a96681"
          test -z "$(git status --porcelain)"
          git diff --check 2679239895da95ed4968af906890575aac02bb24 8525232c5a7498d020f044742518139484a96681
      - name: Cloudflare deployment gate
        run: bash build.sh
      - name: Visual static contracts
        run: |
          node tests/v3-home-visual-polish-static.mjs
          node tests/v3-games-visual-polish-static.mjs
          node tests/v3-reader-visual-polish-static.mjs
          node tests/v3-bible-world-visual-polish-static.mjs
          node tests/v3-progress-daily-visual-polish-static.mjs
          node tests/v3-transform-visual-polish-static.mjs
          node tests/v3-study-family-visual-polish-static.mjs
          node tests/v3-account-tutorial-visual-polish-static.mjs
          node tests/v3-context-source-visual-polish-static.mjs
          node tests/v3-notes-visual-polish-static.mjs
          node tests/v3-couples-visual-polish-static.mjs
      - name: Accumulated architecture validators
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do echo "::group::$f"; node "$f"; echo "::endgroup::"; count=$((count+1)); done < <(find scripts -maxdepth 1 -type f -name 'validate-v3-*.mjs' | sort)
          test "$count" -gt 0
          echo "Architecture validators executed: $count"
      - name: Accumulated edge security static regressions
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do echo "::group::$f"; node "$f"; echo "::endgroup::"; count=$((count+1)); done < <(find tests -maxdepth 1 -type f -name 'v3-*-edge.mjs' | sort)
          for f in tests/v3-kids-memory-architecture.mjs tests/v3-kids-memory-ui-contract.mjs tests/v3-kids-memory-progress-integration.mjs tests/v3-kids-memory-round-id.mjs tests/v3-kids-memory-exit.mjs tests/v3-kids-memory-reward-curve.mjs tests/v3-kids-memory-api-surface.mjs tests/v3-kids-memory-invalid-input.mjs tests/v3-kids-memory-immutability.mjs tests/v3-kids-memory-no-xp.mjs tests/v3-kids-memory-width-contract.mjs tests/v3-kids-memory-delays.mjs; do if [ -f "$f" ]; then node "$f"; count=$((count+1)); fi; done
          test "$count" -gt 0
          echo "Edge/security/static regressions executed: $count"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bq-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/bq-http.log; exit 1
      - name: Accumulated browser mobile regressions
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do echo "::group::$f"; timeout 240s node "$f"; echo "::endgroup::"; count=$((count+1)); done < <(find tests -maxdepth 1 -type f -name 'v3-*-smoke.mjs' | sort)
          if [ -f tests/v3-kids-memory-browser.mjs ]; then timeout 240s node tests/v3-kids-memory-browser.mjs; count=$((count+1)); fi
          test "$count" -gt 0
          echo "Browser/mobile regressions executed: $count"
      - name: Couples visual desktop mobile containment
        run: |
          node --input-type=module <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1280,height:900},{width:390,height:844}]){
              const localPage=await browser.newPage({viewport});
              await localPage.goto('http://127.0.0.1:4173/#/couples-family',{waitUntil:'networkidle'});
              await localPage.locator('[data-couples-mode="card"]').waitFor();
              const localResult=await localPage.evaluate(()=>{
                const node=document.querySelector('.bq-couples-hero');
                const polish=[...document.querySelectorAll('link[rel="stylesheet"]')].find(link=>link.getAttribute('href')==='src/ui/couples-visual-polish.css');
                const style=node?getComputedStyle(node):null;
                return {polishLoaded:Boolean(polish),backgroundImage:style?.backgroundImage||'',boxShadow:style?.boxShadow||'',viewport:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth};
              });
              if(!localResult.polishLoaded)throw new Error(`Couples visual stylesheet missing at ${viewport.width}px`);
              if(!localResult.backgroundImage||localResult.backgroundImage==='none')throw new Error(`Couples local visual background missing at ${viewport.width}px: ${JSON.stringify(localResult)}`);
              if(!localResult.boxShadow||localResult.boxShadow==='none')throw new Error(`Couples local visual shadow missing at ${viewport.width}px: ${JSON.stringify(localResult)}`);
              if(localResult.scrollWidth>localResult.viewport+1)throw new Error(`Couples local horizontal overflow at ${viewport.width}px: ${JSON.stringify(localResult)}`);
              await localPage.locator('[data-couples-mode="repair"]').click();
              await localPage.locator('.bq-couples-safety').waitFor();
              const safety=await localPage.evaluate(()=>getComputedStyle(document.querySelector('.bq-couples-safety')).backgroundImage);
              if(!safety||safety==='none')throw new Error(`Couples safety visual treatment missing at ${viewport.width}px`);
              await localPage.close();

              const cloudPage=await browser.newPage({viewport});
              await cloudPage.goto('http://127.0.0.1:4173/#/couples-cloud',{waitUntil:'networkidle'});
              await cloudPage.locator('[data-couples-cloud-view]').waitFor();
              const cloudResult=await cloudPage.evaluate(()=>{
                const node=document.querySelector('.bq-couples-cloud-message')||document.querySelector('.bq-couples-cloud-privacy')||document.querySelector('.bq-couples-cloud-count');
                const style=node?getComputedStyle(node):null;
                return {backgroundImage:style?.backgroundImage||'',boxShadow:style?.boxShadow||'',viewport:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth};
              });
              if(!cloudResult.backgroundImage||cloudResult.backgroundImage==='none')throw new Error(`Couples cloud visual background missing at ${viewport.width}px: ${JSON.stringify(cloudResult)}`);
              if(cloudResult.scrollWidth>cloudResult.viewport+1)throw new Error(`Couples cloud horizontal overflow at ${viewport.width}px: ${JSON.stringify(cloudResult)}`);
              await cloudPage.close();
            }
          } finally { await browser.close(); }
          console.log('BibleQuest v3 Couples local/cloud visual desktop/mobile containment passed.');
          EOF
