name: V7 Authenticated Built Browser

on:
  pull_request:
    branches:
      - v7/development
    paths:
      - 'src/**'
      - 'tests/v7/**'
      - 'supabase/**'
      - 'scripts/v6-prepare-local-supabase.mjs'
      - '.github/workflows/v7-authenticated-built-browser.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to run this acceptance gate against
        required: true
        type: string

permissions:
  contents: read

env:
  BQ_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha }}

jobs:
  authenticated-built-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      BQ_LOCAL_STATUS_FILE: /tmp/bq-v7-browser-status.json
      BQ_PREVIEW_URL: http://127.0.0.2:4173
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BQ_EXACT_SHA }}
          fetch-depth: 0

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BQ_EXACT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${BQ_EXACT_SHA}"
          test -z "$(git status --porcelain)"

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned browser and accessibility harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Prepare disposable current database
        run: node scripts/v6-prepare-local-supabase.mjs /tmp/bq-v7-browser-db

      - name: Start and reset disposable Supabase stack
        working-directory: /tmp/bq-v7-browser-db
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset

      - name: Capture private disposable stack status
        working-directory: /tmp/bq-v7-browser-db
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          supabase status -o json > "$BQ_LOCAL_STATUS_FILE"
          test -s "$BQ_LOCAL_STATUS_FILE"

      - name: Build exact candidate without CI backend injection
        env:
          BQ_BUILD_SHA: ${{ env.BQ_EXACT_SHA }}
        run: npm run build

      - name: Start exact built preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/bq-v7-preview.log 2>&1 &
          echo $! > /tmp/bq-v7-preview.pid
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' --fail --silent --show-error "$BQ_PREVIEW_URL/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bq-v7-preview.log
          exit 1

      - name: Run authenticated populated built-browser certification
        shell: bash
        run: |
          set -euo pipefail
          node tests/v7/authenticated-built-artifact-browser.mjs

      - name: Preserve authenticated built-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bq-v7-authenticated-built-browser-${{ env.BQ_EXACT_SHA }}
          path: artifacts/v7/authenticated-built-browser-journey.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify tracked source tree remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Stop exact built preview
        if: always()
        shell: bash
        run: |
          if test -f /tmp/bq-v7-preview.pid; then
            kill "$(cat /tmp/bq-v7-preview.pid)" 2>/dev/null || true
          fi
          rm -f "$BQ_LOCAL_STATUS_FILE"

      - name: Stop disposable Supabase stack
        if: always()
        working-directory: /tmp/bq-v7-browser-db
        run: supabase stop || true
