          new="${games.modes.map(mode=>{const last=mode.id==='per-book-recall'?null:games.lastResult(mode.id);return `<article class=\"bq-panel bq-game-card\"><span>${escapeHtml(mode.kicker)}</span><h2>${escapeHtml(mode.title)}</h2><p>${escapeHtml(mode.description)}</p>${last?`<p class=\"bq-game-score\" data-game-last=\"${escapeHtml(mode.id)}\">Last result: <b>${last.score}/${last.total}</b> · +${last.gained} XP</p>`:''}<button type=\"button\" class=\"bq-primary-button\" data-game-launch=\"${escapeHtml(mode.id)}\">${mode.id==='per-book-recall'?'Open recall library':`Play ${escapeHtml(mode.title)}`}</button></article>`}).join('')}<article class=\"bq-panel bq-game-card\" data-same-room-card><span>PASS-AND-PLAY</span><h2>Play Together</h2><p>Share one device with 2–6 players, rotate turns, and keep a local scoreboard.</p><button type=\"button\" class=\"bq-primary-button\" data-same-room-open>Play Together</button></article></section><div class=\"bq-game-footer\">"
