name: BibleQuest v3.66 same-room writer

on:
  push:
    branches:
      - verify/v3.66-same-room-writer

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-same-room-play-together
          fetch-depth: 0
      - name: Assert frozen v3.65 base
        run: test "$(git rev-parse HEAD)" = "ab3584906b3d017ea555416910f23e9414ed2ef8"
      - name: Fetch writer script
        run: git show origin/verify/v3.66-same-room-writer:.github/scripts/v3-same-room-writer.py > /tmp/v3-same-room-writer.py
      - name: Apply and verify targeted milestone
        run: |
          python3 /tmp/v3-same-room-writer.py
          node scripts/validate-v3-same-room-play-together.mjs
          node tests/v3-same-room-play-together-edge.mjs
          git diff --check
      - name: Commit product candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/games.js src/features/games/index.js scripts/validate-v3-same-room-play-together.mjs tests/v3-same-room-play-together-edge.mjs tests/v3-same-room-play-together-smoke.mjs docs/V3_SAME_ROOM_PLAY_TOGETHER_CONTRACT.md .github/workflows/v3-regression.yml
          git commit -m "feat: restore same-room Play Together"
          git push origin HEAD:feature/v3-same-room-play-together
