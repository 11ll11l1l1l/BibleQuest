name: BibleQuest v3.66 same-room writer

on:
  push:
    branches:
      - verify/v3.66-same-room-writer

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab3584906b3d017ea555416910f23e9414ed2ef8
          fetch-depth: 0
      - name: Assert frozen v3.65 base and unchanged target
        run: |
          test "$(git rev-parse HEAD)" = "ab3584906b3d017ea555416910f23e9414ed2ef8"
          test "$(git ls-remote origin refs/heads/feature/v3-same-room-play-together | cut -f1)" = "3d0d3591e10abc45cb24687a6ecd32ca4951bd4d"
      - name: Fetch verified writer
        run: |
          git show origin/verify/v3.66-same-room-writer:.github/scripts/v3-same-room-writer.py > /tmp/v3-same-room-writer.py
          python3 -m py_compile /tmp/v3-same-room-writer.py
      - name: Apply milestone patch
        run: |
          mkdir -p docs
          python3 /tmp/v3-same-room-writer.py 2>&1 | tee /tmp/v3-same-room-writer.log
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-v3-same-room-play-together.mjs')
          text=p.read_text()
          old='| 42 | Same-room Play Together | 2–6 players; rotating turns; scoreboard; finish |'
          new='| 42 | Same-room Play Together | Yes | Clean | Not started | 2–6 players; rotating turns; scoreboard; finish |'
          if old not in text:
              raise SystemExit('same-room inventory validator anchor not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Upload writer diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-same-room-writer-log
          path: /tmp/v3-same-room-writer.log
          if-no-files-found: error
      - name: Validate same-room architecture
        run: node scripts/validate-v3-same-room-play-together.mjs
      - name: Run same-room edge regression
        run: node tests/v3-same-room-play-together-edge.mjs
      - name: Check diff hygiene
        run: git diff --check
      - name: Commit product candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/v3-regression.yml
          git add src/app/games.js src/features/games/index.js scripts/validate-v3-same-room-play-together.mjs tests/v3-same-room-play-together-edge.mjs tests/v3-same-room-play-together-smoke.mjs docs/V3_SAME_ROOM_PLAY_TOGETHER_CONTRACT.md
          git commit -m "feat: restore same-room Play Together"
          git push --force-with-lease=refs/heads/feature/v3-same-room-play-together:3d0d3591e10abc45cb24687a6ecd32ca4951bd4d origin HEAD:refs/heads/feature/v3-same-room-play-together
