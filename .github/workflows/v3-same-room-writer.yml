name: BibleQuest v3.66 same-room writer

on:
  push:
    branches:
      - verify/v3.66-same-room-writer

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-same-room-play-together
          fetch-depth: 0
      - name: Assert frozen v3.65 base
        run: test "$(git rev-parse HEAD)" = "ab3584906b3d017ea555416910f23e9414ed2ef8"
      - name: Check service constants and state anchors
        run: |
          grep -Fq "const normalizeAnswer=value=>String(value||'').trim().toLocaleLowerCase();" src/app/games.js
          grep -Fq "  let state=emptyState();" src/app/games.js
      - name: Check service method anchors
        run: |
          grep -Fq "function persistResult(mode,score,total,gained)" src/app/games.js
          grep -Fq "function showLauncher(){state=emptyState();return snapshot()}" src/app/games.js
          grep -Fq "showLauncher,lastResult,leave,xp:XP" src/app/games.js
      - name: Check UI launcher anchor
        run: grep -Fq "}).join('')}</section><div class=\"bq-game-footer\"><button type=\"button\" class=\"bq-secondary-button\" data-game-home>Back home</button></div>" src/features/games/index.js
      - name: Check UI phase and handler anchors
        run: |
          grep -Fq "if(state.phase==='detective')" src/features/games/index.js
          grep -Fq "if(target.closest('[data-detective-replay]'))" src/features/games/index.js
      - name: Check regression workflow anchors
        run: |
          grep -Fq "scripts/validate-v3-reset-recovery.mjs; do" .github/workflows/v3-regression.yml
          grep -Fq "tests/v3-reset-recovery-edge.mjs tests/v3-progress-edge.mjs" .github/workflows/v3-regression.yml
          grep -Fq "tests/v3-reset-recovery-smoke.mjs tests/v3-progress-smoke.mjs" .github/workflows/v3-regression.yml
