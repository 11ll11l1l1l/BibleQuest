          p=Path('src/app/games.js')
          text=p.read_text()
          anchor="const normalizeAnswer=value=>String(value||'').trim().toLocaleLowerCase();"
          addition="""const normalizeAnswer=value=>String(value||'').trim().toLocaleLowerCase();
          const SAME_ROOM_MIN=2,SAME_ROOM_MAX=6;
          const emptySameRoom=()=>({phase:'same-room-setup',players:[],bank:[],index:0,currentPlayerIndex:0,locked:false,selected:null,correct:null});
          """
          if text.count(anchor)!=1: raise SystemExit('games normalize anchor mismatch')
          text=text.replace(anchor,addition,1)
          anchor="  let state=emptyState();"
          replacement="  let state=emptyState();\n  let sameRoom=emptySameRoom();"
