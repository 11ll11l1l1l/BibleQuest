          host.innerHTML=`<section class="bq-panel bq-game-result" data-same-room-complete><p class="bq-eyebrow">PLAY TOGETHER COMPLETE</p><h1>${escapeHtml(result)}</h1><div class="bq-game-stats" data-same-room-scoreboard>${state.players.map(player=>`<div data-same-room-player="${escapeHtml(player.id)}"><b>${player.score}</b><span>${escapeHtml(player.name)}</span></div>`).join('')}</div><div class="bq-game-actions"><button type="button" class="bq-primary-button" data-same-room-open>Play again</button><button type="button" class="bq-secondary-button" data-game-launcher>All games</button></div></section>`;return;
        }
