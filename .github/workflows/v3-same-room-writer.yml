name: BibleQuest v3.66 same-room writer

on:
  push:
    branches:
      - verify/v3.66-same-room-writer

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-same-room-play-together
          fetch-depth: 0
      - name: Assert frozen v3.65 base
        run: test "$(git rev-parse HEAD)" = "ab3584906b3d017ea555416910f23e9414ed2ef8"
      - name: Apply same-room Play Together milestone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if text.count(old)!=1:
