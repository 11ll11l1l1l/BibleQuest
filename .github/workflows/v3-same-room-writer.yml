try{const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});const errors=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(e.message));await page.goto(BASE,{waitUntil:'networkidle'});await page.locator('[data-route-link="play"]').click();await page.waitForURL(/#\/play$/);await page.locator('[data-same-room-open]').click();await page.locator('[data-same-room-setup]').waitFor();assert(await page.locator('[data-same-room-start]').count()===5,'Play Together must offer 2–6 players.');await page.locator('[data-same-room-start="3"]').click();await page.locator('[data-same-room-question="q1"]').waitFor();assert(await page.locator('[data-same-room-player]').count()===3,'Three-player scoreboard missing.');assert((await page.locator('[data-same-room-turn]').textContent())?.includes('Player 1'),'Player 1 must start.');await page.locator('[data-same-room-answer="1"]').click();await page.locator('[data-same-room-feedback]').waitFor();assert((await page.locator('[data-same-room-player="player-1"] b').textContent())==='1','Player 1 score did not increment.');await page.locator('[data-same-room-next]').click();assert((await page.locator('[data-same-room-turn]').textContent())?.includes('Player 2'),'Turn did not rotate to Player 2.');await page.locator('[data-same-room-answer="0"]').click();await page.locator('[data-same-room-next]').click();assert((await page.locator('[data-same-room-turn]').textContent())?.includes('Player 3'),'Turn did not rotate to Player 3.');await page.locator('[data-same-room-finish]').click();await page.locator('[data-same-room-complete]').waitFor();assert(await page.locator('[data-same-room-player]').count()===3,'Final scoreboard missing players.');const metrics=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth,minTarget:Math.min(...[...document.querySelectorAll('[data-games-page] button')].map(node=>node.getBoundingClientRect().height))}));assert(metrics.scrollWidth<=metrics.innerWidth+1,'Play Together mobile overflow.');assert(metrics.minTarget>=44,'Play Together touch target below 44px.');assert(errors.length===0,`Unexpected console/page errors: ${errors.join(' | ')}`);await page.close();console.log('BibleQuest v3 Same-room Play Together browser regression passed.')}finally{await browser.close()}
