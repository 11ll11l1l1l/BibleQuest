name: BibleQuest v3 assignment private responses fix4
on:
  push:
    branches: [work/v3-assignment-private-responses-fix3]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: postrelease/v3-assignment-private-responses
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard exact source head
        run: |
          test "$(git rev-parse HEAD)" = "46160efbe5fe2fdcee75ee0884020268f6679ca6"
          test -z "$(git status --porcelain)"
      - name: Restore advanced assignment metadata copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/features/assignments/index.js')
          text=p.read_text()
          old="if(row.requiredReflection)bits.push('Written response required');"
          new="if(row.requiredReflection)bits.push('Written reflection required');"
          if text.count(old)!=1:
              raise SystemExit(f'expected one advanced metadata label, found {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
          git diff --check
      - name: Focused static validation
        run: |
          node --check src/features/assignments/index.js
          node tests/v3-assignment-private-responses.mjs
          node tests/v3-advanced-assignments-edge.mjs
          node tests/v3-assignment-push-edge.mjs
          node scripts/validate-v3-advanced-assignments.mjs
          node scripts/validate-v3-assignments.mjs
          node scripts/validate-v3-assignment-push.mjs
          node scripts/validate-v3-architecture.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start exact patched tree
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bq-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/bq-http.log; exit 1
      - name: Focused browser validation
        run: |
          timeout 240s node tests/v3-advanced-assignments-smoke.mjs
          timeout 240s node tests/v3-assignments-smoke.mjs
          timeout 240s node tests/v3-assignment-push-smoke.mjs
      - name: Commit exact correction to product branch
        run: |
          git config user.name "11ll11l1l1l"
          git config user.email "138889199+11ll11l1l1l@users.noreply.github.com"
          git add src/features/assignments/index.js
          git commit -m "fix(assignments): retain advanced reflection metadata label"
          git push origin HEAD:postrelease/v3-assignment-private-responses
