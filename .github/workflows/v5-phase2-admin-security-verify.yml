name: V5 Phase 2 Admin Security Verify

on:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'supabase/functions/bq-admin-ops/index.ts'
      - 'supabase/migrations/20260915183000_admin_session_revocation.sql'
      - 'tests/admin-audit-required-static.mjs'
      - 'tests/admin-delete-audit-privacy-static.mjs'
      - 'tests/v5-admin-emergency-security-static.mjs'
      - 'tests/v5-admin-session-revocation-fail-closed.test.mjs'
      - 'tests/admin-membership-static.mjs'
      - 'tests/admin-link-static-smoke.mjs'
      - '.github/workflows/v5-phase2-admin-security-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact candidate
        run: |
          echo "candidate=$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Syntax check focused contracts
        run: |
          node --check tests/admin-audit-required-static.mjs
          node --check tests/admin-delete-audit-privacy-static.mjs
          node --check tests/v5-admin-emergency-security-static.mjs
          node --check tests/v5-admin-session-revocation-fail-closed.test.mjs

      - name: Run durable Admin audit checkpoint contract
        run: node --test tests/admin-audit-required-static.mjs

      - name: Run delete-account audit privacy contract
        run: node --test tests/admin-delete-audit-privacy-static.mjs

      - name: Run Admin emergency security contract
        run: node --test tests/v5-admin-emergency-security-static.mjs

      - name: Run session-revocation fail-closed regression
        run: node --test tests/v5-admin-session-revocation-fail-closed.test.mjs

      - name: Run maintained Admin membership companion
        run: node --test tests/admin-membership-static.mjs

      - name: Run maintained Admin link companion
        run: node --test tests/admin-link-static-smoke.mjs

      - name: Set up Deno for Admin Edge Function type check
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check Admin Edge Function
        run: deno check supabase/functions/bq-admin-ops/index.ts

      - name: Verify tracked source remains clean
        run: git diff --exit-code && git status --porcelain=v1 --untracked-files=no | test ! -s /dev/stdin
