name: V6 BSB Souer vs Hays Genesis 1 Audit

on:
  push:
    branches:
      - audit/v6-bsb-souer-hays-gen1-20261001

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BibleQuest audit head
        uses: actions/checkout@v4

      - name: Export exact current Reader BSB text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bq-current-text
          node scripts/v6-export-current-bsb-alignment-text.mjs /tmp/bq-current-text

      - name: Checkout reviewed bsb-align tool
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/bsb-align
          git -C /tmp/bsb-align remote add origin https://github.com/BSB-publishing/bsb-align.git
          git -C /tmp/bsb-align fetch --depth=1 origin bdb859afc427b215b78e12ee4a7798c32b7b91e0
          git -C /tmp/bsb-align checkout --detach FETCH_HEAD
          test "$(git -C /tmp/bsb-align rev-parse HEAD)" = "bdb859afc427b215b78e12ee4a7798c32b7b91e0"
          test "$(git -C /tmp/bsb-align rev-parse 'HEAD^{tree}')" = "c83b2494c8fc5413863e9617b23660eab9459323"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: /tmp/bsb-align/requirements.txt

      - name: Install aligner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/bsb-align/requirements.txt

      - name: Stage one CC0 chapter from each narrator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audio-souer /tmp/audio-hays
          curl --fail --location --retry 3 --silent --show-error \
            https://bsb.ethnos.dev/audio/souer/BSB_01_Gen_001.mp3 \
            -o /tmp/audio-souer/BSB_01_Gen_001.mp3
          curl --fail --location --retry 3 --silent --show-error \
            https://openbible.com/audio/hays/BSB_01_Gen_001_H.mp3 \
            -o /tmp/audio-hays/BSB_01_Gen_001_H.mp3
          test -s /tmp/audio-souer/BSB_01_Gen_001.mp3
          test -s /tmp/audio-hays/BSB_01_Gen_001_H.mp3
          sha256sum /tmp/audio-souer/BSB_01_Gen_001.mp3 /tmp/audio-hays/BSB_01_Gen_001_H.mp3 > /tmp/audio-sha256.txt

      - name: Align Souer Genesis 1 to exact Reader text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out-souer
          python /tmp/bsb-align/align_book.py \
            --book GEN --chapter 1 \
            --audio-dir /tmp/audio-souer \
            --text-dir /tmp/bq-current-text \
            --output-dir /tmp/out-souer \
            --force

      - name: Align Hays Genesis 1 to exact Reader text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out-hays
          python /tmp/bsb-align/align_book.py \
            --book GEN --chapter 1 \
            --audio-dir /tmp/audio-hays \
            --text-dir /tmp/bq-current-text \
            --output-dir /tmp/out-hays \
            --force

      - name: Compare forced-alignment quality
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path

          def metrics(path):
              data = json.loads(Path(path).read_text())
              words = []
              for verse in data.get('verses', {}).values():
                  words.extend(verse)
              scored = [float(w['score']) for w in words if isinstance(w.get('score'), (int,float)) and math.isfinite(float(w['score']))]
              return {
                  'words': len(words),
                  'scoredWords': len(scored),
                  'averageScore': sum(scored)/len(scored) if scored else None,
                  'below0_30': sum(s < .30 for s in scored),
                  'below0_50': sum(s < .50 for s in scored),
                  'below0_70': sum(s < .70 for s in scored),
                  'minimumScore': min(scored) if scored else None,
                  'lastWordEndSeconds': max((float(w['end']) for w in words if isinstance(w.get('end'), (int,float))), default=None),
              }

          souer = metrics('/tmp/out-souer/GEN/GEN_001_words.json')
          hays = metrics('/tmp/out-hays/GEN/GEN_001_words.json')
          result = {
              'schemaVersion': 1,
              'chapter': 'GEN-1',
              'scripture': json.loads(Path('/tmp/bq-current-text/_biblequest-bsb-alignment-export.json').read_text())['scriptureContentVersion'],
              'alignerRevision': 'bdb859afc427b215b78e12ee4a7798c32b7b91e0',
              'souer': souer,
              'hays': hays,
              'souerAverageAdvantage': (souer['averageScore'] - hays['averageScore']) if souer['averageScore'] is not None and hays['averageScore'] is not None else None,
          }
          Path('bsb-gen1-souer-hays-alignment-audit.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
          cp /tmp/audio-sha256.txt ./bsb-gen1-source-sha256.txt
          cp /tmp/out-souer/GEN/GEN_001_words.json ./bsb-gen1-souer-words.json
          cp /tmp/out-hays/GEN/GEN_001_words.json ./bsb-gen1-hays-words.json

      - name: Upload pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: bsb-gen1-souer-hays-audit
          path: |
            bsb-gen1-souer-hays-alignment-audit.json
            bsb-gen1-source-sha256.txt
            bsb-gen1-souer-words.json
            bsb-gen1-hays-words.json
          if-no-files-found: error
          retention-days: 7
