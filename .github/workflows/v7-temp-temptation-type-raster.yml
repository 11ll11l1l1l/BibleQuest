name: TEMP V7 Tempted TYPE raster repair retry
on:
  push:
    branches:
      - v7/lane-y-temptation-type-webp-20261010
    paths:
      - .github/workflows/v7-temp-temptation-type-raster.yml
permissions:
  contents: write
jobs:
  type-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7/lane-y-temptation-type-webp-20261010
          persist-credentials: true
      - name: Install deterministic tools and licensed font
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          test -f /usr/share/fonts/truetype/noto/NotoSerif-Regular.ttf
      - name: Generate and lock exact WebP TYPE
        run: python3 scripts/v7-temp-temptation-type-raster.py
      - name: Commit actual repaired raster and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BibleQuest V7 Visual Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch public/v7/images/emotion/bqv7-emotion-temptation-01-with-text-en-corrected.svg
          git add public/v7/images/emotion/bqv7-emotion-temptation-01-with-text-en.webp
          git add data/v7/visual-assets/records/bqv7-emotion-temptation-01-derivatives.json
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix(v7): restore correct Tempted TYPE as WebP"
          git push origin HEAD:v7/lane-y-temptation-type-webp-20261010
