name: V7 Lane D owner history diagnostic

on:
  push:
    branches:
      - v7/p3-d-owner-history-after-pair-end-20261004

jobs:
  baseline-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7/development
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Run baseline V7 suite
        run: npm run unit:v7

  combined-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7/p3-d-owner-history-after-pair-end-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Merge live V7 integration in workspace
        run: |
          git config user.name 'BibleQuest V7 Lane D'
          git config user.email '138889199+11ll11l1l@users.noreply.github.com'
          git fetch origin v7/development
          git merge --no-edit origin/v7/development
      - name: Run combined V7 suite
        run: npm run unit:v7
