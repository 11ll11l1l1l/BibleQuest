name: V7 Lane D owner history diagnostic

on:
  push:
    branches:
      - v7/p3-d-owner-history-after-pair-end-20261004

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: owner-history
            test: tests/v7/discipleship-owner-history.test.mjs
          - label: discipleship-core
            test: tests/v7/discipleship-core.test.mjs
          - label: discipleship-adapter
            test: tests/v7/discipleship-supabase-adapter.test.mjs
          - label: share-revocation
            test: tests/v7/discipleship-share-revocation.test.mjs
          - label: lesson-state
            test: tests/v7/discipleship-lesson-state.test.mjs
          - label: mutation-recovery
            test: tests/v7/discipleship-progress-mutation-recovery.test.mjs
          - label: runner-responses
            test: tests/v7/lesson-runner-responses.test.mjs
          - label: runner-response-page
            test: tests/v7/lesson-runner-response-page.test.mjs
    name: focused-${{ matrix.label }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7/p3-d-owner-history-after-pair-end-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Merge live V7 integration in workspace
        run: |
          git fetch origin v7/development
          git merge --no-edit origin/v7/development
      - name: Run focused test
        run: node --test "${{ matrix.test }}"
