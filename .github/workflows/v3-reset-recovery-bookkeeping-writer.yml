## #94 verified functional boundary

#94 restores the retained standalone Account Recovery surface at canonical `/reset` without creating a second recovery transaction owner. `src/app/account.js` remains the verified #9 password/recovery transaction owner and `src/core/api.js` remains the only browser Supabase/network boundary. `src/app/reset-recovery.js` owns only standalone page lifecycle state; `src/features/reset-recovery/index.js` owns rendering/interaction; `src/app/reset-entry.js` composes existing owners without booting a remote authenticated session first.

The recovered flow accepts registered email, saved recovery code, new password and confirmation; delegates exactly once through `account.resetPassword(...)`; displays the replacement recovery code after backend rotation; requires explicit acknowledgement that the replacement code was saved; and then returns to BibleQuest. Pre-submit cancellation performs no reset. Cancellation is disabled during an already-sent reset transaction. Failed/invalid states remain retryable and use the existing #9 safe error contract.

Submitted email/password/recovery secrets are not copied into #94 state or persistent storage. The replacement recovery code remains transient in memory/rendered UI. #100 portable-data backup/reset, #96 operational recovery, and #93 Owner account deletion remain separate owners. No production deployment, migration, data mutation, Cloudflare change or `main` change belongs to #94.

