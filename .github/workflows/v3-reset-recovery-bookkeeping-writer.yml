name: BibleQuest v3 Reset Recovery bookkeeping writer

on:
  push:
    branches:
      - work/v3.65-reset-recovery-bookkeeping-20260911

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-reset-recovery
          fetch-depth: 0
      - name: Assert exact green functional candidate
        run: test "$(git rev-parse HEAD)" = "b3c15b34da0958a136920dc970b24531e3e06e45"
      - name: Update inventory lifecycle
        run: |
          python3 -c 'from pathlib import Path; p=Path("FEATURE_INVENTORY_V3.md"); s=p.read_text(); pairs=[("- **Regression-tested:** 90","- **Regression-tested:** 91"),("- **Not started:** 9","- **Not started:** 8"),("| 93 | Admin operations | Yes | Standalone old | Verified |","| 93 | Admin operations | Yes | Standalone old | Regression-tested |"),("| 94 | Reset/recovery page | Yes | Standalone old | Not started |","| 94 | Reset/recovery page | Yes | Standalone old | Verified |")]; [(_ for _ in ()).throw(AssertionError((a,s.count(a)))) if s.count(a)!=1 else None for a,b in pairs]; [None for a,b in pairs if not (globals().update(s=s.replace(a,b)))]; p.write_text(s)'
      - name: Write durable status
        run: echo '' | base64 -d > DEVELOPMENT_STATUS_V3.md
      - name: Write durable handoff
        run: echo '' | base64 -d > DEVELOPMENT_HANDOFF_V3.md
      - name: Write durable timeline
        run: echo '' | base64 -d > TIMELINE_V3.md
      - name: Check bookkeeping edits
        run: |
          git diff --check
          grep -F -- '- **Regression-tested:** 91' FEATURE_INVENTORY_V3.md
          grep -F -- '- **Not started:** 8' FEATURE_INVENTORY_V3.md
          grep -F -- '| 93 | Admin operations | Yes | Standalone old | Regression-tested |' FEATURE_INVENTORY_V3.md
          grep -F -- '| 94 | Reset/recovery page | Yes | Standalone old | Verified |' FEATURE_INVENTORY_V3.md
      - name: Commit and push one clean bookkeeping candidate
        run: |
          git config user.name "BibleQuest verification"
          git config user.email "actions@users.noreply.github.com"
          git add FEATURE_INVENTORY_V3.md DEVELOPMENT_STATUS_V3.md DEVELOPMENT_HANDOFF_V3.md TIMELINE_V3.md
          git commit -m "docs(v3): promote Reset Recovery verification"
          git push origin HEAD:feature/v3-reset-recovery
