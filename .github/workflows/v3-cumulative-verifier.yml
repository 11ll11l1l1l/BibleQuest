name: BibleQuest v3 cumulative verifier cf17f36

on:
  push:
    branches:
      - verify/v3-cumulative-cf17f36-20260911
    paths:
      - .github/workflows/v3-cumulative-verifier.yml

concurrency:
  group: biblequest-v3-cumulative-cf17f36
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf17f36f9f041aee4715271eaebbe8581fc2c067
          fetch-depth: 0

      - name: Assert exact cumulative product candidate and parents
        shell: bash
        run: |
          set -euo pipefail
          candidate=cf17f36f9f041aee4715271eaebbe8581fc2c067
          line_a=61ee54fac7d352312cef7ffd8010997fa8bc9e51
          line_b=01ba15e7cdc3f224509858fdd98c2f3b17d8a414
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse HEAD^1)" = "$line_a"
          test "$(git rev-parse HEAD^2)" = "$line_b"
          git merge-base --is-ancestor 73d39ce6fe0f9db20db62e25fd497a8711f921b0 HEAD
          git merge-base --is-ancestor 524adb11cd7e5ad877b5dcdb8f5c28373ad84932 HEAD
          git merge-base --is-ancestor 7ce6685a7383102f29797869a77eabcf7ab9c0c2 HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify cumulative integration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ASSIGNMENT_RESPONSE_PRESENCE_FIELDS" src/core/api.js
          grep -q "CLOUD_NOTE_DB_FIELDS" src/core/api.js
          grep -q "CALENDAR_EVENT_FIELDS" src/core/api.js
          grep -q "const calendar = Object.freeze" src/core/api.js
          test "$(grep -c "const calendar = Object.freeze" src/core/api.js)" -eq 1
          grep -q "avatarVault, calendar, congregationRecognition" src/core/api.js
          for style in theme-green-gold.css avatar-vault.css mission.css calendar.css more-visual-polish.css newer-features-visual-polish.css; do
            test "$(grep -c "src/ui/$style" index.html)" -eq 1
          done
          grep -q "src/ui/notes-visual-polish.css" index.html
          grep -q "src/ui/account-visual-polish.css" index.html
          test -f supabase/migrations/20260911131000_assignment_response_presence.sql
          test -f supabase/migrations/20260911140000_calendar_congregation_sharing.sql
          test -f supabase/migrations/20260911_calendar_events.sql
          test ! -e .github/workflows/v3-cumulative-integration-builder.yml
          git diff --check HEAD^1 HEAD

      - name: Run focused Line A plus Line B regressions
        run: |
          node tests/v3-assignment-response-auth-edge.mjs
          node tests/v3-workspace-notes-schema-compat.mjs
          node tests/v3-cloud-notes-edge.mjs
          node tests/v3-avatar-vault-edge.mjs
          node tests/v3-calendar-edge.mjs
          node tests/v3-green-gold-theme-static.mjs
          node tests/v3-visual-game-polish-tranche18-static.mjs

      - name: Run deployment gate
        run: bash build.sh

      - name: Run accumulated architecture validators
        run: |
          for script in scripts/validate-v3-architecture.mjs scripts/validate-v3-private-notes.mjs scripts/validate-v3-cloud-notes.mjs scripts/validate-v3-congregation-membership.mjs scripts/validate-v3-operational-recovery.mjs scripts/validate-v3-client-diagnostics.mjs scripts/validate-v3-pwa-install.mjs scripts/validate-v3-offline-shell.mjs scripts/validate-v3-offline-bible-packs.mjs scripts/validate-v3-backup.mjs scripts/validate-v3-couples-family.mjs scripts/validate-v3-couples-cloud.mjs scripts/validate-v3-journey-groups.mjs scripts/validate-v3-encouragements.mjs scripts/validate-v3-community-bridge.mjs scripts/validate-v3-presence.mjs scripts/validate-v3-team-center.mjs scripts/validate-v3-trusted-score-events.mjs scripts/validate-v3-leaderboards.mjs scripts/validate-v3-congregation-recognition.mjs scripts/validate-v3-assignments.mjs scripts/validate-v3-advanced-assignments.mjs scripts/validate-v3-assignment-push.mjs scripts/validate-v3-ministry-hub.mjs scripts/validate-v3-notification-center.mjs scripts/validate-v3-workspace.mjs scripts/validate-v3-linked-activities.mjs scripts/validate-v3-personality-profile.mjs scripts/validate-v3-psychometrics.mjs scripts/validate-v3-step-context.mjs scripts/validate-v3-japanese-kougo.mjs scripts/validate-v3-japanese-vocabulary.mjs scripts/validate-v3-japanese-furigana.mjs scripts/validate-v3-nlt-licensed.mjs scripts/validate-v3-source-labels.mjs scripts/validate-v3-doctrinal-safety.mjs scripts/validate-v3-avatar-vault.mjs scripts/validate-v3-innovation-suite.mjs scripts/validate-v3-tutorial-onboarding.mjs scripts/validate-v3-tutorial-avatar-reactions.mjs scripts/validate-v3-accessibility.mjs scripts/validate-v3-content-reporting.mjs scripts/validate-v3-content-moderation.mjs scripts/validate-v3-content-review.mjs scripts/validate-v3-admin-console.mjs scripts/validate-v3-admin-operations.mjs scripts/validate-v3-reset-recovery.mjs scripts/validate-v3-same-room-play-together.mjs scripts/validate-v3-live-rooms.mjs scripts/validate-v3-bible-world.mjs scripts/validate-v3-bible-world-artwork.mjs scripts/validate-v3-kids-memory.mjs scripts/validate-v3-calendar.mjs; do node "$script"; done

      - name: Run accumulated edge regressions
        run: |
          for test in tests/v3-workflow-contract-edge.mjs tests/v3-account-edge.mjs tests/v3-reader-edge.mjs tests/v3-offline-bible-packs-edge.mjs tests/v3-backup-edge.mjs tests/v3-couples-family-edge.mjs tests/v3-couples-cloud-edge.mjs tests/v3-journey-groups-edge.mjs tests/v3-encouragements-edge.mjs tests/v3-community-bridge-edge.mjs tests/v3-presence-edge.mjs tests/v3-team-center-edge.mjs tests/v3-trusted-score-events-edge.mjs tests/v3-leaderboards-edge.mjs tests/v3-congregation-recognition-edge.mjs tests/v3-assignments-edge.mjs tests/v3-advanced-assignments-edge.mjs tests/v3-assignment-push-edge.mjs tests/v3-assignment-response-auth-edge.mjs tests/v3-assignment-publish-auth-edge.mjs tests/v3-ministry-hub-edge.mjs tests/v3-notification-center-edge.mjs tests/v3-workspace-edge.mjs tests/v3-linked-activities-edge.mjs tests/v3-personality-profile-edge.mjs tests/v3-psychometrics-edge.mjs tests/v3-step-context-edge.mjs tests/v3-japanese-kougo-edge.mjs tests/v3-japanese-vocabulary-edge.mjs tests/v3-japanese-furigana-edge.mjs tests/v3-nlt-licensed-edge.mjs tests/v3-source-labels-edge.mjs tests/v3-doctrinal-safety-edge.mjs tests/v3-doctrinal-context-presentation-edge.mjs tests/v3-avatar-vault-edge.mjs tests/v3-innovation-suite-edge.mjs tests/v3-tutorial-onboarding-edge.mjs tests/v3-tutorial-avatar-reactions-edge.mjs tests/v3-accessibility-edge.mjs tests/v3-content-reporting-edge.mjs tests/v3-content-moderation-edge.mjs tests/v3-content-review-edge.mjs tests/v3-admin-console-edge.mjs tests/v3-admin-operations-edge.mjs tests/v3-reset-recovery-edge.mjs tests/v3-same-room-play-together-edge.mjs tests/v3-live-rooms-edge.mjs tests/v3-bible-world-edge.mjs tests/v3-bible-world-artwork-edge.mjs tests/v3-progress-edge.mjs tests/v3-lesson-edge.mjs tests/v3-study-edge.mjs tests/v3-deep-questions-edge.mjs tests/v3-story-journey-edge.mjs tests/v3-wisdom-situations-edge.mjs tests/v3-adaptive-learning-edge.mjs tests/v3-adaptive-focus-edge.mjs tests/v3-open-review-edge.mjs tests/v3-privat