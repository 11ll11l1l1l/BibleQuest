name: V5 Admin Delete Post-Auth Cleanup

on:
  pull_request:
    branches:
      - v5/feature-completion
    paths:
      - 'tests/v5-admin-delete-post-auth-cleanup-static.mjs'
      - '.github/workflows/v5-admin-delete-post-auth-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-delete-post-auth-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Run bounded Admin delete cleanup contract
        run: node tests/v5-admin-delete-post-auth-cleanup-static.mjs