name: V7 Lane D branch check

on:
  push:
    branches:
      - v7/p3-d-share-revocation

jobs:
  unit-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Run V7 unit suite
        run: npm run unit:v7
