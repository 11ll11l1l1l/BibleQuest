name: BibleQuest V4 Section I security privacy gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v4/modern-ui-overhaul
      - main

permissions:
  contents: write

concurrency:
  group: biblequest-v4-section-i-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-email-recovery:
    if: github.event_name == 'pull_request' && github.head_ref == 'v4/admin-email-recovery-work'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply assertion-checked email recovery patch to isolated branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, expected=1):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != expected: raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}')
              p.write_text(text.replace(old,new))

          edge='supabase/functions/bq-admin-ops/index.ts'
          patch(edge, 'OPS_VERSION=5;', 'OPS_VERSION=6;')
          anchor="    return json(req,{error:'Unknown action'},400)}catch(err){if(err instanceof Response)return err;console.error(err);return json(req,{error:err instanceof Error?err.message:'Unexpected admin operations error'},500)}});"
          block="""    if(action==='change_email'){
              if(r!=='owner')return json(req,{error:'Only the BibleQuest owner can change an account email'},403);
              const target=String(body?.targetUserId||''),email=String(body?.email||'').trim().toLowerCase();
              if(!target)return json(req,{error:'targetUserId required'},400);
              if(target===u.id)return json(req,{error:'Use your own Account page for this active owner account'},409);
              if(email.length>254||!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))return json(req,{error:'A valid recovery email is required'},400);
              const got=await a.auth.admin.getUserById(target);if(got.error)return json(req,{error:'Account not found'},404);
              if(String(got.data.user?.email||'').trim().toLowerCase()===email)return json(req,{error:'That email is already assigned to this account'},409);
              const upd=await a.auth.admin.updateUserById(target,{email});if(upd.error)throw upd.error;
              let revoked=false;try{revoked=await forceSignOutUser(target)}catch(e){console.error('force-sign-out-on-email-change',e)}
              // Never write the old or new email address to the audit detail.
              await audit(a,u.id,target,'change_email',{emailChanged:true,sessionsRevoked:revoked});
              return json(req,{ok:true,changed:true,revoked});
            }
          """+anchor
          patch(edge,anchor,block)

          core='src/core/api.js'
          old="    async setTempPassword(targetUserId,password){return invoke('bq-admin-ops',{action:'set_temp_password',targetUserId,password});},"
          patch(core,old,old+"\n    async changeEmail(targetUserId,email){return invoke('bq-admin-ops',{action:'change_email',targetUserId,email});},")

          service='src/app/admin-operations.js'
          patch(service,"const required=['status','dashboard','frontendHealth','deleteUser','suspendAccount','reactivateAccount','forceSignOut','setTempPassword'];","const required=['status','dashboard','frontendHealth','deleteUser','suspendAccount','reactivateAccount','forceSignOut','setTempPassword','changeEmail'];")
          service_anchor="  return Object.freeze({authorize,refresh,deleteUser,suspendAccount,reactivateAccount,forceSignOut,setTempPassword,getState:snapshot,clear:()=>reset('idle')});"
          service_block="""  async function changeEmail(targetUserId,email){
            ensureAuthorized();
            if(state.role!=='owner')throw fail('Only the BibleQuest owner can change an account email.','BQ_ADMIN_OPS_OWNER_REQUIRED');
            const target=guardTarget(targetUserId,'Use your own Account page for this active owner account.','BQ_ADMIN_OPS_SELF_EMAIL_CHANGE');
            const value=clean(email).toLowerCase();
            if(value.length>254||!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(value))throw fail('A valid recovery email is required.','BQ_ADMIN_OPS_EMAIL_INVALID');
            state={...state,busy:true,error:'',lastAction:'change_email'};
            try{const result=await api.changeEmail(target,value);if(result?.changed!==true)throw fail('The server did not confirm the email change.','BQ_ADMIN_OPS_EMAIL_UNCONFIRMED');state={...state,busy:false,lastAction:'change_email'};return Object.freeze({ok:true,result,state:snapshot()})}
            catch(error){state={...state,busy:false,error:error?.message||'Changing the account email failed.',lastAction:'change_email'};throw error}
          }

          return Object.freeze({authorize,refresh,deleteUser,suspendAccount,reactivateAccount,forceSignOut,setTempPassword,changeEmail,getState:snapshot,clear:()=>reset('idle')});"""
          patch(service,service_anchor,service_block)

          feature='src/features/admin-console/index.js'
          old='''<button type="button" class="bq-secondary-button" data-admin-set-temp-password="${esc(user.id)}">Set temporary password</button></div>`:'';'''
          new='''<button type="button" class="bq-secondary-button" data-admin-set-temp-password="${esc(user.id)}">Set temporary password</button><hr><b>Recovery email</b><p class="bq-muted">Owner-only identity recovery. Changing the login email revokes existing sessions where supported; email addresses are not copied into the admin audit detail.</p><label>New email<input type="email" maxlength="254" autocomplete="off" data-admin-change-email-input="${esc(user.id)}"></label><button type="button" class="bq-secondary-button" data-admin-change-email="${esc(user.id)}">Change account email</button></div>`:'';'''
          patch(feature,old,new)
          delete_anchor="""      view.querySelectorAll('[data-admin-delete-user]').forEach(button=>button.addEventListener('click',event=>{const user=state.users.find(row=>row.id===event.currentTarget.dataset.adminDeleteUser);if(!user||!accountDeletion?.deleteUser)return;const phrase=`DELETE ${user.email||user.name}`;typedAction(phrase,'Permanent account deletion cannot be undone.',()=>refreshBoth(()=>accountDeletion.deleteUser(user.id)),`${user.name} account deleted.`)},{once:true}));"""
          handler="""      view.querySelectorAll('[data-admin-change-email]').forEach(button=>button.addEventListener('click',event=>{const user=state.users.find(row=>row.id===event.currentTarget.dataset.adminChangeEmail);if(!user||!accountDeletion?.changeEmail)return;const input=view.querySelector(`[data-admin-change-email-input=\"${CSS.escape(user.id)}\"]`),email=String(input?.value||'').trim().toLowerCase();if(email.length>254||!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)){message='Enter a valid recovery email.';render(admin.getState());return}const phrase=`CHANGE EMAIL ${user.email||user.name}`;typedAction(phrase,`Change the login email for ${user.name}? Existing sessions will be revoked where supported.`,()=>refreshBoth(()=>accountDeletion.changeEmail(user.id,email)),`${user.name} account email updated.`)},{once:true}));
          """+delete_anchor
          patch(feature,delete_anchor,handler)

          Path('tests/v4-admin-email-recovery-smoke.mjs').write_text(r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createAdminOperationsService} from '../src/app/admin-operations.js';

          const edge=fs.readFileSync('supabase/functions/bq-admin-ops/index.ts','utf8');
          const api=fs.readFileSync('src/core/api.js','utf8');
          const ui=fs.readFileSync('src/features/admin-console/index.js','utf8');
          assert.match(edge,/OPS_VERSION=6/);
          assert.match(edge,/action==='change_email'/);
          assert.match(edge,/Only the BibleQuest owner can change an account email/);
          assert.match(edge,/updateUserById\(target,\{email\}\)/);
          assert.match(edge,/audit\(a,u\.id,target,'change_email',\{emailChanged:true,sessionsRevoked:revoked\}\)/);
          assert.doesNotMatch(edge,/audit\([^\n]*change_email[^\n]*email:/);
          assert.match(api,/action:'change_email',targetUserId,email/);
          assert.match(ui,/data-admin-change-email=/);
          assert.match(ui,/CHANGE EMAIL/);
          const calls=[];
          const fakeApi={status:async()=>({role:'owner',userId:'owner-1'}),dashboard:async()=>({role:'owner'}),frontendHealth:async()=>({}),deleteUser:async()=>({deleted:true}),suspendAccount:async()=>({active:false}),reactivateAccount:async()=>({active:true}),forceSignOut:async()=>({revoked:true}),setTempPassword:async()=>({ok:true}),changeEmail:async(targetUserId,email)=>{calls.push({targetUserId,email});return {changed:true,revoked:true}}};
          const session={getState:()=>({authenticated:true,user:{id:'owner-1'}})};
          const service=createAdminOperationsService({api:fakeApi,session});
          await service.authorize();
          const result=await service.changeEmail('member-2',' NEW@Example.COM ');
          assert.equal(result.ok,true);
          assert.deepEqual(calls,[{targetUserId:'member-2',email:'new@example.com'}]);
          await assert.rejects(()=>service.changeEmail('owner-1','owner2@example.com'),/own Account page/);
          await assert.rejects(()=>service.changeEmail('member-2','not-an-email'),/valid recovery email/);
          console.log('V4 admin email recovery smoke: PASS');
          ''')
          PY
          node --check src/core/api.js
          node --check src/app/admin-operations.js
          node --check src/features/admin-console/index.js
          node tests/v4-admin-email-recovery-smoke.mjs
          git diff --check
      - name: Commit isolated product/test patch
        shell: bash
        run: |
          git config user.name "BibleQuest release automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/bq-admin-ops/index.ts src/core/api.js src/app/admin-operations.js src/features/admin-console/index.js tests/v4-admin-email-recovery-smoke.mjs
          git commit -m "feat(v4): add owner email recovery flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  section-i:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deployment architecture and security static gates
        run: |
          bash build.sh
          node scripts/validate-v3-architecture.mjs
          node tests/v4-section-i-security-static.mjs
      - name: Run explicit multi-account isolation matrix
        run: node tests/v4-section-i-multi-account-edge.mjs
      - name: Cross-check existing authentication scope and privacy regressions
        run: |
          node tests/v3-assignments-edge.mjs
          node tests/v3-journey-groups-edge.mjs
          node tests/v3-team-center-edge.mjs
          node tests/v3-couples-cloud-edge.mjs
          node tests/v3-live-rooms-edge.mjs
