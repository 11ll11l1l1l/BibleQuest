name: V6 OpenBible Source Metadata Audit

on:
  push:
    branches:
      - audit/v6-openbible-source-metadata-20261001

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Hays and Souer Genesis 1 source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/openbible-audit
          : > /tmp/openbible-audit/summary.txt
          while IFS='|' read -r narrator url; do
            echo "=== ${narrator} ===" | tee -a /tmp/openbible-audit/summary.txt
            curl --fail --silent --show-error --location \
              -H 'Origin: https://mybiblequest.pages.dev' \
              -H 'Range: bytes=0-0' \
              -D "/tmp/openbible-audit/${narrator}-range-headers.txt" \
              -o "/tmp/openbible-audit/${narrator}-range-byte.bin" \
              "${url}"
            curl --fail --silent --show-error --location \
              -D "/tmp/openbible-audit/${narrator}-headers.txt" \
              -o "/tmp/openbible-audit/${narrator}-gen1.mp3" \
              "${url}"
            sha256sum "/tmp/openbible-audit/${narrator}-gen1.mp3" | tee -a /tmp/openbible-audit/summary.txt
            stat -c 'bytes=%s' "/tmp/openbible-audit/${narrator}-gen1.mp3" | tee -a /tmp/openbible-audit/summary.txt
            if command -v ffprobe >/dev/null 2>&1; then
              ffprobe -v error -show_entries format=duration,size,bit_rate:format_tags -of json \
                "/tmp/openbible-audit/${narrator}-gen1.mp3" > "/tmp/openbible-audit/${narrator}-ffprobe.json"
              cat "/tmp/openbible-audit/${narrator}-ffprobe.json" | tee -a /tmp/openbible-audit/summary.txt
            else
              echo "ffprobe=unavailable-on-runner" | tee -a /tmp/openbible-audit/summary.txt
            fi
            echo "-- response headers --" | tee -a /tmp/openbible-audit/summary.txt
            grep -iE '^(HTTP/|access-control-allow-origin:|accept-ranges:|content-range:|content-length:|content-type:|etag:|last-modified:|cache-control:)' \
              "/tmp/openbible-audit/${narrator}-range-headers.txt" | tee -a /tmp/openbible-audit/summary.txt || true
            echo | tee -a /tmp/openbible-audit/summary.txt
          done <<'EOF'
          hays|https://openbible.com/audio/hays/BSB_01_Gen_001_H.mp3
          souer|https://openbible.com/audio/souer/BSB_01_Gen_001.mp3
          EOF

      - name: Transcribe sample narrations against current Reader text
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet faster-whisper
          python - <<'PY'
          import json, re, unicodedata
          from difflib import SequenceMatcher
          from pathlib import Path
          import av
          _av_open = av.open
          def _compat_av_open(*args, **kwargs):
              kwargs.pop('metadata_errors', None)
              return _av_open(*args, **kwargs)
          av.open = _compat_av_open
          from faster_whisper import WhisperModel

          rows = json.loads(Path('data/packs/bible/GEN.json').read_text(encoding='utf-8'))
          current = ' '.join(str(row['t']) for row in rows if int(row['c']) == 1)

          def tokens(value):
              value = unicodedata.normalize('NFKD', value)
              value = ''.join(ch for ch in value if unicodedata.category(ch) != 'Mn')
              value = re.sub(r"[^A-Za-z0-9' ]+", ' ', value).lower()
              return [part for part in value.split() if part]

          model = WhisperModel('tiny.en', device='cpu', compute_type='int8')
          result = {}
          for narrator in ('hays', 'souer'):
              path = f'/tmp/openbible-audit/{narrator}-gen1.mp3'
              segments, info = model.transcribe(path, beam_size=5, vad_filter=True)
              transcript = ' '.join(segment.text.strip() for segment in segments).strip()
              current_tokens = tokens(current)
              transcript_tokens = tokens(transcript)
              ratio = SequenceMatcher(None, current_tokens, transcript_tokens, autojunk=False).ratio()
              payload = {
                  'narrator': narrator,
                  'language': info.language,
                  'languageProbability': info.language_probability,
                  'currentTokens': len(current_tokens),
                  'transcriptTokens': len(transcript_tokens),
                  'tokenSimilarity': ratio,
                  'containsAndThereWasLight': 'and there was light' in transcript.lower(),
                  'transcript': transcript,
              }
              result[narrator] = payload
              Path(f'/tmp/openbible-audit/{narrator}-transcript.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          Path('/tmp/openbible-audit/transcript-comparison.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              key: {k: value[k] for k in ('currentTokens','transcriptTokens','tokenSimilarity','containsAndThereWasLight')}
              for key, value in result.items()
          }, indent=2))
          PY

      - name: Publish audit summary
        shell: bash
        run: |
          cat /tmp/openbible-audit/summary.txt
          {
            echo '## OpenBible live source audit'
            echo
            echo '```text'
            cat /tmp/openbible-audit/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: openbible-source-metadata-audit
          path: /tmp/openbible-audit/
          if-no-files-found: error
          retention-days: 7
