        run: ":"
      - name: Run inherited static regression suite
        uses: ./.github/actions/inherited-regression-static

      - name: Prepare V6 browser target
        if: github.base_ref == 'v6/architecture-upgrade'
        run: npm ci
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start browser regression target
        run: |
          if [ "${{ github.base_ref }}" = "v6/architecture-upgrade" ]; then
            npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/biblequest-v3-http.log 2>&1 &
          else
            python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblequest-v3-http.log 2>&1 &
          fi
          echo $! > /tmp/biblequest-v3-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/biblequest-v3-http.log
          exit 1
      - name: Run legacy source-layout offline regressions
        if: github.base_ref != 'v6/architecture-upgrade'
        run: |
          timeout 240s node tests/v3-offline-shell-smoke.mjs
          timeout 240s node tests/v3-offline-bible-packs-smoke.mjs
      # The V6 Vite graph uses the dedicated Phase 1 build/PWA gate instead.
      - name: Run accumulated browser/mobile regressions
        env:
          BQ_SKIP_LEGACY_SOURCE_OFFLINE: ${{ github.base_ref == 'v6/architecture-upgrade' }}
