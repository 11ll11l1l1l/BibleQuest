name: BibleQuest v3 regression

on:
  workflow_dispatch:

concurrency:
  group: biblequest-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run accumulated architecture validators
        run: |
          for script in scripts/validate-v3-architecture.mjs scripts/validate-v3-private-notes.mjs scripts/validate-v3-cloud-notes.mjs scripts/validate-v3-congregation-membership.mjs scripts/validate-v3-operational-recovery.mjs scripts/validate-v3-client-diagnostics.mjs scripts/validate-v3-pwa-install.mjs scripts/validate-v3-offline-shell.mjs scripts/validate-v3-offline-bible-packs.mjs scripts/validate-v3-backup.mjs scripts/validate-v3-couples-family.mjs scripts/validate-v3-couples-cloud.mjs scripts/validate-v3-journey-groups.mjs scripts/validate-v3-encouragements.mjs scripts/validate-v3-community-bridge.mjs scripts/validate-v3-presence.mjs scripts/validate-v3-team-center.mjs scripts/validate-v3-trusted-score-events.mjs scripts/validate-v3-leaderboards.mjs scripts/validate-v3-congregation-recognition.mjs scripts/validate-v3-assignments.mjs scripts/validate-v3-advanced-assignments.mjs scripts/validate-v3-assignment-push.mjs scripts/validate-v3-ministry-hub.mjs scripts/validate-v3-notification-center.mjs scripts/validate-v3-workspace.mjs scripts/validate-v3-linked-activities.mjs scripts/validate-v3-personality-profile.mjs scripts/validate-v3-psychometrics.mjs scripts/validate-v3-step-context.mjs scripts/validate-v3-japanese-kougo.mjs scripts/validate-v3-japanese-vocabulary.mjs scripts/validate-v3-nlt-licensed.mjs scripts/validate-v3-source-labels.mjs scripts/validate-v3-doctrinal-safety.mjs scripts/validate-v3-avatar-vault.mjs scripts/validate-v3-innovation-suite.mjs scripts/validate-v3-tutorial-onboarding.mjs; do node "$script"; done
      - name: Run accumulated edge regressions
        run: |
          for test in tests/v3-workflow-contract-edge.mjs tests/v3-account-edge.mjs tests/v3-reader-edge.mjs tests/v3-offline-bible-packs-edge.mjs tests/v3-backup-edge.mjs tests/v3-couples-family-edge.mjs tests/v3-couples-cloud-edge.mjs tests/v3-journey-groups-edge.mjs tests/v3-encouragements-edge.mjs tests/v3-community-bridge-edge.mjs tests/v3-presence-edge.mjs tests/v3-team-center-edge.mjs tests/v3-trusted-score-events-edge.mjs tests/v3-leaderboards-edge.mjs tests/v3-congregation-recognition-edge.mjs tests/v3-assignments-edge.mjs tests/v3-advanced-assignments-edge.mjs tests/v3-assignment-push-edge.mjs tests/v3-assignment-response-auth-edge.mjs tests/v3-assignment-publish-auth-edge.mjs tests/v3-ministry-hub-edge.mjs tests/v3-notification-center-edge.mjs tests/v3-workspace-edge.mjs tests/v3-linked-activities-edge.mjs tests/v3-personality-profile-edge.mjs tests/v3-psychometrics-edge.mjs tests/v3-step-context-edge.mjs tests/v3-japanese-kougo.mjs tests/v3-japanese-vocabulary-edge.mjs tests/v3-nlt-licensed-edge.mjs tests/v3-source-labels-edge.mjs tests/v3-doctrinal-safety-edge.mjs tests/v3-doctrinal-context-presentation-edge.mjs tests/v3-avatar-vault-edge.mjs tests/v3-innovation-suite-edge.mjs tests/v3-tutorial-onboarding-edge.mjs tests/v3-progress-edge.mjs tests/v3-lesson-edge.mjs tests/v3-study-edge.mjs tests/v3-deep-questions-edge.mjs tests/v3-story-journey-edge.mjs tests/v3-wisdom-situations-edge.mjs tests/v3-adaptive-learning-edge.mjs tests/v3-adaptive-focus-edge.mjs tests/v3-open-review-edge.mjs tests/v3-private-notes-edge.mjs tests/v3-cloud-notes-edge.mjs tests/v3-congregation-membership-edge.mjs tests/v3-operational-recovery-edge.mjs tests/v3-client-diagnostics-edge.mjs tests/v3-pwa-install-edge.mjs tests/v3-offline-shell-edge.mjs tests/v3-daily-mission-edge.mjs tests/v3-transform-edge.mjs tests/v3-transform-basic-edge.mjs tests/v3-recordings-edge.mjs tests/v3-media-library-edge.mjs tests/v3-recall-packs-edge.mjs tests/v3-games-edge.mjs tests/v3-games-review-interface-edge.mjs; do node "$test"; done
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start BibleQuest v3 locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblequest-v3-http.log 2>&1 &
          echo $! > /tmp/biblequest-v3-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/biblequest-v3-http.log
          exit 1
      - name: Run accumulated browser/mobile regressions
        run: |
          for test in tests/v3-shell-smoke.mjs tests/v3-operational-recovery-smoke.mjs tests/v3-client-diagnostics-smoke.mjs tests/v3-pwa-install-smoke.mjs tests/v3-offline-shell-smoke.mjs tests/v3-offline-bible-packs-smoke.mjs tests/v3-backup-smoke.mjs tests/v3-couples-family-smoke.mjs tests/v3-couples-cloud-smoke.mjs tests/v3-journey-groups-smoke.mjs tests/v3-encouragements-smoke.mjs tests/v3-community-bridge-smoke.mjs tests/v3-presence-smoke.mjs tests/v3-team-center-smoke.mjs tests/v3-trusted-score-events-smoke.mjs tests/v3-leaderboards-smoke.mjs tests/v3-congregation-recognition-smoke.mjs tests/v3-assignments-smoke.mjs tests/v3-advanced-assignments-smoke.mjs tests/v3-assignment-push-smoke.mjs tests/v3-ministry-hub-smoke.mjs tests/v3-notification-center-smoke.mjs tests/v3-workspace-smoke.mjs tests/v3-linked-activities-smoke.mjs tests/v3-personality-profile-smoke.mjs tests/v3-psychometrics-smoke.mjs tests/v3-reader-smoke.mjs tests/v3-step-context-smoke.mjs tests/v3-japanese-kougo-smoke.mjs tests/v3-japanese-vocabulary-smoke.mjs tests/v3-nlt-licensed-smoke.mjs tests/v3-source-labels-smoke.mjs tests/v3-doctrinal-safety-smoke.mjs tests/v3-doctrinal-context-presentation-smoke.mjs tests/v3-avatar-vault-smoke.mjs tests/v3-innovation-suite-smoke.mjs tests/v3-tutorial-onboarding-smoke.mjs tests/v3-progress-smoke.mjs tests/v3-lesson-smoke.mjs tests/v3-study-smoke.mjs tests/v3-deep-questions-smoke.mjs tests/v3-story-journey-smoke.mjs tests/v3-wisdom-situations-smoke.mjs tests/v3-adaptive-learning-smoke.mjs tests/v3-open-review-smoke.mjs tests/v3-private-notes-smoke.mjs tests/v3-cloud-notes-smoke.mjs tests/v3-congregation-membership-smoke.mjs tests/v3-daily-mission-smoke.mjs tests/v3-transform-engine-smoke.mjs tests/v3-transform-basic-smoke.mjs tests/v3-transform-full-smoke.mjs tests/v3-recordings-smoke.mjs tests/v3-media-library-smoke.mjs tests/v3-games-smoke.mjs; do timeout 240s node "$test"; done
