name: BibleQuest Kids reward inspection

on:
  push:
    branches:
      - inspect/kids-memory-source-once-20260907

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover retained game completion semantics
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          let encoded='';for(let i=0;i<12;i++)encoded+=fs.readFileSync(`kids-games/bundle-${String(i).padStart(2,'0')}.txt`,'utf8').trim();
          const bundle=JSON.parse(zlib.gunzipSync(Buffer.from(encoded,'base64')).toString('utf8'));
          for(const name of ['classic/app.js','app.js']){
            const src=bundle[name]||'';
            console.log(`=== ${name} ===`);
            for(const needle of ['finish(result','finish(res','finish(data','finish(out','finish(o','class Runner','class GameRunner','function startGame']){
              const i=src.indexOf(needle);if(i>=0)console.log(`\n--- ${needle} @ ${i} ---\n${src.slice(Math.max(0,i-2200),Math.min(src.length,i+5200))}`);
            }
          }
          NODE
