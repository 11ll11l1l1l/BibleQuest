name: BibleQuest v3 regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - v6/architecture-upgrade

concurrency:
  group: biblequest-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run inherited static regression suite
        uses: ./.github/actions/inherited-regression-static

      - name: Prepare V6 browser target
        if: github.base_ref == 'v6/architecture-upgrade'
        run: npm ci
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start browser regression target
        run: |
          if [ "${{ github.base_ref }}" = "v6/architecture-upgrade" ]; then
            npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/biblequest-v3-http.log 2>&1 &
          else
            python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblequest-v3-http.log 2>&1 &
          fi
          echo $! > /tmp/biblequest-v3-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/biblequest-v3-http.log
          exit 1
      - name: Run legacy source-layout offline regressions
        if: github.base_ref != 'v6/architecture-upgrade'
        run: |
          timeout 240s node tests/v3-offline-shell-smoke.mjs
          timeout 240s node tests/v3-offline-bible-packs-smoke.mjs
      # The V6 Vite graph uses the dedicated Phase 1 build/PWA gate instead.
      - name: Run accumulated browser/mobile regressions
        env:
          BQ_SKIP_LEGACY_SOURCE_OFFLINE: ${{ github.base_ref == 'v6/architecture-upgrade' }}
        run: |
          for test in tests/v3-shell-smoke.mjs tests/v4-bootstrap-safety-net-smoke.mjs tests/v4-shell-keyboard-motion-smoke.mjs tests/v3-final-mobile-widths-smoke.mjs tests/v4-primary-family-smoke.mjs tests/v3-account-phase-b-smoke.mjs tests/v3-operational-recovery-smoke.mjs tests/v3-client-diagnostics-smoke.mjs tests/v3-pwa-install-smoke.mjs tests/v3-backup-smoke.mjs tests/v3-couples-family-smoke.mjs tests/v4-couples-journey-smoke.mjs tests/v3-couples-cloud-smoke.mjs tests/v3-journey-groups-smoke.mjs tests/v3-encouragements-smoke.mjs tests/v3-community-bridge-smoke.mjs tests/v3-presence-smoke.mjs tests/v3-team-center-smoke.mjs tests/v3-trusted-score-events-smoke.mjs tests/v3-leaderboards-smoke.mjs tests/v3-congregation-recognition-smoke.mjs tests/v3-assignments-smoke.mjs tests/v3-advanced-assignments-smoke.mjs tests/v4-assignments-page-smoke.mjs tests/v3-assignment-push-smoke.mjs tests/v3-ministry-hub-smoke.mjs tests/v3-notification-center-smoke.mjs tests/v3-workspace-smoke.mjs tests/v3-linked-activities-smoke.mjs tests/v3-personality-profile-smoke.mjs tests/v3-psychometrics-smoke.mjs tests/v3-reader-smoke.mjs tests/v3-step-context-smoke.mjs tests/v3-japanese-kougo-smoke.mjs tests/v3-japanese-vocabulary-smoke.mjs tests/v3-japanese-furigana-smoke.mjs tests/v3-nlt-licensed-smoke.mjs tests/v3-source-labels-smoke.mjs tests/v3-doctrinal-safety-smoke.mjs tests/v3-doctrinal-context-presentation-smoke.mjs tests/v3-avatar-vault-smoke.mjs tests/v3-avatar-vault-phase-b-smoke.mjs tests/v3-innovation-suite-smoke.mjs tests/v5-personal-challenges-browser.mjs tests/v5-explorer-browser.mjs tests/v3-mission-phase-b-smoke.mjs tests/v3-tutorial-onboarding-smoke.mjs tests/v3-tutorial-avatar-reactions-smoke.mjs tests/v3-accessibility-smoke.mjs tests/v3-content-reporting-smoke.mjs tests/v3-content-review-smoke.mjs tests/v3-admin-console-smoke.mjs tests/v3-admin-operations-smoke.mjs tests/v3-reset-recovery-smoke.mjs tests/v3-same-room-play-together-smoke.mjs tests/v3-live-rooms-smoke.mjs tests/v3-bible-world-smoke.mjs tests/v3-bible-world-artwork-smoke.mjs tests/v3-progress-smoke.mjs tests/v3-progress-phase-b-smoke.mjs tests/v4-progress-page-smoke.mjs tests/v3-lesson-smoke.mjs tests/v3-study-smoke.mjs tests/v3-deep-questions-smoke.mjs tests/v3-story-journey-smoke.mjs tests/v3-wisdom-situations-smoke.mjs tests/v3-adaptive-learning-smoke.mjs tests/v3-open-review-smoke.mjs tests/v3-private-notes-smoke.mjs tests/v3-cloud-notes-smoke.mjs tests/v3-congregation-membership-smoke.mjs tests/v3-daily-mission-smoke.mjs tests/v4-daily-journey-page-smoke.mjs tests/v3-transform-engine-smoke.mjs tests/v3-transform-basic-smoke.mjs tests/v3-transform-full-smoke.mjs tests/v3-recordings-smoke.mjs tests/v3-games-smoke.mjs tests/v3-kids-memory-browser.mjs tests/v3-calendar-smoke.mjs tests/v3-calendar-phase-b-smoke.mjs tests/v3-visual-game-polish-tranche18-static.mjs tests/v3-more-phase-b-smoke.mjs tests/v4-home-rail-smoke.mjs tests/v5-leader-center-smoke.mjs tests/v5-my-journey-smoke.mjs; do timeout 240s node "$test"; done
          timeout 240s node tests/v5-1-localization-stabilization-browser.mjs
