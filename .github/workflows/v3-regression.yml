name: BibleQuest v3 regression

on:
  workflow_dispatch:
  push:
    branches:
      - verify/v3.28-cloud-notes-bookkeeping-1b8cb0a

concurrency:
  group: biblequest-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b8cb0a4847b1fc633ce23412982c91c38825148
      - name: Verify exact bookkeeping candidate
        run: test "$(git rev-parse HEAD)" = "1b8cb0a4847b1fc633ce23412982c91c38825148"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce v3 architecture boundaries
        run: node scripts/validate-v3-architecture.mjs
      - name: Enforce Private Notes boundaries
        run: node scripts/validate-v3-private-notes.mjs
      - name: Enforce Cloud Notes boundaries
        run: node scripts/validate-v3-cloud-notes.mjs
      - name: Enforce STEPBible Context Lab boundaries
        run: node scripts/validate-v3-step-context.mjs
      - name: Enforce Japanese Kougo boundaries
        run: node scripts/validate-v3-japanese-kougo.mjs
      - name: Enforce Japanese vocabulary boundaries
        run: node scripts/validate-v3-japanese-vocabulary.mjs
      - name: Enforce NLT licensed-link boundaries
        run: node scripts/validate-v3-nlt-licensed.mjs
      - name: Enforce source-label provenance boundaries
        run: node scripts/validate-v3-source-labels.mjs
      - name: Enforce doctrinal-safety boundaries
        run: node scripts/validate-v3-doctrinal-safety.mjs
      - name: Run account transaction edge regression
        run: node tests/v3-account-edge.mjs
      - name: Run Bible data and reader edge regression
        run: node tests/v3-reader-edge.mjs
      - name: Run STEPBible lexical/context edge regression
        run: node tests/v3-step-context-edge.mjs
      - name: Run Japanese Kougo live-source edge regression
        run: node tests/v3-japanese-kougo-edge.mjs
      - name: Run Japanese vocabulary edge regression
        run: node tests/v3-japanese-vocabulary-edge.mjs
      - name: Run NLT licensed-link edge regression
        run: node tests/v3-nlt-licensed-edge.mjs
      - name: Run source-label provenance edge regression
        run: node tests/v3-source-labels-edge.mjs
      - name: Run doctrinal-safety edge regression
        run: node tests/v3-doctrinal-safety-edge.mjs
      - name: Run doctrinal context presentation edge regression
        run: node tests/v3-doctrinal-context-presentation-edge.mjs
      - name: Run progress edge regression
        run: node tests/v3-progress-edge.mjs
      - name: Run lesson engine edge regression
        run: node tests/v3-lesson-edge.mjs
      - name: Run Guided Study edge regression
        run: node tests/v3-study-edge.mjs
      - name: Run Deep Questions edge regression
        run: node tests/v3-deep-questions-edge.mjs
      - name: Run Story Journey edge regression
        run: node tests/v3-story-journey-edge.mjs
      - name: Run Wisdom Situations edge regression
        run: node tests/v3-wisdom-situations-edge.mjs
      - name: Run Adaptive Learning edge regression
        run: node tests/v3-adaptive-learning-edge.mjs
      - name: Run Adaptive review focus edge regression
        run: node tests/v3-adaptive-focus-edge.mjs
      - name: Run Open Review edge regression
        run: node tests/v3-open-review-edge.mjs
      - name: Run Private Notes edge regression
        run: node tests/v3-private-notes-edge.mjs
      - name: Run Cloud Notes edge regression
        run: node tests/v3-cloud-notes-edge.mjs
      - name: Run Daily Mission edge regression
        run: node tests/v3-daily-mission-edge.mjs
      - name: Run Transform engine edge regression
        run: node tests/v3-transform-edge.mjs
      - name: Run Basic Transform edge regression
        run: node tests/v3-transform-basic-edge.mjs
      - name: Run Audio and Recordings edge regression
        run: node tests/v3-recordings-edge.mjs
      - name: Run Media Library edge regression
        run: node tests/v3-media-library-edge.mjs
      - name: Run Recall Pack edge regression
        run: node tests/v3-recall-packs-edge.mjs
      - name: Run Games edge regression
        run: node tests/v3-games-edge.mjs
      - name: Run Games recall review interface regression
        run: node tests/v3-games-review-interface-edge.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start BibleQuest v3 locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblequest-v3-http.log 2>&1 &
          echo $! > /tmp/biblequest-v3-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/biblequest-v3-http.log
          exit 1
      - name: Run accumulated v3 shell/account regression
        run: timeout 240s node tests/v3-shell-smoke.mjs
      - name: Run v3 reader browser regression
        run: timeout 240s node tests/v3-reader-smoke.mjs
      - name: Run v3 STEPBible lexical/context browser regression
        run: timeout 240s node tests/v3-step-context-smoke.mjs
      - name: Run v3 Japanese Kougo mobile browser regression
        run: timeout 240s node tests/v3-japanese-kougo-smoke.mjs
      - name: Run v3 Japanese vocabulary mobile browser regression
        run: timeout 240s node tests/v3-japanese-vocabulary-smoke.mjs
      - name: Run v3 NLT licensed-link mobile browser regression
        run: timeout 240s node tests/v3-nlt-licensed-smoke.mjs
      - name: Run v3 source-label provenance mobile browser regression
        run: timeout 240s node tests/v3-source-labels-smoke.mjs
      - name: Run v3 doctrinal-safety mobile browser regression
        run: timeout 240s node tests/v3-doctrinal-safety-smoke.mjs
      - name: Run v3 doctrinal context presentation mobile browser regression
        run: timeout 240s node tests/v3-doctrinal-context-presentation-smoke.mjs
      - name: Run v3 progress browser regression
        run: timeout 240s node tests/v3-progress-smoke.mjs
      - name: Run v3 lesson engine browser regression
        run: timeout 240s node tests/v3-lesson-smoke.mjs
      - name: Run v3 Guided Study browser regression
        run: timeout 240s node tests/v3-study-smoke.mjs
      - name: Run v3 Deep Questions browser regression
        run: timeout 240s node tests/v3-deep-questions-smoke.mjs
      - name: Run v3 Story Journey browser regression
        run: timeout 240s node tests/v3-story-journey-smoke.mjs
      - name: Run v3 Wisdom Situations browser regression
        run: timeout 240s node tests/v3-wisdom-situations-smoke.mjs
      - name: Run v3 Adaptive Learning browser regression
        run: timeout 240s node tests/v3-adaptive-learning-smoke.mjs
      - name: Run v3 Open Review browser regression
        run: timeout 240s node tests/v3-open-review-smoke.mjs
      - name: Run v3 Private Notes mobile browser regression
        run: timeout 240s node tests/v3-private-notes-smoke.mjs
      - name: Run v3 Cloud Notes mobile browser regression
        run: timeout 240s node tests/v3-cloud-notes-smoke.mjs
      - name: Run v3 Daily Mission browser regression
        run: timeout 240s node tests/v3-daily-mission-smoke.mjs
      - name: Run v3 Transform engine browser regression
        run: timeout 240s node tests/v3-transform-engine-smoke.mjs
      - name: Run v3 Basic Transform browser regression
        run: timeout 240s node tests/v3-transform-basic-smoke.mjs
      - name: Run v3 Full Transform browser regression
        run: timeout 240s node tests/v3-transform-full-smoke.mjs
      - name: Run v3 Live Recordings browser regression
