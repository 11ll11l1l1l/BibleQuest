tests/v3-bible-world-smoke.mjs tests/v3-bible-world-artwork-smoke.mjs tests/v3-progress-smoke.mjs tests/v3-progress-phase-b-smoke.mjs tests/v4-progress-page-smoke.mjs tests/v3-lesson-smoke.mjs tests/v3-study-smoke.mjs tests/v3-deep-questions-smoke.mjs tests/v3-story-journey-smoke.mjs tests/v3-wisdom-situations-smoke.mjs tests/v3-adaptive-learning-smoke.mjs tests/v3-open-review-smoke.mjs tests/v3-private-notes-smoke.mjs tests/v3-cloud-notes-smoke.mjs tests/v3-congregation-membership-smoke.mjs tests/v3-daily-mission-smoke.mjs tests/v4-daily-journey-page-smoke.mjs tests/v3-transform-engine-smoke.mjs tests/v3-transform-basic-smoke.mjs tests/v3-transform-full-smoke.mjs tests/v3-recordings-smoke.mjs tests/v3-games-smoke.mjs tests/v3-kids-memory-browser.mjs tests/v3-calendar-smoke.mjs tests/v3-calendar-phase-b-smoke.mjs tests/v3-visual-game-polish-tranche18-static.mjs tests/v3-more-phase-b-smoke.mjs tests/v4-home-rail-smoke.mjs tests/v5-leader-center-smoke.mjs tests/v5-my-journey-smoke.mjs; do timeout 240s node "$test"; done
          timeout 240s node tests/v5-1-localization-stabilization-browser.mjs
