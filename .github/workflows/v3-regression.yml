name: BibleQuest v3 regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: biblequest-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Cloudflare deployment gate
        run: bash build.sh
      - name: Run accumulated architecture validators
        run: |
          for script in scripts/validate-v3-architecture.mjs scripts/validate-v3-private-notes.mjs scripts/validate-v3-cloud-notes.mjs scripts/validate-v3-congregation-membership.mjs scripts/validate-v3-operational-recovery.mjs scripts/validate-v3-client-diagnostics.mjs scripts/validate-v3-pwa-install.mjs scripts/validate-v3-offline-shell.mjs scripts/validate-v3-offline-bible-packs.mjs scripts/validate-v3-backup.mjs scripts/validate-v3-couples-family.mjs scripts/validate-v3-couples-cloud.mjs scripts/validate-v3-journey-groups.mjs scripts/validate-v3-encouragements.mjs scripts/validate-v3-community-bridge.mjs scripts/validate-v3-presence.mjs scripts/validate-v3-team-center.mjs scripts/validate-v3-trusted-score-events.mjs scripts/validate-v3-leaderboards.mjs scripts/validate-v3-congregation-recognition.mjs scripts/validate-v3-assignments.mjs scripts/validate-v3-advanced-assignments.mjs scripts/validate-v3-assignment-push.mjs scripts/validate-v3-ministry-hub.mjs scripts/validate-v3-notification-center.mjs scripts/validate-v3-workspace.mjs scripts/validate-v3-linked-activities.mjs scripts/validate-v3-personality-profile.mjs scripts/validate-v3-psychometrics.mjs scripts/validate-v3-step-context.mjs scripts/validate-v3-japanese-kougo.mjs scripts/validate-v3-japanese-vocabulary.mjs scripts/validate-v3-japanese-furigana.mjs scripts/validate-v3-nlt-licensed.mjs scripts/validate-v3-source-labels.mjs scripts/validate-v3-doctrinal-safety.mjs scripts/validate-v3-avatar-vault.mjs scripts/validate-v3-innovation-suite.mjs scripts/validate-v3-tutorial-onboarding.mjs scripts/validate-v3-tutorial-avatar-reactions.mjs scripts/validate-v3-accessibility.mjs scripts/validate-v3-content-reporting.mjs scripts/validate-v3-content-moderation.mjs scripts/validate-v3-content-review.mjs scripts/validate-v3-admin-console.mjs scripts/validate-v3-admin-operations.mjs scripts/validate-v3-reset-recovery.mjs scripts/validate-v3-same-room-play-together.mjs scripts/validate-v3-live-rooms.mjs scripts/validate-v3-bible-world.mjs scripts/validate-v3-bible-world-artwork.mjs scripts/validate-v3-kids-memory.mjs scripts/validate-v3-calendar.mjs; do node "$script"; done
      - name: Run accumulated edge regressions
        run: |
          for test in tests/v3-workflow-contract-edge.mjs tests/v4-bootstrap-order-edge.mjs tests/v4-foundation-static.mjs tests/v4-shell-static.mjs tests/v4-home-dashboard-static.mjs tests/v4-home-assignments-edge.mjs tests/v4-calendar-static.mjs tests/v4-assignments-static.mjs tests/v4-learn-composition-static.mjs tests/v4-reader-static.mjs tests/v4-games-avatar-static.mjs tests/v4-tranche13-static.mjs tests/v4-more-grouping-static.mjs tests/v4-home-rail-static.mjs tests/v4-tranche11-static.mjs tests/v4-community-family-static.mjs tests/v3-account-edge.mjs tests/v3-account-phase-b-static.mjs tests/v3-reader-edge.mjs tests/v3-offline-bible-packs-edge.mjs tests/v3-backup-edge.mjs tests/v3-couples-family-edge.mjs tests/v3-couples-cloud-edge.mjs tests/v3-journey-groups-edge.mjs tests/v3-encouragements-edge.mjs tests/v3-community-bridge-edge.mjs tests/v3-presence-edge.mjs tests/v3-team-center-edge.mjs tests/v3-trusted-score-events-edge.mjs tests/v3-leaderboards-edge.mjs tests/v3-congregation-recognition-edge.mjs tests/v3-assignments-edge.mjs tests/v3-advanced-assignments-edge.mjs tests/v3-assignment-push-edge.mjs tests/v3-assignment-response-auth-edge.mjs tests/v3-assignment-publish-auth-edge.mjs tests/v3-ministry-hub-edge.mjs tests/v3-notification-center-edge.mjs tests/v3-workspace-edge.mjs tests/v3-linked-activities-edge.mjs tests/v3-personality-profile-edge.mjs tests/v3-psychometrics-edge.mjs tests/v3-step-context-edge.mjs tests/v3-japanese-kougo-edge.mjs tests/v3-japanese-vocabulary-edge.mjs tests/v3-japanese-furigana-edge.mjs tests/v3-nlt-licensed-edge.mjs tests/v3-source-labels-edge.mjs tests/v3-doctrinal-safety-edge.mjs tests/v3-doctrinal-context-presentation-edge.mjs tests/v3-avatar-vault-edge.mjs tests/v3-avatar-vault-phase-b-static.mjs tests/v3-innovation-suite-edge.mjs tests/v3-tutorial-onboarding-edge.mjs tests/v3-tutorial-avatar-reactions-edge.mjs tests/v3-accessibility-edge.mjs tests/v3-content-reporting-edge.mjs tests/v3-content-moderation-edge.mjs tests/v3-content-review-edge.mjs tests/v3-admin-console-edge.mjs tests/v3-admin-operations-edge.mjs tests/v3-reset-recovery-edge.mjs tests/v3-same-room-play-together-edge.mjs tests/v3-live-rooms-edge.mjs tests/v3-bible-world-edge.mjs tests/v3-bible-world-artwork-edge.mjs tests/v3-progress-edge.mjs tests/v3-progress-phase-b-static.mjs tests/v3-lesson-edge.mjs tests/v3-study-edge.mjs tests/v3-deep-questions-edge.mjs tests/v3-story-journey-edge.mjs tests/v3-wisdom-situations-edge.mjs tests/v3-adaptive-learning-edge.mjs tests/v3-adaptive-focus-edge.mjs tests/v3-open-review-edge.mjs tests/v3-private-notes-edge.mjs tests/v3-cloud-notes-edge.mjs tests/v3-congregation-membership-edge.mjs tests/v3-operational-recovery-edge.mjs tests/v3-client-diagnostics-edge.mjs tests/v3-pwa-install-edge.mjs tests/v3-offline-shell-edge.mjs tests/v3-daily-mission-edge.mjs tests/v3-transform-edge.mjs tests/v3-transform-basic-edge.mjs tests/v3-recordings-edge.mjs tests/v3-media-library-edge.mjs tests/v3-recall-packs-edge.mjs tests/v3-games-edge.mjs tests/v3-games-review-interface-edge.mjs tests/v3-kids-memory-edge.mjs tests/v3-kids-memory-architecture.mjs tests/v3-kids-memory-ui-contract.mjs tests/v3-kids-memory-progress-integration.mjs tests/v3-kids-memory-round-id.mjs tests/v3-kids-memory-exit.mjs tests/v3-kids-memory-reward-curve.mjs tests/v3-kids-memory-api-surface.mjs tests/v3-kids-memory-invalid-input.mjs tests/v3-kids-memory-immutability.mjs tests/v3-kids-memory-no-xp.mjs tests/v3-kids-memory-width-contract.mjs tests/v3-kids-memory-delays.mjs tests/v3-calendar-edge.mjs tests/v3-calendar-phase-b-static.mjs tests/v3-mission-phase-b-static.mjs tests/v3-more-phase-b-static.mjs; do node "$test"; done
      - name: Syntax-check guarded field harnesses
        run: |
          node --check tests/v3-field-validation-harness.mjs
          node --check tests/v3-field-linked-assignment-harness.mjs
          node --check tests/v3-field-live-room-harness.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start BibleQuest v3 locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblequest-v3-http.log 2>&1 &
          echo $! > /tmp/biblequest-v3-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/biblequest-v3-http.log
          exit 1
      - name: Run accumulated browser/mobile regressions
        run: |
          for test in tests/v3-shell-smoke.mjs tests/v4-bootstrap-safety-net-smoke.mjs tests/v4-shell-keyboard-motion-smoke.mjs tests/v3-final-mobile-widths-smoke.mjs tests/v3-account-phase-b-smoke.mjs tests/v3-operational-recovery-smoke.mjs tests/v3-client-diagnostics-smoke.mjs tests/v3-pwa-install-smoke.mjs tests/v3-offline-shell-smoke.mjs tests/v3-offline-bible-packs-smoke.mjs tests/v3-backup-smoke.mjs tests/v3-couples-family-smoke.mjs tests/v3-couples-cloud-smoke.mjs tests/v3-journey-groups-smoke.mjs tests/v3-encouragements-smoke.mjs tests/v3-community-bridge-smoke.mjs tests/v3-presence-smoke.mjs tests/v3-team-center-smoke.mjs tests/v3-trusted-score-events-smoke.mjs tests/v3-leaderboards-smoke.mjs tests/v3-congregation-recognition-smoke.mjs tests/v3-assignments-smoke.mjs tests/v3-advanced-assignments-smoke.mjs tests/v4-assignments-page-smoke.mjs tests/v3-assignment-push-smoke.mjs tests/v3-ministry-hub-smoke.mjs tests/v3-notification-center-smoke.mjs tests/v3-workspace-smoke.mjs tests/v3-linked-activities-smoke.mjs tests/v3-personality-profile-smoke.mjs tests/v3-psychometrics-smoke.mjs tests/v3-reader-smoke.mjs tests/v3-step-context-smoke.mjs tests/v3-japanese-kougo-smoke.mjs tests/v3-japanese-vocabulary-smoke.mjs tests/v3-japanese-furigana-smoke.mjs tests/v3-nlt-licensed-smoke.mjs tests/v3-source-labels-smoke.mjs tests/v3-doctrinal-safety-smoke.mjs tests/v3-doctrinal-context-presentation-smoke.mjs tests/v3-avatar-vault-smoke.mjs tests/v3-avatar-vault-phase-b-smoke.mjs tests/v3-innovation-suite-smoke.mjs tests/v3-mission-phase-b-smoke.mjs tests/v3-tutorial-onboarding-smoke.mjs tests/v3-tutorial-avatar-reactions-smoke.mjs tests/v3-accessibility-smoke.mjs tests/v3-content-reporting-smoke.mjs tests/v3-content-review-smoke.mjs tests/v3-admin-console-smoke.mjs tests/v3-admin-operations-smoke.mjs tests/v3-reset-recovery-smoke.mjs tests/v3-same-room-play-together-smoke.mjs tests/v3-live-rooms-smoke.mjs tests/v3-bible-world-smoke.mjs tests/v3-bible-world-artwork-smoke.mjs tests/v3-progress-smoke.mjs tests/v3-progress-phase-b-smoke.mjs tests/v3-lesson-smoke.mjs tests/v3-study-smoke.mjs tests/v3-deep-questions-smoke.mjs tests/v3-story-journey-smoke.mjs tests/v3-wisdom-situations-smoke.mjs tests/v3-adaptive-learning-smoke.mjs tests/v3-open-review-smoke.mjs tests/v3-private-notes-smoke.mjs tests/v3-cloud-notes-smoke.mjs tests/v3-congregation-membership-smoke.mjs tests/v3-daily-mission-smoke.mjs tests/v3-transform-engine-smoke.mjs tests/v3-transform-basic-smoke.mjs tests/v3-transform-full-smoke.mjs tests/v3-recordings-smoke.mjs tests/v3-media-library-smoke.mjs tests/v3-games-smoke.mjs tests/v3-kids-memory-browser.mjs tests/v3-calendar-smoke.mjs tests/v3-calendar-phase-b-smoke.mjs tests/v3-visual-game-polish-tranche18-static.mjs tests/v3-more-phase-b-smoke.mjs tests/v4-home-rail-smoke.mjs; do timeout 240s node "$test"; done