name: BibleQuest v3 regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - v6/architecture-upgrade

concurrency:
  group: biblequest-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify workflow invocation contract
        run: node tests/v3-workflow-contract-edge.mjs

      - name: Declare inherited static compatibility index
