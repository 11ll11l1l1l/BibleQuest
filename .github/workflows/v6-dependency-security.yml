name: V6 Dependency Security
run-name: RC ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

on:
  pull_request:
    branches:
      - v6/architecture-upgrade
    paths:
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "scripts/v6-dependency-security.mjs"
      - ".github/workflows/v6-dependency-security.yml"
  push:
    branches:
      - v6/architecture-upgrade
    paths:
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "scripts/v6-dependency-security.mjs"
      - ".github/workflows/v6-dependency-security.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to run this gate against
        required: false
        type: string

permissions:
  contents: read

env:
  BQ_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

concurrency:
  group: v6-dependency-security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BQ_EXACT_SHA }}

      - name: Prove exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BQ_EXACT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${BQ_EXACT_SHA}"

      - name: Use pinned Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate pinned lockfile sources and integrity
        run: npm run check:v6-dependency-security

      - name: Audit npm advisories at high or critical severity
        run: npm audit --audit-level=high
