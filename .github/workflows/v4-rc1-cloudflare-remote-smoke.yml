name: V4 RC1 Cloudflare remote smoke

on:
  push:
    branches:
      - verify/v4-rc1-cloudflare-smoke

permissions:
  contents: read

jobs:
  remote-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://9748307b.mybiblequest.pages.dev
      EXPECTED_RC: cf58fa2e467f70f1c4a963b4ca50e33f11da9983
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed static entry points
        run: |
          set -euo pipefail
          curl --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 -fsS "$BASE_URL/" -o /tmp/index.html
          grep -q '<title>BibleQuest</title>' /tmp/index.html
          grep -q 'src/app/bootstrap.js' /tmp/index.html
          grep -q 'section-h-release-gates-v4.css' /tmp/index.html
          curl --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 -fsS "$BASE_URL/manifest.webmanifest" -o /tmp/manifest.webmanifest
          curl --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 -fsS "$BASE_URL/offline-shell-sw.js" -o /tmp/offline-shell-sw.js
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('/tmp/manifest.webmanifest','utf8')); if(!m.name||!m.start_url||!m.icons?.length) process.exit(1); console.log('manifest',m.name,m.start_url,m.icons.length)"
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run remote browser/PWA smoke
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const routes = ['home','reader','play','assignments','calendar','community','backup','more','account','grow'];
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:390,height:844}, locale:'en-US'});
          const page = await context.newPage();
          const pageErrors=[];
          page.on('pageerror',err=>pageErrors.push(String(err?.message||err)));

          async function assertRoute(route){
            const response=await page.goto(`${base}/#/${route}`,{waitUntil:'domcontentloaded',timeout:45000});
            if(response && !response.ok()) throw new Error(`${route}: navigation HTTP ${response.status()}`);
            await page.waitForTimeout(1200);
            const state=await page.evaluate(()=>({
              appText:(document.querySelector('#app')?.innerText||'').trim(),
              startupFailure:!!document.querySelector('[data-startup-failure]'),
              notFound:(document.querySelector('#app')?.innerText||'').includes('Page not found'),
              bodyWidth:document.body.scrollWidth,
              viewportWidth:window.innerWidth,
              route:location.hash
            }));
            if(!state.appText) throw new Error(`${route}: #app is blank`);
            if(state.startupFailure) throw new Error(`${route}: startup failure rendered`);
            if(state.notFound) throw new Error(`${route}: fell through to not-found`);
            if(state.bodyWidth > state.viewportWidth + 2) throw new Error(`${route}: horizontal overflow ${state.bodyWidth}>${state.viewportWidth}`);
            if(!state.route.includes(route)) throw new Error(`${route}: wrong route ${state.route}`);
            console.log('PASS route',route,'text',state.appText.length,'width',state.bodyWidth+'/'+state.viewportWidth);
          }

          for(const route of routes) await assertRoute(route);

          await page.goto(`${base}/#/home`,{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForTimeout(1200);
          if(!(await page.locator('[data-home-assignments]').count())) throw new Error('home assignment/status surface missing');
          if(!(await page.locator('[data-home-rail]').count())) throw new Error('home shortcut rail missing');
          await page.locator('[data-home-rail-item="grow"]').click();
          await page.waitForSelector('[data-progress-page]',{timeout:10000});
          if(location?.hash===undefined){}
          console.log('PASS home shortcut rail -> Grow');

          await page.goto(`${base}/#/play`,{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForSelector('[data-memory-open]',{timeout:10000});
          await page.locator('[data-memory-open]').click();
          await page.waitForSelector('[data-memory-meadow]',{timeout:10000});
          console.log('PASS game launch Memory Meadow');
          await page.locator('[data-game-launcher]').click();
          await page.waitForSelector('[data-memory-open]',{timeout:10000});
          console.log('PASS game return to launcher');

          await page.goto(`${base}/#/home`,{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForTimeout(2500);
          const sw=await page.evaluate(async()=>{
            if(!('serviceWorker' in navigator)) return {supported:false};
            const registration=await Promise.race([
              navigator.serviceWorker.ready,
              new Promise((_,reject)=>setTimeout(()=>reject(new Error('service worker ready timeout')),15000))
            ]);
            return {supported:true,active:!!registration.active,scope:registration.scope};
          });
          if(!sw.supported || !sw.active) throw new Error(`service worker not active: ${JSON.stringify(sw)}`);
          console.log('PASS service worker',sw.scope);

          await context.setOffline(true);
          await page.reload({waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(1000);
          const offline=await page.evaluate(()=>({
            appText:(document.querySelector('#app')?.innerText||'').trim(),
            startupFailure:!!document.querySelector('[data-startup-failure]'),
            online:navigator.onLine
          }));
          if(!offline.appText || offline.startupFailure || offline.online) throw new Error(`offline reload failed: ${JSON.stringify(offline)}`);
          console.log('PASS offline reload',offline.appText.length);
          await context.setOffline(false);

          if(pageErrors.length) throw new Error(`page errors: ${pageErrors.join(' | ')}`);
          await browser.close();
          console.log('REMOTE_STAGING_SMOKE_PASS', process.env.EXPECTED_RC, base);
          NODE
