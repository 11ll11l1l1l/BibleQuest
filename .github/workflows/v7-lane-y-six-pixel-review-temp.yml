name: V7 Lane Y Six Candidate Pixel Review (temporary)
on:
  push:
    branches: [v7/lane-y-six-candidate-pixel-review-20261011]
jobs:
  source-locked-pixel-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.0.0'
      - name: Inspect six pinned candidate branch WebP sources
        run: python scripts/v7-lane-y-six-pixel-review-temp.py
      - name: Upload isolated source pixel and mobile QA samples
        uses: actions/upload-artifact@v4
        with:
          name: lane-y-six-pixel-review-${{ github.sha }}
          path: artifacts/v7/lane-y-six-pixel-review
          retention-days: 3
