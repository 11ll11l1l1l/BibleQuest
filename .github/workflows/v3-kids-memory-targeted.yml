name: BibleQuest v3 Kids Memory targeted

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/core/progress.js
          node --check src/features/games/memory.js
          node --check src/app/kids-memory.js
          node --check src/app/games.js
          node --check src/features/games/index.js
      - name: Progress regression
        run: node tests/v3-progress-edge.mjs
      - name: Memory Meadow edge regression
        run: node tests/v3-kids-memory-edge.mjs
      - name: Memory Meadow architecture regression
        run: node tests/v3-kids-memory-architecture.mjs
      - name: Memory Meadow UI contract regression
        run: node tests/v3-kids-memory-ui-contract.mjs
