name: BibleQuest v3 workspace notes schema repair builder

on:
  push:
    branches:
      - verify/v3-workspace-notes-schema-builder-20260911
    paths:
      - .github/workflows/v3-workspace-notes-schema-builder.yml

permissions:
  contents: write

jobs:
  patch-and-focus-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/v3-workspace-notes-schema-builder-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic schema compatibility repair
        run: |
          python3 <<'PY'
          from pathlib import Path

          api=Path('src/core/api.js')
          text=api.read_text()
          old="const CLOUD_NOTE_FIELDS='id,user_id,book,chapter,verse_start,verse_end,title,content,tags,note_type,is_pinned,created_at,updated_at';"
          new="""const CLOUD_NOTE_DB_FIELDS='id,user_id,title,book_code,book_name,chapter,verse_start,verse_end,body,note_type,tags,pinned,created_at,updated_at';
          const CLOUD_NOTE_TYPES=new Set(['study','prayer','question','reflection','sermon','other']);
          function cloudNoteFromDb(row){
            if(!row)return row;
            const {book_code:bookCode,book_name:bookName,body,pinned,...rest}=row;
            return {...rest,book:bookCode||bookName||'',content:String(body??''),is_pinned:pinned===true};
          }
          function cloudNoteToDb(payload={}){
            const book=String(payload.book??'').trim();
            const bookCode=/^[A-Z0-9]{3}$/.test(book)?book:null;
            const noteType=String(payload.note_type??'study').trim();
            const next={
              title:payload.title??null,
              book_code:bookCode,
              book_name:bookCode?null:(book||null),
              chapter:payload.chapter??null,
              verse_start:payload.verse_start??null,
              verse_end:payload.verse_end??null,
              body:String(payload.content??''),
              note_type:CLOUD_NOTE_TYPES.has(noteType)?noteType:'study',
              tags:Array.isArray(payload.tags)?payload.tags:[],
              pinned:payload.is_pinned===true
            };
            if(Object.prototype.hasOwnProperty.call(payload,'updated_at'))next.updated_at=payload.updated_at;
            return next;
          }"""
          assert old in text, 'cloud note field contract anchor changed'
          text=text.replace(old,new,1)
          old_block="""  const cloudNotes = Object.freeze({
            async list(userId) {
              const client=await getClient();
              const {data,error}=await client.from('bible_notes').select(CLOUD_NOTE_FIELDS).eq('user_id',userId).order('is_pinned',{ascending:false}).order('updated_at',{ascending:false});
              if(error)throw error;
              return data||[];
            },
            async create(userId,payload) {
              const client=await getClient();
              const {data,error}=await client.from('bible_notes').insert({...payload,user_id:userId}).select(CLOUD_NOTE_FIELDS).single();
              if(error)throw error;
              return data;
            },
            async update(userId,id,expectedUpdatedAt,payload) {
              const client=await getClient();
              const {data,error}=await client.from('bible_notes').update(payload).eq('id',id).eq('user_id',userId).eq('updated_at',expectedUpdatedAt).select(CLOUD_NOTE_FIELDS).maybeSingle();
              if(error)throw error;
              return data||null;
            },
            async remove(userId,id,expectedUpdatedAt) {
              const client=await getClient();
              const {data,error}=await client.from('bible_notes').delete().eq('id',id).eq('user_id',userId).eq('updated_at',expectedUpdatedAt).select('id').maybeSingle();
              if(error)throw error;
              return data||null;
            }
          });"""
          new_block="""  const cloudNotes = Object.freeze({
            async list(userId) {
              const client=await getClient();
              const {data,error}=await client.from('bible_notes').select(CLOUD_NOTE_DB_FIELDS).eq('user_id',userId).order('pinned',{ascending:false}).order('updated_at',{ascending:false});
              if(error)throw error;
              return (data||[]).map(cloudNoteFromDb);
            },
            async create(userId,payload) {
              const client=await getClient();
              const {data,error}=await client.from('bible_notes').insert({...cloudNoteToDb(payload),user_id:userId}).select(CLOUD_NOTE_DB_FIELDS).single();
              if(error)throw error;
              return cloudNoteFromDb(data);
            },
            async update(userId,id,expectedUpdatedAt,payload) {
              const client=await getClient();
              const {data,error}=await client.from('bible_notes').update(cloudNoteToDb(payload)).eq('id',id).eq('user_id',userId).eq('updated_at',expectedUpdatedAt).select(CLOUD_NOTE_DB_FIELDS).maybeSingle();
              if(error)throw error;
              return cloudNoteFromDb(data||null);
            },
            async remove(userId,id,expectedUpdatedAt) {
              const client=await getClient();
              const {data,error}=await client.from('bible_notes').delete().eq('id',id).eq('user_id',userId).eq('updated_at',expectedUpdatedAt).select('id').maybeSingle();
              if(error)throw error;
              return data||null;
            }
          });"""
          assert old_block in text, 'cloud notes API block anchor changed'
          api.write_text(text.replace(old_block,new_block,1))

          app=Path('src/app/cloud-notes.js')
          text=app.read_text()
          old="return Object.freeze({book,chapter,verseStart,verseEnd,title,content,tags:tags(input.tags),noteType:text(input.noteType||'general',40)||'general',isPinned:input.isPinned===true});"
          new="const requestedType=text(input.noteType||'study',40)||'study',noteType=requestedType==='general'?'study':requestedType;if(!['study','prayer','question','reflection','sermon','other'].includes(noteType))throw new Error('Choose a supported cloud note type.');return Object.freeze({book,chapter,verseStart,verseEnd,title,content,tags:tags(input.tags),noteType,isPinned:input.isPinned===true});"
          assert old in text, 'cloud notes service default anchor changed'
          app.write_text(text.replace(old,new,1))

          feature=Path('src/features/cloud-notes/index.js')
          text=feature.read_text()
          old="noteType:'general'"
          assert old in text, 'cloud notes UI note type anchor changed'
          feature.write_text(text.replace(old,"noteType:'study'",1))

          test=Path('tests/v3-workspace-notes-schema-compat.mjs')
          test.write_text("""import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const api=fs.readFileSync(new URL('../src/core/api.js',import.meta.url),'utf8');
          const app=fs.readFileSync(new URL('../src/app/cloud-notes.js',import.meta.url),'utf8');
          const feature=fs.readFileSync(new URL('../src/features/cloud-notes/index.js',import.meta.url),'utf8');
          const expected=['book_code','book_name','body','pinned'];
          for(const field of expected)assert(api.includes(field),`Cloud Notes API is missing deployed bible_notes field ${field}.`);
          assert(api.includes("order('pinned'"),'Cloud Notes list must order by deployed pinned field.');
          assert(api.includes('cloudNoteFromDb')&&api.includes('cloudNoteToDb'),'Cloud Notes must keep schema adaptation inside the shared API owner.');
          assert(api.includes("book:bookCode||bookName||''")&&api.includes("content:String(body??'')")&&api.includes('is_pinned:pinned===true'),'Database rows are not adapted back to the canonical Cloud Notes model.');
          assert(api.includes('book_code:bookCode')&&api.includes("body:String(payload.content??'')")&&api.includes('pinned:payload.is_pinned===true'),'Canonical Cloud Notes writes are not adapted to the deployed database schema.');
          assert(!api.includes("order('is_pinned'"),'Stale is_pinned database ordering remains.');
          assert(!api.includes("select(CLOUD_NOTE_FIELDS)"),'Stale pre-schema Cloud Notes projection remains.');
          assert(app.includes("input.noteType||'study'")&&app.includes("requestedType==='general'?'study':requestedType"),'Cloud Notes service must normalize the retired general type to deployed study.');
          assert(feature.includes("noteType:'study'")&&!feature.includes("noteType:'general'"),'Cloud Notes UI must submit a deployed note_type value.');
          console.log('BibleQuest v3 Workspace/Cloud Notes deployed-schema compatibility regression passed.');
          """)

          edge=Path('tests/v3-cloud-notes-edge.mjs')
          text=edge.read_text()
          anchor="assert(created.title==='No separation'&&created.content==='Nothing can separate us.'&&created.tags.join(',')==='hope,study'&&created.isPinned===true,'Cloud Notes did not normalize note metadata.');"
          assert anchor in text, 'cloud notes edge anchor changed'
          edge.write_text(text.replace(anchor,anchor+"\nassert(created.noteType==='study','Cloud Notes must default to the deployed study note_type.');",1))
          PY
      - name: Focused Cloud Notes and Workspace regressions
        run: |
          node tests/v3-workspace-notes-schema-compat.mjs
          node tests/v3-cloud-notes-edge.mjs
          node tests/v3-workspace-edge.mjs
          node --check src/core/api.js
          node --check src/app/cloud-notes.js
          node --check src/features/cloud-notes/index.js
      - name: Commit verified repair to builder branch
        run: |
          git config user.name "BibleQuest release verifier"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/api.js src/app/cloud-notes.js src/features/cloud-notes/index.js tests/v3-cloud-notes-edge.mjs tests/v3-workspace-notes-schema-compat.mjs
          git commit -m "fix(v3): align Workspace cloud notes with deployed schema"
          git push origin HEAD:verify/v3-workspace-notes-schema-builder-20260911
