<!doctype html>
<html lang="en-PH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e9">
<meta name="description" content="BibleQuest Transform — private personality reflection, thinking patterns, and personal development.">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="transformation-v2.css">
<title>BibleQuest Transform</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f1e9;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263128}
html:not(.bq-account-confirmed) body{visibility:hidden}
.bq-transform-load-failure{max-width:560px;margin:15vh auto;padding:24px 18px;text-align:center}.bq-transform-load-failure a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;background:#355746;color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<noscript><main class="bq-transform-load-failure"><h1>Transform needs JavaScript</h1><p>Return to BibleQuest and try again after JavaScript is available.</p><a href="./">Return to BibleQuest</a></main></noscript>
<script src="cloud-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<script src="standalone-account-gate.js"></script>
<script src="transformation-v2.js"></script>
<script>
(async function(){
  'use strict';
  var RETURN_KEY='bq_transform_return_action';
  if(!await window.BQStandaloneGate?.ready)return;
  function homeUrl(){return new URL('./',location.href).href;}
  function returnHome(){
    try{var ref=document.referrer?new URL(document.referrer):null;if(ref&&ref.origin===location.origin&&history.length>1){history.back();return;}}catch(_err){}
    location.replace(homeUrl());
  }
  function openMain(action){sessionStorage.setItem(RETURN_KEY,action);location.assign(homeUrl());}
  function showFailure(){document.body.innerHTML='<main class="bq-transform-load-failure" role="alert"><h1>Transform could not start</h1><p>The reflection tools did not load correctly. Return to BibleQuest and try again.</p><a href="./">Return to BibleQuest</a></main>';}
  if(!window.BQ_TRANSFORMATION||typeof window.BQ_TRANSFORMATION.open!=='function'){showFailure();return;}
  window.BQ_TRANSFORMATION.open();
  var root=document.querySelector('.bq-transform-v2');if(!root){showFailure();return;}
  root.addEventListener('click',function(event){var target=event.target instanceof Element?event.target:null;if(!target)return;if(target.closest('[data-t2-close]')){event.preventDefault();event.stopImmediatePropagation();returnHome();return}if(target.closest('[data-t2-reader]')){event.preventDefault();event.stopImmediatePropagation();openMain('reader');return}if(target.closest('[data-t2-wisdom]')){event.preventDefault();event.stopImmediatePropagation();openMain('wisdom')}},true);
  root.addEventListener('keydown',function(event){if(event.key!=='Escape')return;event.preventDefault();event.stopImmediatePropagation();returnHome()},true);
})();
</script>
</body>
</html>
