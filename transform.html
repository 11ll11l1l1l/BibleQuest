<!doctype html>
<html lang="en-PH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e9">
<meta name="description" content="BibleQuest Transform — private personality reflection, thinking patterns, and personal development.">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="transformation-v2.css">
<title>BibleQuest Transform</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f1e9;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263128}
html:not(.bq-account-confirmed) body{visibility:hidden}
.bq-transform-load-failure{max-width:560px;margin:15vh auto;padding:24px 18px;text-align:center}.bq-transform-load-failure .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.bq-transform-load-failure a,.bq-transform-load-failure button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:#355746;color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.bq-transform-load-failure small{display:block;margin-top:14px;opacity:.62}
</style>
</head>
<body>
<noscript><main class="bq-transform-load-failure"><h1>Transform needs JavaScript</h1><p>Return to BibleQuest and try again after JavaScript is available.</p><a href="./">Return to BibleQuest</a></main></noscript>
<script src="cloud-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<script src="standalone-account-gate.js"></script>
<script src="transformation-v2.js"></script>
<script>
(async function(){
  'use strict';
  var RETURN_KEY='bq_transform_return_action';
  var RUNTIME_URL='transformation-v2.js';
  var GATE_TIMEOUT_MS=8000;
  var RECOVERY_TIMEOUT_MS=8000;

  function homeUrl(){return new URL('./',location.href).href;}
  function returnHome(){
    try{var ref=document.referrer?new URL(document.referrer):null;if(ref&&ref.origin===location.origin&&history.length>1){history.back();return;}}catch(_err){}
    location.replace(homeUrl());
  }
  function openMain(action){sessionStorage.setItem(RETURN_KEY,action);location.assign(homeUrl());}
  function runtimeApi(){
    var api=window.BQ_TRANSFORMATION;
    return api&&api.mode==='rebuilt-v2'&&typeof api.open==='function'?api:null;
  }
  function clearRuntime(){
    try{delete window.BQ_TRANSFORMATION}catch(_err){window.BQ_TRANSFORMATION=undefined}
    document.querySelector('.bq-transform-v2')?.remove();
    document.body.classList.remove('bq-transform-v2-open');
  }
  function loadFreshRuntime(){
    return new Promise(function(resolve,reject){
      clearRuntime();
      var script=document.createElement('script');
      var done=false;
      var finish=function(error){
        if(done)return;done=true;clearTimeout(timer);
        if(error)reject(error);else resolve(runtimeApi());
      };
      var timer=setTimeout(function(){finish(new Error('runtime-timeout'));},RECOVERY_TIMEOUT_MS);
      script.dataset.bqTransformRecovery='1';
      script.src=RUNTIME_URL+'?bq-recover='+Date.now();
      script.onload=function(){var api=runtimeApi();if(api)finish();else finish(new Error('runtime-interface'));};
      script.onerror=function(){finish(new Error('runtime-load'));};
      document.head.appendChild(script);
    });
  }
  async function recoverAndOpen(){
    try{
      var api=await loadFreshRuntime();
      if(!api)return null;
      api.open();
      return document.querySelector('.bq-transform-v2');
    }catch(_err){return null;}
  }
  function showFailure(code,message){
    document.documentElement.classList.add('bq-account-confirmed');
    document.body.innerHTML='<main class="bq-transform-load-failure" role="alert"><h1>Transform could not start</h1><p>'+message+'</p><div class="actions"><button type="button" data-bq-transform-retry>Try Transform again</button><a href="./">Return to BibleQuest</a></div><small>Diagnostic '+code+'</small></main>';
    document.querySelector('[data-bq-transform-retry]')?.addEventListener('click',function(){location.replace(location.pathname+'?bq-retry='+Date.now());});
  }
  async function waitForAccountGate(){
    var gate=window.BQStandaloneGate?.ready;
    if(!gate){showFailure('T-GATE-MISSING','BibleQuest could not verify your account for Transform. Please retry from the main app.');return false;}
    var result=await Promise.race([
      Promise.resolve(gate).then(Boolean).catch(function(){return false;}),
      new Promise(function(resolve){setTimeout(function(){resolve('timeout');},GATE_TIMEOUT_MS);})
    ]);
    if(result==='timeout'){showFailure('T-GATE-TIMEOUT','Account verification took too long, so Transform stopped instead of leaving a blank screen.');return false;}
    return result;
  }

  if(!await waitForAccountGate())return;

  var api=runtimeApi();
  var root=null;
  if(api){
    try{api.open();root=document.querySelector('.bq-transform-v2');}catch(_err){}
  }
  if(!root)root=await recoverAndOpen();
  if(!root){showFailure(api?'T-ROOT':'T-RUNTIME','BibleQuest tried a clean runtime recovery but the reflection tools are still unavailable.');return;}

  root.addEventListener('click',function(event){var target=event.target instanceof Element?event.target:null;if(!target)return;if(target.closest('[data-t2-close]')){event.preventDefault();event.stopImmediatePropagation();returnHome();return}if(target.closest('[data-t2-reader]')){event.preventDefault();event.stopImmediatePropagation();openMain('reader');return}if(target.closest('[data-t2-wisdom]')){event.preventDefault();event.stopImmediatePropagation();openMain('wisdom')}},true);
  root.addEventListener('keydown',function(event){if(event.key!=='Escape')return;event.preventDefault();event.stopImmediatePropagation();returnHome()},true);
})();
</script>
</body>
</html>
